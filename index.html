<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..500&family=IBM+Plex+Mono:wght@400&family=Noto+Sans+SC:wght@300;400&display=swap" rel="stylesheet">
<style>
  /* the prologue: the sun from the loading page is the hub; the kingdom runs off one side of it, the people off the other;
     the story is read one beat at a time under it */
  :root{ --bg:#ece2d5; --ink:#3a322a; --dim:#7a6c5c; --line:rgba(58,50,42,.5); --faint:rgba(58,50,42,.18); --sun:#94703f;
    --veil:radial-gradient(110% 90% at 10% -10%, rgba(240,246,196,.3), rgba(240,246,196,0) 60%);
    --wide:"Helvetica Neue","Inter",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace; --sans:"Noto Sans SC","PingFang SC",sans-serif; color-scheme:light }
  html{ font-size:clamp(12px, min(1.1111vw, 1.7778vh), 26px) }
  html,body{ margin:0; background:var(--bg); color:var(--ink) }
  body{ font-family:var(--sans); min-height:100vh; min-height:100svh; overflow-x:hidden; transition:opacity .7s ease }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; background:var(--veil) }
  body.leaving{ opacity:0 }
  a{ color:inherit; text-decoration:none }

  .topbar{ position:fixed; z-index:4; left:4vw; right:4vw; top:1.375rem; display:flex; align-items:center }
  .mark{ font-family:var(--wide); font-weight:400; letter-spacing:.34em; font-size:.875rem }

  .col{ position:relative; min-height:100vh; min-height:100svh; box-sizing:border-box; padding:4rem 16px 3rem;
    display:flex; flex-direction:column; align-items:center; justify-content:center }

  /* the hub: kingdom — sun — people */
  .hub{ display:flex; align-items:center; gap:1.6rem }
  .way{ display:flex; align-items:center; gap:1rem; font-family:var(--mono); font-size:.68rem; letter-spacing:.24em; transition:color .3s }
  .way small{ display:block; font-family:var(--sans); font-size:.62rem; letter-spacing:.2em; color:var(--dim); margin-top:.35rem; transition:color .3s }
  .way i{ display:block; width:6.5rem; height:1px; background:var(--line); transition:width .45s cubic-bezier(.2,.7,.2,1), background .3s }
  .way.l{ text-align:right }
  .way:hover i, .way:focus-visible i{ width:7.6rem; background:var(--sun) }
  .way:hover small, .way:focus-visible small{ color:var(--sun) }
  .way:focus-visible{ outline:none }

  .sun{ width:15rem; height:15rem; color:var(--sun); }
  #turn{ transition:transform 1.4s cubic-bezier(.3,.1,.2,1) }
  .sun svg{ display:block; width:100%; height:100%; overflow:visible }
  .sun g{ fill:none; stroke:currentColor; stroke-linecap:round }
  .ld-o{ animation:spin 80s linear infinite reverse } .ld-r{ animation:spin 26s linear infinite } .ld-i{ animation:spin 40s linear infinite reverse } .ld-c{ animation:breathe 4.5s ease-in-out infinite }
  @keyframes spin{ to{ transform:rotate(360deg) } } @keyframes breathe{ 50%{ opacity:.55 } }

  /* the story: every beat sits in the same cell, so the height never jumps; one is shown */
  .text{ display:grid; width:30rem; max-width:100%; margin-top:2.6rem; cursor:pointer }
  .text p{ grid-area:1/1; margin:0; font-size:.9rem; line-height:2.05; font-weight:300; text-align:center; text-wrap:pretty; letter-spacing:.03em;
    opacity:0; transform:translateY(.4rem); transition:opacity .7s ease, transform .9s cubic-bezier(.2,.7,.2,1); pointer-events:none }
  .text p.on{ opacity:1; transform:none; pointer-events:auto }
  .text a{ border-bottom:1px dotted var(--sun); padding-bottom:1px; transition:color .3s }
  .text a:hover{ color:var(--sun) }

  .beats{ display:flex; gap:2.2rem; margin-top:2.2rem }
  .beats button{ all:unset; cursor:pointer; font-family:var(--wide); font-weight:300; font-size:.75rem; letter-spacing:.12em; color:var(--dim);
    padding:0 .15rem .35rem; border-bottom:1px solid transparent; transition:color .3s, border-color .3s }
  .beats button:hover{ color:var(--ink) }
  .beats button[aria-current="true"]{ color:var(--ink); border-color:var(--sun) }
  .beats button:focus-visible{ outline:1px solid var(--ink); outline-offset:3px }

  /* arriving: the loading page's count under the sun; when it is full it goes, and the ways and the words come */
  .boot{ grid-area:1/1; justify-self:center; align-self:start; width:12rem; margin-top:1.2rem; display:flex; flex-direction:column; gap:.7rem; transition:opacity .6s ease }
  .ld-meta{ display:flex; justify-content:space-between; font:400 .62rem/1 var(--mono); letter-spacing:.42em; color:var(--dim) }
  .ld-meta b{ font-weight:400; letter-spacing:.2em; color:var(--sun) }
  .ld-bar{ height:1px; background:var(--faint); position:relative; overflow:hidden }
  .ld-fill{ position:absolute; inset:0; background:var(--sun); transform-origin:left center; transform:scaleX(0) }
  .way, .beats{ transition:opacity 1.1s ease }
  body:not(.ready) .way, body:not(.ready) .beats{ opacity:0; pointer-events:none }
  body:not(.ready) .text p.on{ opacity:0 }
  body.ready .boot{ opacity:0; pointer-events:none }
  .way.l{ transition-delay:.25s } .way:not(.l){ transition-delay:.4s } .beats{ transition-delay:.7s }

  @media (max-width: 760px){
    .hub{ flex-wrap:wrap; justify-content:center; gap:1.4rem 2.4rem }
    .hub .sun{ order:-1; flex-basis:100%; display:flex; justify-content:center; height:auto } .hub .sun svg{ width:13rem; height:13rem }
    .way i{ display:none } .way.l{ text-align:center } .way{ text-align:center }
    .text p{ font-size:1rem } }
  @media (prefers-reduced-motion: reduce){ .ld-o,.ld-r,.ld-i,.ld-c{ animation:none } .way,.beats,.boot{ transition:none } .text p{ transition:none } body,#turn{ transition:none } }
</style>
</head>
<body>
<header class="topbar"><a class="mark" href="index.html">HELIOS</a></header>
<main class="col">
  <div class="hub">
    <a class="way l" href="houses.html#map" data-fade><span>THE KINGDOM<small>王国</small></span><i></i></a>
    <div class="sun" id="sun" aria-hidden="true"><svg viewBox="-100 -100 200 200">
      <defs><radialGradient id="ldGlow"><stop offset="0" stop-color="currentColor" stop-opacity=".22"/><stop offset=".55" stop-color="currentColor" stop-opacity=".06"/><stop offset="1" stop-color="currentColor" stop-opacity="0"/></radialGradient></defs>
      <circle r="78" fill="url(#ldGlow)"/><g id="turn"><g class="ld-o"></g><g class="ld-r"></g><g class="ld-i"></g><g class="ld-c"></g></g></svg></div>
    <a class="way" href="characters.html"><i></i><span>CHARACTERS<small>人物</small></span></a>
  </div>
  <article class="text" id="text" aria-live="polite" title="点击继续"><div class="boot" id="boot" aria-label="加载中"><div class="ld-meta"><span>HELIOS</span><b id="ldNum">000</b></div><div class="ld-bar"><div class="ld-fill" id="ldFill"></div></div></div></article>
  <nav class="beats" id="beats" aria-label="序章段落"></nav>
</main>
<script>
/* the loading page's sun, drawn the same way */
function drawSun(S){
  const NS="http://www.w3.org/2000/svg", T=Math.PI*2, P=(a,r)=>[Math.sin(a)*r,-Math.cos(a)*r], f=n=>n.toFixed(2);
  const el=(tag,at,par)=>{ const e=document.createElementNS(NS,tag); for(const k in at) e.setAttribute(k,at[k]); par.appendChild(e); return e; };
  const seg=(a,r1,r2)=>{ const [x1,y1]=P(a,r1),[x2,y2]=P(a,r2); return `M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`; };
  const go=S.querySelector(".ld-o"), gr=S.querySelector(".ld-r"), gi=S.querySelector(".ld-i"), gc=S.querySelector(".ld-c");
  el("circle",{r:95,"stroke-width":.5},go); el("circle",{r:90.5,"stroke-width":.3},go);
  let d=""; for(let i=0;i<120;i++){ const a=i/120*T; d+= i%10===0 ? seg(a,87.5,95) : seg(a,90.5, i%5===0?93.8:92.6); } el("path",{d,"stroke-width":.32},go);
  for(let i=0;i<12;i++){ const [x,y]=P((i+.5)/12*T,84); el("circle",{cx:f(x),cy:f(y),r:1.15,"stroke-width":.35},go); }
  for(let i=0;i<32;i++){ const a=i/32*T;
    if(i%2===0){ const L=i%4===0?80:71, w=.052, [ax,ay]=P(a-w,39),[bx,by]=P(a+w,39),[tx,ty]=P(a,L);
      el("path",{d:`M${f(ax)} ${f(ay)}L${f(tx)} ${f(ty)}L${f(bx)} ${f(by)}`,"stroke-width":.5,"stroke-linejoin":"round"},gr); el("path",{d:seg(a,42,L-7),"stroke-width":.22},gr);
    } else { let p=""; for(let s=0;s<=48;s++){ const u=s/48, off=Math.sin(u*Math.PI*3.4)*.07*(1-u*.65); const [x,y]=P(a+off,39+u*28); p+=(s?"L":"M")+f(x)+" "+f(y); } el("path",{d:p,"stroke-width":.55},gr); } }
  el("circle",{r:36,"stroke-width":.8},gi); el("circle",{r:32.5,"stroke-width":.3},gi);
  d=""; for(let i=0;i<72;i++) d+=seg(i/72*T,32.5,36); el("path",{d,"stroke-width":.22},gi);
  for(let i=0;i<24;i++){ const [x,y]=P(i/24*T,28.5); el("circle",{cx:f(x),cy:f(y),r:.55,fill:"currentColor",stroke:"none"},gi); }
  el("circle",{r:15,"stroke-width":.6},gc); el("circle",{r:12,"stroke-width":.28},gc);
  d=""; for(let i=0;i<16;i++) d+=seg(i/16*T,4.2,i%2?7.8:10.6); el("path",{d,"stroke-width":.35},gc);
  el("circle",{r:2.2,fill:"currentColor",stroke:"none"},gc);
}
drawSun(document.querySelector("#sun svg"));

/* the words live in content/序章.md, one beat per paragraph. Names in them open their pages (first time each appears) */
const LINKS=[["Iris Lyren","characters.html#iris"],["Aurelia Helios","characters.html#aurelia"],["Aurelia","characters.html#aurelia"],["五大贵族","houses.html#map"],["Helios 家族","houses.html#map"]];
const ROM=["I","II","III","IV","V","VI","VII","VIII"];
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const text=document.getElementById("text"), beats=document.getElementById("beats"), sun=document.getElementById("sun");
let cur=0, N=0, loaded=0;
/* the count: once a visit, eased by time, held at the end until the words are in */
(function boot(){ const fill=document.getElementById("ldFill"), num=document.getElementById("ldNum");
  /* coming back from the kingdom or the cards (not a reload): it is quick, so no count */
  /* the HELIOS marks on the other pages link here with #back; the mark is wiped at once, so a reload counts again */
  const back=location.hash==="#back"; if(back) try{ history.replaceState(null,"",location.pathname+location.search); }catch(e){}
  if(back || matchMedia("(prefers-reduced-motion: reduce)").matches){ const go=()=>loaded?document.body.classList.add("ready"):setTimeout(go,50); go(); return; }
  const t0=performance.now(), D=1700;
  const step=t=>{ const u=Math.min(1,(t-t0)/D), k=loaded?1-Math.pow(1-u,3):Math.min(.9,1-Math.pow(1-u,3));
    fill.style.transform=`scaleX(${k})`; num.textContent=String(Math.round(k*100)).padStart(3,"0");
    if(k>=1){ setTimeout(()=>document.body.classList.add("ready"),300); return; }
    requestAnimationFrame(step); };
  requestAnimationFrame(step); })();
function linkify(p){ let h=esc(p); const used=new Set();
  for(const [w,href] of LINKS){ if(used.has(href)) continue; const i=h.indexOf(w); if(i<0) continue;
    const before=h.slice(0,i); if((before.match(/<a /g)||[]).length!==(before.match(/<\/a>/g)||[]).length) continue;   /* not inside a link already made */
    h=before+`<a href="${href}"${href.startsWith("houses")?" data-fade":""}>${w}</a>`+h.slice(i+w.length); used.add(href); }
  return h; }
function show(i){ cur=(i+N)%N;
  text.querySelectorAll("p").forEach((p,k)=>p.classList.toggle("on",k===cur));
  beats.querySelectorAll("button").forEach((b,k)=>b.setAttribute("aria-current",k===cur));
  document.getElementById("turn").style.transform=`rotate(${cur*22.5}deg)`;   /* the sun turns one ray for every beat */
  try{ sessionStorage.setItem("prologue-beat",cur); }catch(e){} }
fetch("content/"+encodeURIComponent("序章.md"),{cache:"no-cache"}).then(r=>r.ok?r.text():Promise.reject()).then(md=>{
  const paras=md.replace(/\r/g,"").split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean); N=paras.length;
  text.insertAdjacentHTML("beforeend",paras.map(p=>`<p>${linkify(p).replace(/\n/g,"<br>")}</p>`).join(""));
  beats.innerHTML=paras.map((_,k)=>`<button type="button" aria-label="第 ${k+1} 段">${ROM[k]||k+1}</button>`).join("");
  let start=0; try{ start=+sessionStorage.getItem("prologue-beat")||0; }catch(e){}
  show(Math.min(start,N-1)); loaded=1;
}).catch(()=>{ text.insertAdjacentHTML("beforeend",'<p class="on">序章没有加载出来。</p>'); loaded=1; });
/* reading: tap the words to go on (the last beat goes back to the first), or pick a numeral, or use the arrow keys */
text.addEventListener("click",e=>{ if(e.target.closest("a") || !N || !document.body.classList.contains("ready")) return; show(cur+1); });
beats.addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) show([...beats.children].indexOf(b)); });
addEventListener("keydown",e=>{ if(!N) return; if(e.key==="ArrowRight") show(cur+1); else if(e.key==="ArrowLeft") show(cur-1); });
/* into the kingdom: the page fades, and the table comes up out of the same cream */
addEventListener("click",e=>{ const a=e.target.closest("a[data-fade]"); if(!a || e.metaKey || e.ctrlKey || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  e.preventDefault(); document.body.classList.add("leaving"); setTimeout(()=>{ location.href=a.getAttribute("href"); },650); });
addEventListener("pageshow",()=>document.body.classList.remove("leaving"));
</script>
</body>
</html>
