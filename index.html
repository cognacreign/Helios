<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helios 人物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ece2d5; --ink:#3a322a; --dim:#7a6c5c; --line:rgba(58,50,42,.5); --faint:rgba(58,50,42,.18);
    --panel:rgba(250,244,234,.6); --chip:rgba(255,250,242,.5); --frame:rgba(58,50,42,.55);
    --wide:"Helvetica Neue", "Inter", Arial, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
    --sans:"Noto Sans SC", "PingFang SC", sans-serif;
    --serif:"Noto Serif SC", "Songti SC", serif;
    /* every column shares one top line and one bottom line */
    --sat:.82; --veil:radial-gradient(110% 90% at 10% -10%, rgba(240,246,196,.3), rgba(240,246,196,0) 60%); --veil-blend:screen;
    --fig-amb:none; --fig-key:none;   /* by day the painting keeps its own colour */
    --edge:4vw; --top:5rem; --bot:1.375rem; --nameW:21vw; --A:.5037; --pad:1.375rem; --r:1.625rem;   /* one corner radius for the frame and the readout */   /* --A: width/height of the painting */
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#231e1b; --ink:#efe5d5; --dim:#b3a48f; --line:rgba(239,229,213,.5); --faint:rgba(239,229,213,.17);
      --panel:rgba(30,25,21,.58); --chip:rgba(30,24,20,.45); --frame:rgba(239,229,213,.55); color-scheme:dark;
      --bg:#5f5348; --sat:1; --veil:radial-gradient(90% 80% at 50% 46%, rgba(95,83,72,0) 45%, rgba(55,51,36,.35) 100%); --veil-blend:multiply;
      --fig-amb:linear-gradient(100deg, #f2d9c2 0%, #c9b3a2 55%, #9c8a7e 100%); --fig-key:linear-gradient(100deg, rgba(229,135,83,.7) 0%, rgba(229,135,83,.18) 45%, rgba(229,135,83,0) 75%);
    }
  }
  :root[data-theme="dark"]{
    --bg:#231e1b; --ink:#efe5d5; --dim:#b3a48f; --line:rgba(239,229,213,.5); --faint:rgba(239,229,213,.17);
    --panel:rgba(30,25,21,.58); --chip:rgba(30,24,20,.45); --frame:rgba(239,229,213,.55); color-scheme:dark;
      --bg:#5f5348; --sat:1; --veil:radial-gradient(90% 80% at 50% 46%, rgba(95,83,72,0) 45%, rgba(55,51,36,.35) 100%); --veil-blend:multiply;
      --fig-amb:linear-gradient(100deg, #f2d9c2 0%, #c9b3a2 55%, #9c8a7e 100%); --fig-key:linear-gradient(100deg, rgba(229,135,83,.7) 0%, rgba(229,135,83,.18) 45%, rgba(229,135,83,0) 75%);
  }
  /* everything is sized in rem, and rem follows the window, so the page keeps its proportions on any screen */
  html{ font-size:clamp(12px, min(1.1111vw, 1.7778vh), 26px) }
  @media (max-width: 1000px){ html{ font-size:16px } }
  *{ box-sizing:border-box }
  html,body{ margin:0; height:100% }
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased }
  button{ font:inherit }

  /* ---------- the lit hall behind everything ---------- */
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; filter:saturate(var(--sat)) }
  .veil{ position:fixed; inset:0; z-index:1; pointer-events:none; background:var(--veil); mix-blend-mode:var(--veil-blend) }
  .grain{ position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.22; mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
  .wash{ position:fixed; inset:0; z-index:1; pointer-events:none; background:var(--bg); opacity:0; transition:opacity .45s ease }
  .wash.on{ opacity:1 }

  .topbar{ position:fixed; z-index:4; left:4vw; right:4vw; top:1.375rem; display:flex; align-items:center; gap:1.375rem }
  .mark{ font-family:var(--wide); font-weight:400; letter-spacing:.34em; font-size:0.875rem }
  .topbar .rule{ flex:1 }
  .count{ font-family:var(--mono); font-size:0.6875rem; letter-spacing:.12em; color:var(--dim) }
  .mode{
    all:unset; cursor:pointer; width:2.125rem; height:2.125rem; display:grid; place-items:center; border-radius:50%;
    background:var(--chip); color:var(--ink); -webkit-backdrop-filter:blur(0.375rem); backdrop-filter:blur(0.375rem);
  }
  .mode:focus-visible{ outline:1px solid var(--ink); outline-offset:0.1875rem }


  /* ---------- bottom-left: the name, then the switch ---------- */
  /* the full name stays just inside the frame's bottom line; the switch drops to the page's bottom inset */
  .nav{ display:flex; align-items:center; gap:0.875rem; margin-top:1.625rem; pointer-events:auto }
  .nav button{ all:unset; cursor:pointer; color:var(--ink); display:grid; place-items:center; width:2rem; height:1.375rem }
  .nav button svg{ width:1.75rem; height:0.9375rem }
  .nav button:focus-visible{ outline:1px solid var(--ink); outline-offset:0.1875rem }
  .nav .dots{ display:flex; gap:0.625rem }
  .nav .dots button{ width:auto; height:auto; font-family:var(--mono); font-size:0.6562rem; letter-spacing:.12em; color:var(--dim); padding:0.25rem 0; border-bottom:1px solid transparent; white-space:nowrap }
  .nav .dots button[aria-current="true"]{ color:var(--ink); border-bottom-color:var(--ink) }

  .plate{ position:fixed; z-index:3; left:var(--edge); bottom:var(--bot); width:var(--nameW); pointer-events:none }
  .plate .who{
    font-family:var(--wide); font-weight:200; text-transform:uppercase; white-space:nowrap;
    font-size:min(4.6vw, 4.75rem); line-height:.9; letter-spacing:.08em; margin:0 0 0 -.04em;
  }
  .plate .full{ margin-top:0.875rem; display:flex; align-items:center; gap:0.75rem; font-family:var(--mono); font-size:0.6875rem; letter-spacing:.14em; color:var(--dim) }
  .plate .full::before{ content:""; width:2.25rem; height:1px; background:var(--line) }

  /* ---------- B: the painting, framed, snug ---------- */
  .frame{
    position:fixed; z-index:2; top:var(--top); bottom:var(--bot); left:calc(var(--edge) + var(--nameW) + 1.6vw);
    width:calc((100vh - var(--top) - var(--bot) - 2 * var(--pad)) * var(--A) + 2 * var(--pad));
    touch-action:pan-y; user-select:none;
  }
  .figure{
    position:absolute; left:50%; top:50%; height:calc((100% - 2 * var(--pad)) * var(--hs, 1)); aspect-ratio:var(--ar, 814/1616);
    transform:translate(-50%,-50%); transition:opacity .5s ease, transform .7s cubic-bezier(.2,.7,.2,1);
  }
  /* the frame is painted: a 0.1875rem stroke with ragged edges and dry, broken patches */
  .brush{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; color:var(--ink); opacity:.72 }
  .brush path{ fill:none; stroke:currentColor; stroke-width:3; stroke-linejoin:round }
  .figure .lit{ position:absolute; inset:0; pointer-events:none; -webkit-mask-size:100% 100%; mask-size:100% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat }
  .figure .amb{ background:var(--fig-amb); mix-blend-mode:multiply }
  .figure .key{ background:var(--fig-key); mix-blend-mode:soft-light }
  .figure img{ width:100%; height:100%; display:block; pointer-events:none;
    filter:drop-shadow(0 0 .6px rgba(40,30,20,.3)) drop-shadow(0 0.875rem 1.625rem rgba(40,28,18,.16)) }
  .figure.out-l{ opacity:0; transform:translate(-62%,-50%) }
  .figure.out-r{ opacity:0; transform:translate(-38%,-50%) }

  /* ---------- C: the readout, same height as the frame ---------- */
  .readout{
    position:fixed; z-index:3; right:4vw; top:var(--top); max-height:calc(100vh - var(--top) - var(--bot)); width:clamp(22.5rem, 33vw, 25rem);
    display:flex; flex-direction:column; padding:1.125rem 1.375rem 0;
    border:1px solid var(--line); border-radius:var(--r);
    background:var(--panel); -webkit-backdrop-filter:blur(0.625rem) saturate(.9); backdrop-filter:blur(0.625rem) saturate(.9);
    transition:opacity .4s ease;
  }
  .readout.fade .in{ opacity:0 }
  .readout .in{ display:flex; flex-direction:column; min-height:0; flex:0 1 auto; transition:opacity .35s ease }
  .readout::before, .readout::after{ content:""; position:absolute; width:1.375rem; height:1.375rem; border:1px solid var(--ink); pointer-events:none }
  .readout::before{ left:-0.375rem; top:-0.375rem; border-right:0; border-bottom:0; border-top-left-radius:calc(var(--r) + 0.375rem) }
  .readout::after{ right:-0.375rem; bottom:-0.375rem; border-left:0; border-top:0; border-bottom-right-radius:calc(var(--r) + 0.375rem) }

  .tabs{ display:flex; gap:1.375rem; border-bottom:1px solid var(--faint) }
  .tabs button{
    all:unset; cursor:pointer; padding:0 0 0.625rem; margin-bottom:-1px; color:var(--dim);
    font-family:var(--wide); text-transform:uppercase; font-size:0.5938rem; letter-spacing:.26em;
    border-bottom:1px solid transparent;
  }
  .tabs button small{ font-family:var(--sans); letter-spacing:.08em; margin-left:0.375rem; font-size:0.6562rem }
  .tabs button[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--ink) }
  .tabs button:focus-visible, .chips button:focus-visible, .pager button:focus-visible, .go:focus-visible{ outline:1px solid var(--ink); outline-offset:0.1875rem }

  .chips{ display:flex; flex-wrap:wrap; gap:0.375rem; margin:0.875rem 0 0.125rem }
  .chips button{
    all:unset; cursor:pointer; padding:0.125rem 0.625rem; border:1px solid var(--faint); border-radius:999px;
    font-size:0.6875rem; letter-spacing:.12em; color:var(--dim);
  }
  .chips button[aria-pressed="true"]{ border-color:var(--ink); color:var(--ink) }

  .body{ flex:0 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:1.125rem 0 0 0; scrollbar-width:thin; scrollbar-color:var(--faint) transparent }
  .rows{ margin:0 0 0 0.1875rem; padding:0 0 0 1.125rem; border-left:1px solid var(--faint); list-style:none }
  .rows li{ position:relative; margin:0 0 0.625rem; font-size:0.75rem; font-weight:300; line-height:1.8 }
  .rows li::before{ content:""; position:absolute; left:-1.125rem; top:.9em; width:0.75rem; height:1px; background:var(--line) }
  .rows li::after{ content:""; position:absolute; left:-0.5rem; top:calc(.9em - 0.1875rem); border:0.1875rem solid transparent; border-left:0.3125rem solid var(--line) }
  .rows b{ display:block; font-family:var(--mono); font-weight:400; font-size:0.5938rem; letter-spacing:.08em; color:var(--dim); margin-bottom:1px }
  .go{ all:unset; cursor:pointer; border-bottom:1px solid var(--line); color:var(--ink) }

  /* 资料: one left edge, one rhythm (1.5rem between blocks), nothing stretched */
  .sheet{ padding:0.25rem 0 1.25rem }
  .sheet > div + div{ margin-top:1.5rem }
  .sheet .role{ margin:0; font-size:1.0625rem; line-height:1.4; font-weight:300; letter-spacing:.02em; white-space:nowrap }
  .sheet .role i{ font-style:normal; color:var(--dim); margin:0 .35em }
  .sheet .place{ margin:0.375rem 0 0; font-size:0.75rem; line-height:1.6; color:var(--dim); font-weight:300 }
  .sheet .stats{ font-size:0.875rem; line-height:1.6; font-weight:300; letter-spacing:.02em }
  .sheet .stats span{ white-space:nowrap }
  .sheet .stats span + span{ margin-left:0.75rem }
  .sheet .stats em{ font-style:normal; color:var(--dim); margin:0 0.875rem }
  .sheet h3{ margin:0 0 0.5rem; font-family:var(--mono); font-weight:400; font-size:0.5938rem; line-height:1; letter-spacing:.18em; color:var(--dim) }
  .sheet p{ margin:0; font-size:0.7812rem; line-height:1.8; font-weight:300 }
  .sheet ol{ list-style:none; margin:0; padding:0 }
  .sheet ol li{ display:grid; grid-template-columns:1.5rem 1fr; font-size:0.7812rem; line-height:1.8; font-weight:300 }
  .sheet ol b{ font-family:var(--mono); font-weight:400; font-size:0.625rem; color:var(--dim); line-height:2.25 }
  .sheet .likes{ font-size:0.7812rem; line-height:1.8; font-weight:300 }
  .sheet .likes span{ white-space:nowrap }
  .sheet .likes i{ font-style:normal; color:var(--dim); margin:0 .45em }

  /* 故事: two plain two-column lists. Names, then ages, in the left column */
  .tale{ padding:0 0 0.625rem }
  .tale h3{ margin:0 0 0.5rem; font-family:var(--mono); font-weight:400; font-size:0.5938rem; line-height:1; letter-spacing:.18em; color:var(--dim) }
  .tale dl{ display:grid; gap:0.125rem 0.75rem; margin:0 0 0.875rem; font-size:0.75rem; line-height:1.6; font-weight:300 }
  .tale dl:last-child{ margin-bottom:0 }
  .tale .rel{ grid-template-columns:3.625rem 1fr }
  .tale dt{ font-family:var(--wide); font-weight:400; letter-spacing:.04em }
  /* the timeline: ages stand where the nodes were, a thin line runs between them */
  .tl{ list-style:none; margin:0; padding:0; font-size:0.75rem; line-height:1.6; font-weight:300 }
  .tl li{ position:relative; padding:0 0 0.3125rem 2.125rem }
  .tl li:last-child{ padding-bottom:0 }
  .tl b{ position:absolute; left:0; top:0; width:1.375rem; text-align:center; font-family:var(--wide); font-weight:400; font-size:0.6875rem; line-height:1.1875rem; letter-spacing:.02em }
  .tl li:not(:last-child)::after{ content:""; position:absolute; left:0.6875rem; top:1.25rem; bottom:1px; width:1px; background:var(--line) }
  .tale dd{ margin:0 }

  .story{ display:flex; flex-direction:column; flex:1; min-height:0; padding-top:1rem }
  .page{ flex:1; min-height:0; overflow:auto; scrollbar-width:thin; scrollbar-color:var(--faint) transparent; padding-right:0.375rem }
  .page .num{ font-family:var(--wide); font-weight:200; font-size:1.25rem; letter-spacing:.1em; color:var(--dim); margin:0 0 0.625rem }
  .page p{ margin:0; font-family:var(--serif); font-size:0.7812rem; line-height:2; text-align:justify; animation:in .5s ease }
  @keyframes in{ from{ opacity:0; transform:translateX(0.875rem) } to{ opacity:1; transform:none } }
  .pager{ display:flex; align-items:center; justify-content:space-between; padding:0.75rem 0 1rem; border-top:1px solid var(--faint); margin-top:0.75rem }
  .pager button{ all:unset; cursor:pointer; width:2.25rem; height:1.375rem; display:grid; place-items:center; color:var(--ink) }
  .pager button:disabled{ opacity:.25; cursor:default }
  .pager button svg{ width:1.75rem; height:0.9375rem }
  .pager span{ font-family:var(--mono); font-size:0.625rem; letter-spacing:.14em; color:var(--dim) }

  /* ---------- 词条: a card over the readout's place ---------- */
  .term{ all:unset; cursor:pointer; border-bottom:1px dotted var(--ink); }
  .term:hover{ border-bottom-style:solid }
  .term:focus-visible{ outline:1px solid var(--ink); outline-offset:0.125rem }
  .entry .head{ position:relative; padding-right:2.125rem }
  .entry .tag{ font-family:var(--mono); font-size:0.5938rem; letter-spacing:.18em; color:var(--dim) }
  .entry h2{ margin:0.4375rem 0 0; font-size:1.1875rem; font-weight:300; letter-spacing:.04em }
  .entry .close{ all:unset; cursor:pointer; position:absolute; right:-0.375rem; top:-0.25rem; width:1.75rem; height:1.75rem; display:grid; place-items:center; color:var(--ink) }
  .entry .close:focus-visible{ outline:1px solid var(--ink); outline-offset:0.125rem }
  .entry .ebody{ flex:0 1 auto; min-height:0; overflow-y:auto; margin-top:0.75rem; padding:0.75rem 0.25rem 1.125rem 0; border-top:1px solid var(--faint); scrollbar-width:thin; scrollbar-color:var(--faint) transparent }
  .entry .ebody p{ margin:0 0 .8em; font-size:0.7812rem; line-height:1.85; font-weight:300; text-align:justify }
  .entry .ebody h3{ margin:1.125rem 0 0.5rem; font-family:var(--mono); font-weight:400; font-size:0.5938rem; letter-spacing:.18em; color:var(--dim) }
  .entry .ebody .desc{ font-style:italic; color:var(--dim); margin-bottom:1.1em }
  .entry .ebody.scene p:not(.desc){ font-family:var(--serif); font-size:0.75rem; line-height:1.78; margin-bottom:.4em }
  .entry .ebody p:last-child{ margin-bottom:0 }
  .readout .in.entry{ animation:entryIn .35s cubic-bezier(.2,.7,.2,1) }
  @keyframes entryIn{ from{ opacity:0; transform:translateX(0.625rem) } to{ opacity:1; transform:none } }

  /* the readout folds away when you click into the hall */
  .readout{ transition:opacity .45s ease, transform .55s cubic-bezier(.2,.7,.2,1) }
  body.bare .readout{ opacity:0; transform:translateX(1.75rem); pointer-events:none }
  .frame{ cursor:pointer; transform:translateX(var(--shift,0px)); transition:transform .8s cubic-bezier(.33,1,.68,1) }

  /* ---------- stickers: die-cut, draggable, they stay where you leave them ---------- */
  .sticker{ all:unset; box-sizing:border-box; position:fixed; z-index:2; width:2.875rem; cursor:grab; touch-action:none; user-select:none;
    --s:1; --rot:-8deg; filter:drop-shadow(0 0.375rem 0.625rem rgba(30,20,12,.28));
    transform:rotate(var(--rot)) scale(var(--s)); transition:transform .2s ease }
  .sticker[hidden]{ display:none }
  .sticker.away{ opacity:0; visibility:hidden; pointer-events:none; transition:opacity .4s ease, visibility 0s .4s }
  .sticker{ transition:transform .2s ease, opacity .4s ease }
  .sticker.drag, .sticker.turn{ transition:none }
  .sticker.drag{ cursor:grabbing }
  .sticker.pop{ animation:pop .45s cubic-bezier(.2,1.6,.4,1) }
  @keyframes pop{ from{ transform:rotate(var(--rot)) scale(.2); opacity:0 } }
  .sticker:focus-visible{ outline:1px solid var(--ink); outline-offset:0.25rem; border-radius:0.5rem }
  /* the handle: drag it to turn and resize; it stays the same size on screen */
  .sticker .handle{ position:absolute; right:-0.375rem; bottom:-0.375rem; width:calc(0.6875rem / var(--s)); height:calc(0.6875rem / var(--s));
    border-radius:50%; background:var(--bg); border:calc(1px / var(--s)) solid var(--ink); cursor:nwse-resize; opacity:0; transition:opacity .2s }
  .sticker:hover .handle, .sticker:focus-visible .handle, .sticker.turn .handle{ opacity:1 }
  .sticker img{ display:block; width:100%; height:auto; pointer-events:none }
  .sticker .lit{ position:absolute; inset:0; pointer-events:none; -webkit-mask-size:100% 100%; mask-size:100% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat }
  .sticker .amb{ background:var(--fig-amb); mix-blend-mode:multiply }
  .sticker .key{ background:var(--fig-key); mix-blend-mode:soft-light }
  @media (prefers-reduced-motion: reduce){ .readout .in.entry, .sticker.pop{ animation:none } .sticker, .readout{ transition:none } }

  /* ---------- skins ---------- */
  .skins{ position:absolute; left:calc(100% + .9rem); top:0; display:flex; flex-direction:column; gap:.5rem; z-index:3 }
  .skins[hidden]{ display:none }
  .skins button{ all:unset; cursor:pointer; position:relative; width:2.75rem; height:2.75rem; border-radius:.55rem; overflow:hidden;
    border:1px solid var(--faint); background:var(--panel); transition:border-color .3s }
  .skins button img{ width:100%; height:100%; object-fit:cover; display:block }
  .skins button[aria-pressed="true"]{ border-color:var(--ink) }
  .skins button:focus-visible{ outline:1px solid var(--ink); outline-offset:3px }
  .skinart{ position:absolute; inset:.55rem; width:calc(100% - 1.1rem); height:calc(100% - 1.1rem); object-fit:cover; border-radius:calc(var(--r) - .55rem);
    opacity:0; transition:opacity .7s ease .25s; pointer-events:none }

  /* the drape: night, the hall turned upside down, one warm light */
  body.skin-drape{
    --bg:#0c0a09; --ink:#efe5d5; --dim:#a8977f; --line:rgba(239,229,213,.45); --faint:rgba(239,229,213,.15);
    --panel:rgba(14,12,11,.62); --chip:rgba(20,16,13,.5); --frame:rgba(239,229,213,.55); --glow:#e9a35f;
    --fig-amb:none; --fig-key:none; --sat:1; --veil:radial-gradient(70% 70% at 50% 50%, rgba(0,0,0,0) 40%, rgba(0,0,0,.55) 100%); --veil-blend:multiply;
  }
  #c{ transition:transform 1.4s cubic-bezier(.6,0,.2,1) }
  body.skin-drape #c{ transform:perspective(1600px) rotateX(180deg) }
  body.skin-drape .skinart{ opacity:1 }
  body.skin-drape .figure{ opacity:0 !important }
  /* the readout keeps its words but turns its marks around */
  body.skin-drape .readout::before{ left:auto; right:-.375rem; border-left:0; border-right:1px solid var(--glow); border-top-color:var(--glow);
    border-top-left-radius:0; border-top-right-radius:calc(var(--r) + .375rem) }
  body.skin-drape .readout::after{ right:auto; left:-.375rem; border-right:0; border-left:1px solid var(--glow); border-bottom-color:var(--glow);
    border-bottom-right-radius:0; border-bottom-left-radius:calc(var(--r) + .375rem) }
  body.skin-drape .tabs button[aria-selected="true"]{ color:var(--glow); border-bottom-color:var(--glow); text-shadow:0 0 .6rem rgba(233,163,95,.55) }
  body.skin-drape .sheet h3, body.skin-drape .tale h3, body.skin-drape .entry .tag{ color:var(--glow) }
  body.skin-drape .sheet ol b, body.skin-drape .tale .tl b{ color:var(--glow) }
  @media (prefers-reduced-motion: reduce){ #c{ transition:none } }

  @media (max-width: 1000px){

  apple.addEventListener("pointerdown",e=>{ if(turning) return; down=true; moved=false; sx=e.clientX; sy=e.clientY; ox=apple.offsetLeft; oy=apple.offsetTop; apple.setPointerCapture(e.pointerId); });
  apple.addEventListener("pointermove",e=>{ if(!down) return; const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved && Math.hypot(dx,dy)>4){ moved=true; apple.classList.add("drag"); }
    if(moved){ apple.style.left=Math.max(-10,Math.min(innerWidth-40, ox+dx))+"px"; apple.style.top=Math.max(-10,Math.min(innerHeight-40, oy+dy))+"px"; } });
  apple.addEventListener("pointerup",()=>{ if(!down) return; down=false; apple.classList.remove("drag"); if(moved) saveApple(); });
  apple.addEventListener("click",e=>{ if(moved){ e.preventDefault(); e.stopImmediatePropagation(); moved=false; return; } openEntry("apple"); });
  /* the wheel resizes; with Shift held it turns */
  apple.addEventListener("wheel",e=>{ e.preventDefault();
    if(e.shiftKey) aR+=e.deltaY>0?6:-6; else aS=clampS(aS*(e.deltaY>0?.92:1.08));
    applyApple(); clearTimeout(apple._t); apple._t=setTimeout(saveApple,250); }, {passive:false});
  apple.addEventListener("keydown",e=>{
    const k=e.key; let hit=true;
    if(k==="+"||k==="=") aS=clampS(aS*1.1); else if(k==="-"||k==="_") aS=clampS(aS/1.1);
    else if(k==="]") aR+=8; else if(k==="[") aR-=8; else hit=false;
    if(hit){ e.preventDefault(); applyApple(); saveApple(); } });
})();

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
(function(){

renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.outputEncoding=THREE.sRGBEncoding;

const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xffffff, 20, 140);
const camera=new THREE.PerspectiveCamera(48, 1, .1, 400);
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;

/* bloom, for the dreamy glow; if the extra scripts don't arrive the scene renders plain */
let composer=null, bloom=null, frost=null;
if(THREE.EffectComposer && THREE.UnrealBloomPass && THREE.GammaCorrectionShader){
  try{
    const gl2=renderer.capabilities.isWebGL2;

    const half=gl2 && renderer.extensions.has("EXT_color_buffer_float");
    const rt=new RT(2,2,{ type: half ? THREE.HalfFloatType : THREE.UnsignedByteType });
    composer=new THREE.EffectComposer(renderer, rt);
    composer.addPass(new THREE.RenderPass(scene, camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(2,2), .5, .7, .7);
    composer.addPass(bloom);
    composer.addPass(new THREE.ShaderPass(THREE.GammaCorrectionShader));
    /* film grain over the finished picture, mostly in the mid-tones */
    frost=new THREE.ShaderPass({
      uniforms:{ tDiffuse:{value:null}, uRes:{value:new THREE.Vector2(1,1)}, uCell:{value:1}, uTime:{value:0}, uGrain:{value:.03} },
      vertexShader:"varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }",
      fragmentShader:`
        uniform sampler2D tDiffuse; uniform vec2 uRes; uniform float uCell, uGrain, uTime;
        varying vec2 vUv;
        float h(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }

/* ============================================================
   Painted textures, made on the fly: every surface carries loose
   brush daubs, so the light lands on paint rather than plastic.
   ============================================================ */
function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function brushCanvas({seed=1, size=512, base=232, spread=22, strokes=900, dir="v", veins=0}){
  const c=document.createElement("canvas"); c.width=c.height=size; const x=c.getContext("2d"), r=rng(seed);
  x.fillStyle=`rgb(${base},${base},${base})`; x.fillRect(0,0,size,size);
  for(let i=0;i<14;i++){                      /* washes */
    const g=x.createRadialGradient(r()*size,r()*size,0, r()*size,r()*size, size*(.2+r()*.4));
    const v=Math.max(0,Math.min(255,base+(r()-.5)*spread*1.6|0));
    g.addColorStop(0,`rgba(${v},${v},${v},.35)`); g.addColorStop(1,`rgba(${v},${v},${v},0)`);
    x.fillStyle=g; x.fillRect(0,0,size,size);
  }
  for(let i=0;i<strokes;i++){                 /* daubs with dry, ragged ends */
    const v=Math.max(0,Math.min(255, base+(r()-.5)*spread*2|0));
    x.fillStyle=`rgba(${v},${v},${v},${.04+r()*.22})`;
    const w=3+r()*26, l=18+r()*150;
    x.save(); x.translate(r()*size, r()*size);
    x.rotate((dir==="v"?Math.PI/2:0) + (r()-.5)*.35);
    x.fillRect(-l/2,-w/2,l,w);
    for(let k=0;k<4;k++) x.fillRect(l/2-r()*12, -w/2+r()*w, 6+r()*14, 1+r()*2);
    x.restore();
  }
  for(let i=0;i<veins;i++){                   /* marble veins */
    x.strokeStyle=`rgba(${base-70},${base-62},${base-58},${.16+r()*.25})`; x.lineWidth=.6+r()*1.6;
    x.beginPath(); let px=r()*size, py=0; x.moveTo(px,py);
    while(py<size){ px+=(r()-.5)*38; py+=18+r()*30; x.lineTo(px,py); } x.stroke();
  }
  return c;
}
function tex(c, rx=1, ry=1, color=true){
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);
  if(color) t.encoding=THREE.sRGBEncoding; t.anisotropy=4; return t;
}
const plasterC = brushCanvas({seed:3, base:236, spread:26, strokes:1100});
const marbleC  = brushCanvas({seed:7, base:240, spread:18, strokes:700, veins:7});
const floorC   = brushCanvas({seed:11, base:226, spread:30, strokes:1300, dir:"h", veins:4});
const bumpC    = brushCanvas({seed:5, base:128, spread:90, strokes:1400});
/* dusk is painted in strokes: broad flat loads of paint laid side by side,
   each a shade off its neighbour, with dry, split ends and a few drag lines
   inside. Tileable, so the strokes wrap across the edges. */
function strokeCanvas({seed, size=512, base=220, spread=11, dir="v", wMin=24, wMax=72, lMin=160, lMax=460}){
  const c=document.createElement("canvas"); c.width=c.height=size; const x=c.getContext("2d"), r=rng(seed);
  x.fillStyle=`rgb(${base},${base},${base})`; x.fillRect(0,0,size,size);
  const val=s=>Math.max(0,Math.min(255, base+(r()-.5)*2*s|0));
  const make=(cx,cy,w,l,v,a,ang)=>{                     /* every random number fixed up front, so wrapped copies match */
    const n=5+(r()*6|0), tail=[], head=[], drag=[];
    for(let k=0;k<n;k++){ tail.push([l*(.04+r()*.24), .55+r()*.5]); head.push(r()*l*.06); }

    return {cx,cy,w,l,v,a,ang,n,tail,head,drag};
  };
  const draw=S=>{
    for(const ox of [-size,0,size]) for(const oy of [-size,0,size]){
      const X=S.cx+ox, Y=S.cy+oy, reach=S.l*.7;
      if(X<-reach||X>size+reach||Y<-reach||Y>size+reach) continue;
      x.save(); x.translate(X,Y); x.rotate(S.ang);
      x.fillStyle=`rgba(${S.v},${S.v},${S.v},${S.a})`;
      const bw=S.w/S.n;
      x.fillRect(-S.l/2+S.l*.04, -S.w/2, S.l*.82, S.w);                    /* the load of paint */
      for(let k=0;k<S.n;k++){
        x.fillRect(S.l*.36, -S.w/2+k*bw, S.tail[k][0], bw*S.tail[k][1]);     /* dry, split tail */
        x.fillRect(-S.l/2+S.l*.04-S.head[k], -S.w/2+k*bw, S.l*.05, bw*.92);  /* ragged start */
      }
      S.drag.forEach(([dv,da,pos,len,th])=>{ x.fillStyle=`rgba(${dv},${dv},${dv},${da})`; x.fillRect(-S.l/2, -S.w/2+pos*S.w, S.l*len, th); });
      x.restore();
    }
  };
  const along = dir==="v" ? Math.PI/2 : 0;
  /* first coat: columns of strokes edge to edge, staggered */
  for(let u=0; u<size; ){
    const w=wMin+r()*(wMax-wMin);
    for(let t=-r()*lMax; t<size; ){
      const l=lMin+r()*(lMax-lMin), cu=u+w/2, ct=t+l/2;
      draw(make(dir==="v"?cu:ct, dir==="v"?ct:cu, w*1.08, l, val(spread), .72+r()*.26, along+(r()-.5)*.07));
      t+=l*(.7+r()*.25);
    }
    u+=w*(.78+r()*.2);
  }
  /* second coat: sparse strokes laid over */
  for(let i=0;i<46;i++){
    const w=wMin*.8+r()*(wMax-wMin)*.8, l=lMin*.6+r()*(lMax-lMin)*.6;
    draw(make(r()*size, r()*size, w, l, val(spread*1.2), .3+r()*.35, along+(r()-.5)*.12));
  }
  return c;
}
const strokeV = strokeCanvas({seed:31, dir:"v"}), strokeH = strokeCanvas({seed:37, dir:"h"});
const strokeBumpV = strokeCanvas({seed:31, dir:"v", base:128, spread:70});
const strokeFloor = strokeCanvas({seed:41, dir:"h", base:214, spread:20, wMin:14, wMax:44, lMin:200, lMax:500});
/* each material keeps its painterly map for morning and gets brush strokes for dusk */
const MAPS={};
function twoMaps(name, rx, ry, bump, dusk){
  MAPS[name]={ day:[tex(name==="marble"?marbleC:plasterC,rx,ry), bump?tex(bumpC,rx,ry,false):null],
               dusk:[tex(dusk.c,dusk.rx,dusk.ry), dusk.bump?tex(strokeBumpV,dusk.rx,dusk.ry,false):null] };
  return MAPS[name].day;
}
/* matte for dusk (no sheen on the plaster), and light that breaks along the strokes:
   the stroke values nudge where each fragment reads the sunset's shadow map */
const PAINT={ uSpec:{value:1}, uJitter:{value:0} };
function paintify(mat, matte, jit){
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uSpec = matte ? PAINT.uSpec : {value:1}; sh.uniforms.uJitter = jit ? PAINT.uJitter : {value:0};
    sh.fragmentShader = "uniform float uSpec;\nuniform float uJitter;\n" + sh.fragmentShader
      .replace("#include <map_fragment>", "#include <map_fragment>\nvec2 strokeJit = vec2(0.0);\n#ifdef USE_MAP\nstrokeJit = vec2( texelColor.r - 0.7, mapTexelToLinear( texture2D( map, vUv * 1.37 + vec2( .31, .17 ) ) ).r - 0.7 ) * uJitter;\n#endif")
      .replace("#include <lights_physical_fragment>", "#include <lights_physical_fragment>\nmaterial.specularColor *= uSpec;")
      .replace("#include <lights_fragment_begin>", THREE.ShaderChunk.lights_fragment_begin.split("vSpotShadowCoord[ i ] )").join("vSpotShadowCoord[ i ] + vec4( strokeJit * vSpotShadowCoord[ i ].w, 0.0, 0.0 ) )"));
  };
  return mat;
}

const std=(o)=>new THREE.MeshStandardMaterial(o);
const M = {
  wall:    std({ map:twoMaps("wall",.075,.075,1,{c:strokeV,rx:.07,ry:.07,bump:0})[0], bumpMap:MAPS.wall.day[1], bumpScale:.035, roughness:.95 }),
  wallBox: std({ map:twoMaps("wallBox",1,1,1,{c:strokeV,rx:2,ry:2,bump:0})[0], bumpMap:MAPS.wallBox.day[1], bumpScale:.03, roughness:.95 }),
  plaster: std({ map:twoMaps("plaster",1,1,1,{c:strokeV,rx:1,ry:1,bump:0})[0], bumpMap:MAPS.plaster.day[1], bumpScale:.03, roughness:.95 }),
  vault:   std({ map:twoMaps("vault",2,1,1,{c:strokeH,rx:2,ry:1,bump:0})[0], bumpMap:MAPS.vault.day[1], bumpScale:.03, roughness:.92, side:THREE.DoubleSide }),
  rib:     std({ map:twoMaps("rib",1,1,0,{c:strokeV,rx:6,ry:.08,bump:0})[0], roughness:.95 }),     /* along the arc, never across the thin tube */
  marble:  std({ map:twoMaps("marble",2,1,1,{c:strokeV,rx:2,ry:1,bump:0})[0], bumpMap:MAPS.marble.day[1], bumpScale:.02, roughness:.5 }),
  niche:   std({ map:twoMaps("niche",1,1,0,{c:strokeV,rx:1,ry:1,bump:0})[0], roughness:1 }),
  floor:   std({ map:tex(floorC,26,26), roughness:.25, metalness:.05, transparent:true })

MAPS.floor={ day:[M.floor.map,null], dusk:[tex(strokeFloor,26,26),null] };
Object.keys(M).forEach(k=>paintify(M[k], k!=="floor", k!=="rib" && k!=="floor"));

/* ============================================================
   Architecture
   ============================================================ */
const BAY=14, N=6, OW=12, SPR=12, R=OW/2;
const WALL_W=44, WALL_H=27, WALL_D=3, COLS_PER_BAY=4;

function portalGeo(){
  const s=new THREE.Shape();
  s.moveTo(-WALL_W/2,0); s.lineTo(WALL_W/2,0); s.lineTo(WALL_W/2,WALL_H); s.lineTo(-WALL_W/2,WALL_H); s.lineTo(-WALL_W/2,0);
  const h=new THREE.Path();
  h.moveTo(-R,0); h.lineTo(-R,SPR); h.absarc(0,SPR,R,Math.PI,0,true); h.lineTo(R,0); h.lineTo(-R,0);
  s.holes.push(h);
  return new THREE.ExtrudeGeometry(s,{depth:WALL_D, bevelEnabled:false, curveSegments:48});
}
function vaultGeo(len){
  const su=48, sv=10, pos=[], uv=[], idx=[];
  for(let v=0;v<=sv;v++) for(let u=0;u<=su;u++){
    const a=Math.PI*u/su; pos.push(Math.cos(a)*R, SPR+Math.sin(a)*R, -len*v/sv); uv.push(u/su, v/sv);
  }
  for(let v=0;v<sv;v++) for(let u=0;u<su;u++){ const a=v*(su+1)+u,b=a+1,c=a+su+1,d=c+1; idx.push(a,c,b,b,c,d); }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx); g.computeVertexNormals(); return g;
}
/* a loose Doric column: fluted shaft with a slight swell, cushion capital,
   square abacus, a torus at the foot. Suggested, not archaeological. */
const colCache={};
function columnGeos(H, r0){
  const key=H+"_"+r0; if(colCache[key]) return colCache[key];
  const parts=[], prof=[];
  for(let i=0;i<=24;i++){ const t=i/24; prof.push(new THREE.Vector2(r0*(1-.16*t+.05*Math.sin(Math.PI*t)), t*H)); }
  const shaft=new THREE.LatheGeometry(prof, 80), p=shaft.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i), a=Math.atan2(z,x), k=1-.045*(.5+.5*Math.cos(a*20)); p.setX(i,x*k); p.setZ(i,z*k); }
  shaft.computeVertexNormals(); parts.push(shaft);
  const tor=new THREE.TorusGeometry(r0*1.05, r0*.16, 10, 40); tor.rotateX(Math.PI/2); tor.translate(0,r0*.3,0); parts.push(tor);
  const pl=new THREE.BoxGeometry(r0*2.6, r0*.28, r0*2.6); pl.translate(0,r0*.14,0); parts.push(pl);
  const ech=new THREE.LatheGeometry([new THREE.Vector2(r0*.84,0),new THREE.Vector2(r0,r0*.12),new THREE.Vector2(r0*1.28,r0*.36),new THREE.Vector2(r0*1.36,r0*.5)],40);
  ech.translate(0,H,0); parts.push(ech);
  const ab=new THREE.BoxGeometry(r0*2.9, r0*.34, r0*2.9); ab.translate(0,H+r0*.67,0); parts.push(ab);
  return colCache[key]=parts;
}
function addColumn(g,x,z,H,r0){
  columnGeos(H,r0).forEach(geo=>{ const m=new THREE.Mesh(geo,M.marble); m.position.set(x,0,z); m.castShadow=m.receiveShadow=true; g.add(m); });
}
function box(g,w,h,d,mat,x,y,z,cast=true){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=true; g.add(m); return m; }

const PG=portalGeo(), blockers=[], ribs=[];
function buildHall(g){
  for(let i=0;i<N;i++){
    const z=-i*BAY;
    const w=new THREE.Mesh(PG,M.wall); w.position.set(0,0,z-WALL_D); w.receiveShadow=true; g.add(w); if(g===hall) blockers.push(w);   /* at dusk walls and vault let the light through, so it washes the whole hall */
    const band=new THREE.Mesh(new THREE.TorusGeometry(R+.4,.4,12,56,Math.PI),M.plaster); band.position.set(0,SPR,z+.06); band.castShadow=true; g.add(band); ribs.push(band);
    [-1,1].forEach(sd=> addColumn(g, sd*(R+1.5), z+1.4, SPR-.9, .78));      /* columns framing each doorway */
    [-1,1].forEach(sd=> box(g, 3.2, 1.1, 2.4, M.plaster, sd*(R+1.5), SPR+.55, z+1.4));   /* an entablature block over each, leaving the arch open */
    if(i<N-1){
      const z0=z-WALL_D, len=BAY-WALL_D;
      const v=new THREE.Mesh(vaultGeo(len),M.vault); v.position.z=z0; v.receiveShadow=true; g.add(v); if(g===hall) blockers.push(v);
      for(let k=1;k<5;k++){ const rb=new THREE.Mesh(new THREE.TorusGeometry(R-.14,.2,8,48,Math.PI),M.rib); rb.position.set(0,SPR,z0-len*k/5); rb.castShadow=true; g.add(rb); ribs.push(rb); }
      for(let k=1;k<8;k++){ const a=Math.PI*k/8; box(g,.32,.32,len,M.rib,Math.cos(a)*(R-.17),SPR+Math.sin(a)*(R-.17),z0-len/2); }
      for(let k=0;k<COLS_PER_BAY;k++) addColumn(g, -R-.6, z0-len*(k+.5)/COLS_PER_BAY, SPR-.9, .55);   /* open colonnade on the left */
      box(g, 2.2, 1.1, len, M.plaster, -R-.6, SPR+.55, z0-len/2);
      { const rw=box(g, 1, SPR+1.1, len, M.wallBox, R+.5, (SPR+1.1)/2, z0-len/2, false); if(g===hall) blockers.push(rw); }   /* solid wall on the right */
      [-1,1].forEach(o=> box(g,.2,5.4,2.4,M.niche,R+.02,4.8,z0-len/2+o*3.4,false));
    }
  }
  for(let s=0;s<5;s++) box(g, OW+6,.32,1.1, M.plaster, 0,.16+s*.32, -BAY*2-4-s*1.1);
  const L=BAY*(N-3)+4; box(g, OW+6,1.6,L, M.plaster, 0,.8, -BAY*2-4-5*1.1-L/2+.55);
}
const hall=new THREE.Group(); buildHall(hall); scene.add(hall);
const mirror=new THREE.Group(); buildHall(mirror); mirror.scale.y=-1; scene.add(mirror);
mirror.traverse(o=>{ if(o.isMesh) o.castShadow=false; });

/* a covered forecourt: only at night, so by day the sun falls full on the front */
const forecourt=new THREE.Group(); scene.add(forecourt);
[-1,1].forEach(sd=> box(forecourt, 2, WALL_H, 40, M.wallBox, sd*(WALL_W/2-1), WALL_H/2, 20, false));
box(forecourt, WALL_W, 2, 40, M.wallBox, 0, WALL_H+1, 20, false);

/* water over stone: a thin sheet the mirrored hall shows through */
const floor=new THREE.Mesh(new THREE.PlaneGeometry(400,400), M.floor);
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

/* ============================================================
   Light
   ============================================================ */
const farZ=-(N-1)*BAY-WALL_D;
/* the air beyond the far door: one flat color, no painted sky */
const skyMat=new THREE.MeshBasicMaterial({color:0xffffff, fog:false});
const sky=new THREE.Mesh(new THREE.PlaneGeometry(90,70), skyMat);
sky.position.set(0,22,farZ-30); scene.add(sky);
const skyBelow=new THREE.Mesh(sky.geometry, skyMat);          /* the same air lying in the water */
skyBelow.position.set(0,-22,farZ-30); skyBelow.scale.y=-1; scene.add(skyBelow);
function radial(stops){
  const c=document.createElement("canvas"); c.width=c.height=256; const x=c.getContext("2d");
  const g=x.createRadialGradient(128,128,0,128,128,128); stops.forEach(([o,a])=>g.addColorStop(o,`rgba(255,255,255,${a})`));
  x.fillStyle=g; x.fillRect(0,0,256,256); return new THREE.CanvasTexture(c);
}
const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:radial([[0,1],[.22,.4],[1,0]]), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, fog:false}));
glow.position.set(0,8,farZ+1); glow.scale.set(38,38,1); scene.add(glow);
const glowBelow=new THREE.Sprite(glow.material); glowBelow.position.set(0,-8,farZ+1); glowBelow.scale.set(38,30,1); scene.add(glowBelow);
const hazeTex=radial([[0,.6],[.5,.2],[1,0]]), hazes=[];
for(let i=0;i<N-1;i++){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:hazeTex, transparent:true, depthWrite:false, fog:false}));
  s.position.set(0,7,-i*BAY-BAY/2-1); s.scale.set(26,20,1); scene.add(s); hazes.push(s);
}
const doorLight=new THREE.PointLight(0xffffff,3,90,1.4); doorLight.position.set(0,8,farZ+2); scene.add(doorLight);
const lamp=new THREE.PointLight(0xffffff,0,34,2); lamp.position.set(0,6,2); scene.add(lamp);
const sun=new THREE.DirectionalLight(0xffffff,3);
sun.castShadow=true; const SM=renderer.capabilities.maxTextureSize>=8192?4096:2048; sun.shadow.mapSize.set(SM,SM);
Object.assign(sun.shadow.camera,{left:-62,right:62,top:62,bottom:-62,near:1,far:240});
sun.shadow.bias=-.0005; sun.shadow.normalBias=.02;
scene.add(sun, sun.target);
const hemi=new THREE.HemisphereLight(0xffffff,0x000000,.3); scene.add(hemi);
/* a second broad light from high on the other side, no shadow: a wash over everything */
const wash=new THREE.DirectionalLight(0xffffff,1); scene.add(wash, wash.target);
/* dusk: one big, far sunset light low over the left shoulder. A spot with a full
   penumbra, so it lands as a broad pool that falls off softly across the plaster. */
const dusk=new THREE.SpotLight(0xffffff, 1, 230, 1.0, .5, 1.5);
dusk.castShadow=true; dusk.shadow.mapSize.set(SM,SM); dusk.shadow.bias=-.00012; dusk.shadow.normalBias=.03;
Object.assign(dusk.shadow.camera,{near:40, far:260});   /* the light is far off: a deep near plane keeps depth precise */
scene.add(dusk, dusk.target);

/* dappled sun: an unseen canopy between the sun and the hall, it only casts shadow */
function leafC(){
  /* a tree seen as shadow, in layers: a few big crowns, middling clumps,
     small sprigs, lace at every edge and coins of light punched through */
  const S=2048, c=document.createElement("canvas"); c.width=c.height=S; const x=c.getContext("2d"), r=rng(23);
  const g=()=>(r()+r()+r()+r()-2)/2;
  const leaf=(px,py,sz)=>{ x.save(); x.translate(px,py); x.rotate(r()*6.28);
    x.beginPath(); x.ellipse(0,0,sz,sz*(.4+r()*.2),0,0,6.28); x.fill(); x.restore(); };
  x.fillStyle="#fff"; x.strokeStyle="#fff"; x.lineCap="round";
  const crowns=[];
  [[6,.13,.19],[16,.06,.1],[26,.025,.04]].forEach(([n,a,b])=>{ for(let i=0;i<n;i++) crowns.push([r(),r(),a+r()*(b-a)]); });
  crowns.forEach(([cx,cy,rad])=>{
    const R0=rad*S;
    if(rad>.04) for(let b=0;b<4;b++){                           /* branches */
      let px=cx*S, py=cy*S, a=r()*6.28, w=2+rad*30;
      for(let k=0;k<8;k++){ const nx=px+Math.cos(a)*R0*.13, ny=py+Math.sin(a)*R0*.16;
        x.lineWidth=w; x.beginPath(); x.moveTo(px,py); x.lineTo(nx,ny); x.stroke(); px=nx; py=ny; a+=(r()-.5)*.7; w*=.8; }
    }
    const subs=Math.max(4, Math.floor(rad*260));
    for(let k=0;k<subs;k++){                                   /* lumpy clumps */
      const d=Math.abs(g())*1.15, a=r()*6.28, sx=cx*S+Math.cos(a)*d*R0, sy=cy*S+Math.sin(a)*d*R0, sr=R0*(.18+r()*.2);
      const n=Math.floor(sr*sr*.26)+8;
      for(let i=0;i<n;i++){
        const dd=Math.abs(g()), aa=r()*6.28;
        if(r()<.2+.6*dd) continue;
        leaf(sx+Math.cos(aa)*dd*sr, sy+Math.sin(aa)*dd*sr, 2.2+r()*4);
      }
    }
  });
  x.globalCompositeOperation="destination-out";                 /* coins of light */
  crowns.forEach(([cx,cy,rad])=>{ const R0=rad*S, n=Math.floor(rad*rad*S*.9);
    for(let i=0;i<n;i++){ const d=Math.abs(g())*1.2, a=r()*6.28; leaf(cx*S+Math.cos(a)*d*R0, cy*S+Math.sin(a)*d*R0, 2+r()*5.5); } });
  x.globalCompositeOperation="source-over";
  for(let i=0;i<1800;i++) leaf(r()*S, r()*S, 2+r()*3);          /* stray leaves */
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}
const leafTex=leafC();
const canopy=new THREE.Mesh(new THREE.PlaneGeometry(190,190),
  new THREE.MeshBasicMaterial({map:leafTex, alphaTest:.5, transparent:true, colorWrite:false, depthWrite:false, side:THREE.DoubleSide}));
canopy.customDepthMaterial=new THREE.MeshDepthMaterial({depthPacking:THREE.RGBADepthPacking, map:leafTex, alphaTest:.5, side:THREE.DoubleSide});
canopy.castShadow=true; canopy.renderOrder=-1; scene.add(canopy);
function placeCanopy(){
  const d=new THREE.Vector3().subVectors(sun.position, sun.target.position);
  canopy.position.copy(sun.target.position).add(d.multiplyScalar(.62));
  canopy.lookAt(sun.position);
}

function shaftTex(){
  const c=document.createElement("canvas"); c.width=8; c.height=256; const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,0,256);
  g.addColorStop(0,"rgba(255,255,255,0)"); g.addColorStop(.12,"rgba(255,255,255,1)"); g.addColorStop(.8,"rgba(255,255,255,.5)"); g.addColorStop(1,"rgba(255,255,255,0)");
  x.fillStyle=g; x.fillRect(0,0,8,256); return new THREE.CanvasTexture(c);
}
const sTex=shaftTex(); let shafts=[];
function buildShafts(color, opacity, col){
  shafts.forEach(s=>scene.remove(s)); shafts=[];
  if(!opacity) return;
  const dir=new THREE.Vector3().subVectors(sun.target.position, sun.position).normalize();
  const mat=new THREE.MeshBasicMaterial({map:sTex, color:col(new THREE.Color(),color), transparent:true, opacity, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide});
  for(let i=0;i<N-1;i++){
    const z0=-i*BAY-WALL_D, len=BAY-WALL_D;
    for(let k=0;k<=COLS_PER_BAY;k++){
      const start=new THREE.Vector3(-R-.6, 9.5, z0-len*k/COLS_PER_BAY), Ls=24, mid=start.clone().add(dir.clone().multiplyScalar(Ls/2));
      [0,1].forEach(j=>{
        const m=new THREE.Mesh(new THREE.PlaneGeometry(1.8,Ls),mat);
        m.position.copy(mid); m.quaternion.setFromUnitVectors(new THREE.Vector3(0,-1,0),dir); m.rotateY(Math.PI/2*(j+1));
        scene.add(m); shafts.push(m);
      });
    }
  }
}
const DN=1400, dp=new Float32Array(DN*3);
for(let i=0;i<DN;i++){ dp[i*3]=(Math.random()-.5)*12; dp[i*3+1]=Math.random()*16; dp[i*3+2]=-Math.random()*(N*BAY)+4; }
const dg=new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.BufferAttribute(dp,3));
const dustMat=new THREE.PointsMaterial({size:.05, transparent:true, depthWrite:false});
/* dust motes are left out: at this size they only shimmered */

/* ============================================================
   Two moods.
   Morning is the original day scene, untouched in its shade and
   materials (rose-cream plaster, sage in the shadows); only the sun
   turns a pale, low-saturation yellow-green, with a faint bloom.
   Dusk takes the palette of the reference painting: taupe air and
   shade (#5f5348), olive-grey in the vault (#373324), and one
   orange (#e58753) from a big, far sunset low over the left
   shoulder. The sun itself is below the horizon, so the door
   opens onto plain dusk air. Fill values were solved back through
   the tone curve so the shade lands on that taupe.
   ============================================================ */
const MOODS={
  light:{
    raw:true, maps:"day", wallShadows:true, marbleRough:.5, paint:[1,0],
    mats:{wall:0xf0d8c2, plaster:0xf3e2cf, vault:0xe9d2bb, rib:0xcdb9a4, marble:0xf4e9dc, niche:0x9c9b80, floor:0xe2d2c1}, floorOpacity:.8,
    bg:0xeee2d4, air:0xebdfcf, fogNear:70, fogFar:320, exposure:.9,
    sun:[0xe0ff88,3.6], sunPos:[-38,52,46], sunTarget:[6,0,-34], sunShadow:true,
    wash:[0xffffff,0], washPos:[0,60,80],
    dusk:[0xffffff,0], duskPos:[-80,20,60], duskTarget:[0,4,-40],
    hemi:[0xe6dcc6,0x8f8a62,.5],
    door:[0xf0f8d0,2.2], glow:.5, haze:[0xf0f6d6,.08],
    shaft:[0xeaf7c0,.07], dust:[0xf6fadf,.55], sky:[0xf8fbe8,true],
    bloom:[.25,.6,.92], grain:.03
  },
  dark:{
    raw:false, maps:"dusk", wallShadows:true, marbleRough:1, paint:[0,.009],
    grey:0xbcbcbc, floorOpacity:.76,
    bg:0x5f5348, air:0x5f5348, fogNear:30, fogFar:210, exposure:1.0,
    sun:[0xffffff,0], sunPos:[0,70,-130], sunTarget:[0,0,-30], sunShadow:false,
    wash:[0xffffff,0], washPos:[0,60,80],
    dusk:[0xff7f48,5.6], duskPos:[-90,22,-12], duskTarget:[4,5,-34],
    hemi:[0xffe4d8,0xfff4c8,1], hemiK:[.31,.12],
    door:[0xffffff,0], glow:0, haze:[0xe58753,0],
    shaft:[0xe58753,0], dust:[0xe58753,.35], sky:[0x6b6763,false],
    bloom:[.5,.85,.5], grain:.045
  }
};
MOODS.night=Object.assign({}, MOODS.dark, {
  bg:0x0c0a09, air:0x0c0a09, fogNear:6, fogFar:78, exposure:.9,
  dusk:[0xff7f48,0], hemi:[0x6a5544,0x0c0806,.6], hemiK:[.12,.04],
  door:[0xffb070,1.4], glow:.28, haze:[0xe58753,0], dust:[0xffc890,.3],
  sky:[0x15120f,false], bloom:[.45,.7,.62], grain:.05, lamp:[0xffa65c,1.1]
});
let forcedMood=null;
const lin=(c,hex)=>c.setHex(hex).convertSRGBToLinear();
let accentHex=null, curMood=null;
function setAccent(h){ accentHex=h; if(!curMood||!curMood.door[1]) return; const c=new THREE.Color(h).lerp(new THREE.Color(curMood.door[0]),.35); doorLight.color.copy(c); glow.material.color.copy(c); dirty=true; }
function applyMood(name){
  if(forcedMood) name=forcedMood;
  const m=MOODS[name]; curMood=m; const col=(c,hex)=> m.raw ? c.setHex(hex) : lin(c,hex);
  /* fog and clear color land after the shader's own encoding; through the bloom chain that space is linear */
  const air=c=> composer ? lin(new THREE.Color(),c) : new THREE.Color(c);
  scene.background=air(m.bg); scene.fog.color.copy(air(m.air)); scene.fog.near=m.fogNear; scene.fog.far=m.fogFar;
  renderer.toneMappingExposure=m.exposure;
  Object.keys(MAPS).forEach(k=>{ const mt=M[k], [map,bump]=MAPS[k][m.maps];
    if(mt.bumpMap!==bump) mt.needsUpdate=true; mt.map=map; mt.bumpMap=bump; });
  Object.keys(M).forEach(k=> col(M[k].color, m.mats ? m.mats[k==="wallBox"?"wall":k] : m.grey));
  M.marble.roughness=m.marbleRough; M.floor.opacity=m.floorOpacity;
  PAINT.uSpec.value=m.paint[0]; PAINT.uJitter.value=m.paint[1];
  col(sun.color,m.sun[0]); sun.intensity=m.sun[1]; sun.castShadow=m.sunShadow; sun.visible=m.sun[1]>0;
  sun.position.set(...m.sunPos); sun.target.position.set(...m.sunTarget); sun.target.updateMatrixWorld();
  col(wash.color,m.wash[0]); wash.intensity=m.wash[1]; wash.visible=m.wash[1]>0; wash.position.set(...m.washPos); wash.target.position.set(0,0,-30); wash.target.updateMatrixWorld();
  col(dusk.color,m.dusk[0]); dusk.intensity=m.dusk[1]; dusk.visible=m.dusk[1]>0;
  dusk.position.set(...m.duskPos); dusk.target.position.set(...m.duskTarget); dusk.target.updateMatrixWorld();
  col(hemi.color,m.hemi[0]); col(hemi.groundColor,m.hemi[1]); hemi.intensity=m.hemi[2];
  if(m.hemiK){ hemi.color.multiplyScalar(m.hemiK[0]); hemi.groundColor.multiplyScalar(m.hemiK[1]); }
  blockers.forEach(o=>o.castShadow=m.wallShadows);
  ribs.forEach(o=>o.receiveShadow=m.wallShadows && !m.raw);   /* the original morning keeps its sunlit white ribs */
  col(doorLight.color,m.door[0]); doorLight.intensity=m.door[1]; doorLight.visible=m.door[1]>0;
  col(glow.material.color,m.door[0]); glow.userData.base=m.glow; glow.material.opacity=m.glow; glow.visible=glowBelow.visible=m.glow>0;
  glowBelow.visible=false;
  hazes.forEach(h=>{ col(h.material.color,m.haze[0]); h.material.opacity=m.haze[1]; h.visible=m.haze[1]>0; });
  col(dustMat.color,m.dust[0]); dustMat.opacity=m.dust[1];
  /* the far air: in the morning as the original drew it, at dusk an exact taupe */
  skyMat.toneMapped=m.sky[1]; (m.sky[1] ? col : lin)(skyMat.color,m.sky[0]); skyMat.needsUpdate=true;
  skyBelow.visible = name!=='light';
  { const L=m.lamp||[0xffffff,0]; col(lamp.color,L[0]); lamp.intensity=L[1]; lamp.visible=L[1]>0; }
  if(bloom){ bloom.strength=m.bloom[0]; bloom.radius=m.bloom[1]; bloom.threshold=m.bloom[2]; }
  if(frost) frost.uniforms.uGrain.value=m.grain;
  forecourt.visible = name!=='light';
  canopy.visible = name==='light'; placeCanopy();
  buildShafts(m.shaft[0], m.shaft[1], col);
  if(accentHex!==null) setAccent(accentHex);
}
const root=document.documentElement, mq=matchMedia("(prefers-color-scheme: dark)");
const current=()=> root.dataset.theme || (mq.matches ? "dark" : "light");
applyMood(current());
if(mq.addEventListener) mq.addEventListener("change", ()=>{ if(!root.dataset.theme){ applyMood(current()); dirty=true; if(still) frame(); } });
document.getElementById("mode").addEventListener("click", ()=>{
  root.dataset.theme = current()==="dark" ? "light" : "dark"; applyMood(root.dataset.theme); dirty=true; if(still) frame();
});

/* ============================================================
   Camera and loop
   ============================================================ */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); dirty=true; if(composer){ composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w,h); if(frost){ const pr=renderer.getPixelRatio(); frost.uniforms.uRes.value.set(w*pr,h*pr); frost.uniforms.uCell.value=Math.max(1,Math.round(pr)); } } camera.aspect=w/h;
  focusT=focusC=(window.hallFocus?hallFocus():.4); applyFocus();
  if(still) frame(); }
let focusT=.4, focusC=.4, focusF=.4, focusStart=-1; const FOCUS_DUR=.8;
function applyFocus(){ const w=innerWidth,h=innerHeight; if(w>1000){ const full=w*1.6; camera.setViewOffset(full,h, Math.max(0,Math.min(.6*w, full/2-focusC*w)),0, w,h); } else camera.clearViewOffset(); camera.updateProjectionMatrix(); }
let mx=0,my=0,tx=0,ty=0, dirty=true;
addEventListener("pointermove", e=>{ tx=e.clientX/innerWidth-.5; ty=e.clientY/innerHeight-.5; if(still) requestAnimationFrame(frame); });
const clock=new THREE.Clock();
let push=0, tripStart=-1; const TRIP=1.15;
function frame(){
  /* a still picture: nothing drifts, pulses or flickers. The camera only follows
     the pointer, and when it has settled nothing is redrawn at all. */
  const k=still?1:.06;
  const dx=tx-mx, dy=ty-my, moving=Math.abs(dx)>1e-4 || Math.abs(dy)>1e-4;
  mx+=dx*k; my+=dy*k;
  const focusing = focusStart>=0; if(focusing){ const q=Math.min(1,(clock.getElapsedTime()-focusStart)/FOCUS_DUR), e=1-Math.pow(1-q,3); focusC=focusF+(focusT-focusF)*e; applyFocus(); if(q>=1) focusStart=-1; }
  const travelling = tripStart>=0 || focusing;
  if(tripStart>=0){ const p=Math.min(1,(clock.getElapsedTime()-tripStart)/TRIP); push=(1-Math.cos(Math.PI*Math.min(p,.62)/.62))/2*9; if(p>=1){ push=0; tripStart=-1; } }
  if(moving || dirty || travelling){
    camera.position.set(mx*2.4, 3.4-my*1.6, 16-push);
    camera.lookAt(mx*1.2, 7.4-my*1.2, -60);
    if(composer) composer.render(); else renderer.render(scene,camera);
    dirty=false;
  }
  if(!still) requestAnimationFrame(frame);
}
addEventListener("resize", resize); resize();
window.HALL={ accent:setAccent, travel(){ if(!still){ tripStart=clock.getElapsedTime(); } }, force(n){ if(forcedMood===n) return; forcedMood=n; applyMood(n||current()); dirty=true; if(still) frame(); }, focus(){ focusT=window.hallFocus?hallFocus():.4; if(still){ focusC=focusT; applyFocus(); dirty=true; frame(); } else { focusF=focusC; focusStart=clock.getElapsedTime(); } } };
if(typeof PEOPLE!=="undefined") setAccent(PEOPLE[cur].accent);
frame();
})();
</script>
