<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helios 人物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ece2d5; --ink:#3a322a; --dim:#7a6c5c; --line:rgba(58,50,42,.5); --faint:rgba(58,50,42,.18);
    --panel:rgba(250,244,234,.6); --chip:rgba(255,250,242,.5); --frame:rgba(58,50,42,.55);
    --wide:"Helvetica Neue", "Inter", Arial, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
    --sans:"Noto Sans SC", "PingFang SC", sans-serif;
    --serif:"Noto Serif SC", "Songti SC", serif;
    /* every column shares one top line and one bottom line */
    --sat:.82; --veil:radial-gradient(110% 90% at 10% -10%, rgba(240,246,196,.3), rgba(240,246,196,0) 60%); --veil-blend:screen;
    --fig-amb:none; --fig-key:none;   /* by day the painting keeps its own colour */
    --edge:4vw; --top:5rem; --bot:1.375rem; --nameW:21vw; --A:.5037; --pad:1.375rem; --r:1.625rem;   /* one corner radius for the frame and the readout */   /* --A: width/height of the painting */
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#231e1b; --ink:#efe5d5; --dim:#b3a48f; --line:rgba(239,229,213,.5); --faint:rgba(239,229,213,.17);
      --panel:rgba(30,25,21,.58); --chip:rgba(30,24,20,.45); --frame:rgba(239,229,213,.55); color-scheme:dark;
      --bg:#5f5348; --sat:1; --veil:radial-gradient(90% 80% at 50% 46%, rgba(95,83,72,0) 45%, rgba(55,51,36,.35) 100%); --veil-blend:multiply;
      --fig-amb:linear-gradient(100deg, #f2d9c2 0%, #c9b3a2 55%, #9c8a7e 100%); --fig-key:linear-gradient(100deg, rgba(229,135,83,.7) 0%, rgba(229,135,83,.18) 45%, rgba(229,135,83,0) 75%);
    }
  }
  :root[data-theme="dark"]{
    --bg:#231e1b; --ink:#efe5d5; --dim:#b3a48f; --line:rgba(239,229,213,.5); --faint:rgba(239,229,213,.17);
    --panel:rgba(30,25,21,.58); --chip:rgba(30,24,20,.45); --frame:rgba(239,229,213,.55); color-scheme:dark;
      --bg:#5f5348; --sat:1; --veil:radial-gradient(90% 80% at 50% 46%, rgba(95,83,72,0) 45%, rgba(55,51,36,.35) 100%); --veil-blend:multiply;
      --fig-amb:linear-gradient(100deg, #f2d9c2 0%, #c9b3a2 55%, #9c8a7e 100%); --fig-key:linear-gradient(100deg, rgba(229,135,83,.7) 0%, rgba(229,135,83,.18) 45%, rgba(229,135,83,0) 75%);
  }
  /* everything is sized in rem, and rem follows the window, so the page keeps its proportions on any screen */
  html{ font-size:clamp(12px, min(1.1111vw, 1.7778vh), 26px) }
  @media (max-width: 1000px){ html{ font-size:16px } }
  *{ box-sizing:border-box }
  html,body{ margin:0; height:100% }
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased }
  button{ font:inherit }

  /* ---------- the lit hall behind everything ---------- */
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; filter:saturate(var(--sat)) }
  .veil{ position:fixed; inset:0; z-index:1; pointer-events:none; background:var(--veil); mix-blend-mode:var(--veil-blend) }
  .grain{ position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.22; mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
  .wash{ position:fixed; inset:0; z-index:1; pointer-events:none; background:var(--bg); opacity:0; transition:opacity .45s ease }
  .wash.on{ opacity:1 }

  .topbar{ position:fixed; z-index:4; left:4vw; right:4vw; top:1.375rem; display:flex; align-items:center; gap:1.375rem }
  .mark{ font-family:var(--wide); font-weight:400; letter-spacing:.34em; font-size:0.875rem }
  .topbar .rule{ flex:1 }
  .count{ font-family:var(--mono); font-size:0.6875rem; letter-spacing:.12em; color:var(--dim) }
  .mode{
    all:unset; cursor:pointer; width:2.125rem; height:2.125rem; display:grid; place-items:center; border-radius:50%;
    background:var(--chip); color:var(--ink); -webkit-backdrop-filter:blur(0.375rem); backdrop-filter:blur(0.375rem);
  }
  .mode:focus-visible{ outline:1px solid var(--ink); outline-offset:0.1875rem }


  /* ---------- bottom-left: the name, then the switch ---------- */
  /* the full name stays just inside the frame's bottom line; the switch drops to the page's bottom inset */
  .nav{ display:flex; align-items:center; gap:0.875rem; margin-top:1.625rem; pointer-events:auto }
  .nav button{ all:unset; cursor:pointer; color:var(--ink); display:grid; place-items:center; width:2rem; height:1.375rem }
  .nav button svg{ width:1.75rem; height:0.9375rem }
  .nav button:focus-visible{ outline:1px solid var(--ink); outline-offset:0.1875rem }
  .nav .dots{ display:flex; gap:0.625rem }
  .nav .dots button{ width:auto; height:auto; font-family:var(--mono); font-size:0.6562rem; letter-spacing:.12em; color:var(--dim); padding:0.25rem 0; border-bottom:1px solid transparent; white-space:nowrap }
  .nav .dots button[aria-current="true"]{ color:var(--ink); border-bottom-color:var(--ink) }

  .plate{ position:fixed; z-index:3; left:var(--edge); bottom:var(--bot); width:var(--nameW); pointer-events:none }
  .plate .who{
    font-family:var(--wide); font-weight:200; text-transform:uppercase; white-space:nowrap;
    font-size:min(4.6vw, 4.75rem); line-height:.9; letter-spacing:.08em; margin:0 0 0 -.04em;
  }
  .plate .full{ margin-top:0.875rem; display:flex; align-items:center; gap:0.75rem; font-family:var(--mono); font-size:0.6875rem; letter-spacing:.14em; color:var(--dim) }
  .plate .full::before{ content:""; width:2.25rem; height:1px; background:var(--line) }

  /* ---------- B: the painting, framed, snug ---------- */
  .frame{
    position:fixed; z-index:2; top:var(--top); bottom:var(--bot); left:calc(var(--edge) + var(--nameW) + 1.6vw);
    width:calc((100vh - var(--top) - var(--bot) - 2 * var(--pad)) * var(--A) + 2 * var(--pad));
    touch-action:pan-y; user-select:none;
  }
  .figure{
    position:absolute; left:50%; top:50%; height:calc((100% - 2 * var(--pad)) * var(--hs, 1)); aspect-ratio:var(--ar, 814/1616);
    transform:translate(-50%,-50%); transition:opacity .5s ease, transform .7s cubic-bezier(.2,.7,.2,1);
  }
  /* the frame is painted: a 0.1875rem stroke with ragged edges and dry, broken patches */
  .brush{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; color:var(--ink); opacity:.72 }
  .brush path{ fill:none; stroke:currentColor; stroke-width:3; stroke-linejoin:round }
  .figure .lit{ position:absolute; inset:0; pointer-events:none; -webkit-mask-size:100% 100%; mask-size:100% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat }
  .figure .amb{ background:var(--fig-amb); mix-blend-mode:multiply }
  .figure .key{ background:var(--fig-key); mix-blend-mode:soft-light }
  .figure img{ width:100%; height:100%; display:block; pointer-events:none;
    filter:drop-shadow(0 0 .6px rgba(40,30,20,.3)) drop-shadow(0 0.875rem 1.625rem rgba(40,28,18,.16)) }
  .figure.out-l{ opacity:0; transform:translate(-62%,-50%) }
  .figure.out-r{ opacity:0; transform:translate(-38%,-50%) }

  /* ---------- C: the readout, same height as the frame ---------- */
  .readout{
    position:fixed; z-index:3; right:4vw; top:var(--top); max-height:calc(100vh - var(--top) - var(--bot) - 8.9rem - 1.1rem); width:clamp(22.5rem, 33vw, 25rem);
    display:flex; flex-direction:column; padding:1.125rem 1.375rem 0;
    border:1px solid var(--line); border-radius:var(--r);
    background:var(--panel); -webkit-backdrop-filter:blur(0.625rem) saturate(.9); backdrop-filter:blur(0.625rem) saturate(.9);
    transition:opacity .4s ease;
  }
  .readout.fade .in{ opacity:0 }
  .readout .in{ display:flex; flex-direction:column; min-height:0; flex:0 1 auto; transition:opacity .35s ease }
  .readout::before, .readout::after{ content:""; position:absolute; width:1.375rem; height:1.375rem; border:1px solid var(--ink); pointer-events:none }
  .readout::before{ left:-0.375rem; top:-0.375rem; border-right:0; border-bottom:0; border-top-left-radius:calc(var(--r) + 0.375rem) }
  .readout::after{ right:-0.375rem; bottom:-0.375rem; border-left:0; border-top:0; border-bottom-right-radius:calc(var(--r) + 0.375rem) }

  .tabs{ display:flex; gap:1.375rem; border-bottom:1px solid var(--faint) }
  .tabs button{
    all:unset; cursor:pointer; padding:0 0 0.625rem; margin-bottom:-1px; color:var(--dim);
    font-family:var(--wide); text-transform:uppercase; font-size:0.5938rem; letter-spacing:.26em;
    border-bottom:1px solid transparent;
  }
  .tabs button small{ font-family:var(--sans); letter-spacing:.08em; margin-left:0.375rem; font-size:0.6562rem }
  .tabs button[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--ink) }
  .tabs button:focus-visible, .chips button:focus-visible, .pager button:focus-visible, .go:focus-visible{ outline:1px solid var(--ink); outline-offset:0.1875rem }

  .chips{ display:flex; flex-wrap:wrap; gap:0.375rem; margin:0.875rem 0 0.125rem }
  .chips button{
    all:unset; cursor:pointer; padding:0.125rem 0.625rem; border:1px solid var(--faint); border-radius:999px;
    font-size:0.6875rem; letter-spacing:.12em; color:var(--dim);
  }
  .chips button[aria-pressed="true"]{ border-color:var(--ink); color:var(--ink) }

  .body{ flex:0 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:1.125rem 0 0 0; scrollbar-width:thin; scrollbar-color:var(--faint) transparent }
  .rows{ margin:0 0 0 0.1875rem; padding:0 0 0 1.125rem; border-left:1px solid var(--faint); list-style:none }
  .rows li{ position:relative; margin:0 0 0.625rem; font-size:0.75rem; font-weight:300; line-height:1.8 }
  .rows li::before{ content:""; position:absolute; left:-1.125rem; top:.9em; width:0.75rem; height:1px; background:var(--line) }
  .rows li::after{ content:""; position:absolute; left:-0.5rem; top:calc(.9em - 0.1875rem); border:0.1875rem solid transparent; border-left:0.3125rem solid var(--line) }
  .rows b{ display:block; font-family:var(--mono); font-weight:400; font-size:0.5938rem; letter-spacing:.08em; color:var(--dim); margin-bottom:1px }
  .go{ all:unset; cursor:pointer; border-bottom:1px solid var(--line); color:var(--ink) }

  /* 资料: one left edge, one rhythm (1.5rem between blocks), nothing stretched */
  .sheet{ padding:0.25rem 0 1.25rem }
  .sheet > div + div{ margin-top:1.5rem }
  .sheet .role{ margin:0; font-size:1.0625rem; line-height:1.4; font-weight:300; letter-spacing:.02em; white-space:nowrap }
  .sheet .role i{ font-style:normal; color:var(--dim); margin:0 .35em }
  .sheet .place{ margin:0.375rem 0 0; font-size:0.75rem; line-height:1.6; color:var(--dim); font-weight:300 }
  .sheet .stats{ font-size:0.875rem; line-height:1.6; font-weight:300; letter-spacing:.02em }
  .sheet .stats span{ white-space:nowrap }
  .sheet .stats span + span{ margin-left:0.75rem }
  .sheet .stats em{ font-style:normal; color:var(--dim); margin:0 0.875rem }
  .sheet h3{ margin:0 0 0.5rem; font-family:var(--mono); font-weight:400; font-size:0.5938rem; line-height:1; letter-spacing:.18em; color:var(--dim) }
  .sheet p{ margin:0; font-size:0.7812rem; line-height:1.8; font-weight:300 }
  .sheet ol{ list-style:none; margin:0; padding:0 }
  .sheet ol li{ display:grid; grid-template-columns:1.5rem 1fr; font-size:0.7812rem; line-height:1.8; font-weight:300 }
  .sheet ol b{ font-family:var(--mono); font-weight:400; font-size:0.625rem; color:var(--dim); line-height:2.25 }
  .sheet .likes{ font-size:0.7812rem; line-height:1.8; font-weight:300 }
  .sheet .likes span{ white-space:nowrap }
  .sheet .likes i{ font-style:normal; color:var(--dim); margin:0 .45em }

  /* 故事: two plain two-column lists. Names, then ages, in the left column */
  .tale{ padding:0 0 0.625rem }
  .tale h3{ margin:0 0 0.5rem; font-family:var(--mono); font-weight:400; font-size:0.5938rem; line-height:1; letter-spacing:.18em; color:var(--dim) }
  .tale dl{ display:grid; gap:0.125rem 0.75rem; margin:0 0 0.875rem; font-size:0.75rem; line-height:1.6; font-weight:300 }
  .tale dl:last-child{ margin-bottom:0 }
  .tale .rel{ grid-template-columns:3.625rem 1fr }
  .tale dt{ font-family:var(--wide); font-weight:400; letter-spacing:.04em }
  /* the timeline: ages stand where the nodes were, a thin line runs between them */
  .tl{ list-style:none; margin:0; padding:0; font-size:0.75rem; line-height:1.6; font-weight:300 }
  .tl li{ position:relative; padding:0 0 0.3125rem 2.125rem }
  .tl li:last-child{ padding-bottom:0 }
  .tl b{ position:absolute; left:0; top:0; width:1.375rem; text-align:center; font-family:var(--wide); font-weight:400; font-size:0.6875rem; line-height:1.1875rem; letter-spacing:.02em }
  .tl li:not(:last-child)::after{ content:""; position:absolute; left:0.6875rem; top:1.25rem; bottom:1px; width:1px; background:var(--line) }
  .tale dd{ margin:0 }
  /* 秘闻: short headings, then the note; hidden spans stay black until you look */
  .tale .secrets{ display:block }
  .tale .secrets dt{ margin-top:0.75rem; font-family:var(--sans); font-size:0.6875rem; letter-spacing:.06em; color:var(--dim) }
  .tale .secrets dt:first-child{ margin-top:0 }
  .tale .secrets dd{ margin:0.25rem 0 0; line-height:1.85 }
  .spoil{ background:var(--ink); color:transparent; border-radius:0.1875rem; padding:0.0625rem 0.125rem; cursor:help;
    -webkit-box-decoration-break:clone; box-decoration-break:clone; transition:background .3s ease, color .3s ease; outline:none }
  .spoil::selection{ color:transparent }
  .spoil:hover, .spoil:focus-visible, .spoil.open{ background:var(--faint); color:var(--ink) }

  .story{ display:flex; flex-direction:column; flex:1; min-height:0; padding-top:1rem }
  .page{ flex:1; min-height:0; overflow:auto; scrollbar-width:thin; scrollbar-color:var(--faint) transparent; padding-right:0.375rem }
  .page .num{ font-family:var(--wide); font-weight:200; font-size:1.25rem; letter-spacing:.1em; color:var(--dim); margin:0 0 0.625rem }
  .page p{ margin:0; font-family:var(--serif); font-size:0.7812rem; line-height:2; text-align:justify; animation:in .5s ease }
  @keyframes in{ from{ opacity:0; transform:translateX(0.875rem) } to{ opacity:1; transform:none } }
  .pager{ display:flex; align-items:center; justify-content:space-between; padding:0.75rem 0 1rem; border-top:1px solid var(--faint); margin-top:0.75rem }
  .pager button{ all:unset; cursor:pointer; width:2.25rem; height:1.375rem; display:grid; place-items:center; color:var(--ink) }
  .pager button:disabled{ opacity:.25; cursor:default }
  .pager button svg{ width:1.75rem; height:0.9375rem }
  .pager span{ font-family:var(--mono); font-size:0.625rem; letter-spacing:.14em; color:var(--dim) }

  /* ---------- 词条: a card over the readout's place ---------- */
  .term{ all:unset; cursor:pointer; border-bottom:1px dotted var(--ink); }
  .term:hover{ border-bottom-style:solid }
  .term:focus-visible{ outline:1px solid var(--ink); outline-offset:0.125rem }
  .entry .head{ position:relative; padding-right:2.125rem }
  .entry .tag{ font-family:var(--mono); font-size:0.5938rem; letter-spacing:.18em; color:var(--dim) }
  .entry h2{ margin:0.4375rem 0 0; font-size:1.1875rem; font-weight:300; letter-spacing:.04em }
  .entry .close{ all:unset; cursor:pointer; position:absolute; right:-0.375rem; top:-0.25rem; width:1.75rem; height:1.75rem; display:grid; place-items:center; color:var(--ink) }
  .entry .close:focus-visible{ outline:1px solid var(--ink); outline-offset:0.125rem }
  .entry .ebody{ flex:0 1 auto; min-height:0; overflow-y:auto; margin-top:0.75rem; padding:0.75rem 0.25rem 1.125rem 0; border-top:1px solid var(--faint); scrollbar-width:thin; scrollbar-color:var(--faint) transparent }
  .entry .ebody p{ margin:0 0 .8em; font-size:0.7812rem; line-height:1.85; font-weight:300; text-align:justify }
  .entry .ebody h3{ margin:1.125rem 0 0.5rem; font-family:var(--mono); font-weight:400; font-size:0.5938rem; letter-spacing:.18em; color:var(--dim) }
  .entry .ebody .desc{ font-style:italic; color:var(--dim); margin-bottom:1.1em }
  .entry .ebody.scene p:not(.desc){ font-family:var(--serif); font-size:0.75rem; line-height:1.78; margin-bottom:.4em }
  .entry .ebody p:last-child{ margin-bottom:0 }
  .entry .ebody blockquote{ margin:.2em 0 .9em; padding:.1em 0 .1em .9em; border-left:1px solid var(--line); font-family:var(--serif); font-size:0.75rem; line-height:1.78; font-style:italic }
  .entry .ebody p.gap{ text-align:center; color:var(--dim); letter-spacing:.3em; margin:.6em 0 1em }
  .readout .in.entry{ animation:entryIn .35s cubic-bezier(.2,.7,.2,1) }
  @keyframes entryIn{ from{ opacity:0; transform:translateX(0.625rem) } to{ opacity:1; transform:none } }

  /* the readout folds away when you click into the hall */
  .readout{ transition:opacity .45s ease, transform .55s cubic-bezier(.2,.7,.2,1) }
  body.bare .readout{ opacity:0; transform:translateX(1.75rem); pointer-events:none }
  .frame:focus:not(:focus-visible), .slot:focus:not(:focus-visible){ outline:none }
  .frame{ cursor:pointer; transform:translateX(var(--shift,0px)); transition:transform .8s cubic-bezier(.33,1,.68,1) }

  /* ---------- stickers: die-cut, draggable, they stay where you leave them ---------- */
  .sticker{ all:unset; box-sizing:border-box; position:fixed; z-index:2; width:2.875rem; cursor:grab; touch-action:none; user-select:none;
    --s:1; --rot:-8deg; filter:drop-shadow(0 0.375rem 0.625rem rgba(30,20,12,.28));
    transform:rotate(var(--rot)) scale(var(--s)); transition:transform .2s ease }
  .sticker[hidden]{ display:none }
  .readout .in.swap .sheet, .readout .in.swap .tale{ animation:swapIn .5s ease }
  @keyframes swapIn{ from{ opacity:0; transform:translateY(.3rem) } }
  #deer, #deer2{ width:3.6rem }
  /* a line said beside a sticker or the thing in hand */
  .say{ position:fixed; z-index:6; transform:translate(-50%, calc(-100% - .4rem)); text-align:center; white-space:nowrap; pointer-events:none;
    font-family:var(--serif); font-size:.8rem; line-height:1.6; color:var(--ink); text-shadow:0 0 .5rem var(--bg), 0 0 .2rem var(--bg);
    opacity:0; transition:opacity .35s ease, transform .35s ease }
  .say small{ display:block; font-family:var(--mono); font-size:.58rem; letter-spacing:.14em; color:var(--dim) }
  .say.show{ opacity:1; transform:translate(-50%, calc(-100% - .7rem)) }
  .sticker.away{ opacity:0; visibility:hidden; pointer-events:none; transition:opacity .4s ease, visibility 0s .4s }
  .sticker{ transition:transform .2s ease, opacity .4s ease }
  .sticker.drag, .sticker.turn{ transition:none }
  .sticker.drag{ cursor:grabbing }
  .sticker.pop{ animation:pop .45s cubic-bezier(.2,1.6,.4,1) }
  .sticker.boop{ animation:boop .5s cubic-bezier(.3,1.6,.5,1) }
  @keyframes boop{ 40%{ transform:rotate(var(--rot)) scale(calc(var(--s) * 1.12), calc(var(--s) * .88)) } }
  @keyframes pop{ from{ transform:rotate(var(--rot)) scale(.2); opacity:0 } }
  .sticker:focus-visible{ outline:1px solid var(--ink); outline-offset:0.25rem; border-radius:0.5rem }
  /* the handle: drag it to turn and resize; it stays the same size on screen */
  .sticker .handle{ position:absolute; right:-0.375rem; bottom:-0.375rem; width:calc(0.6875rem / var(--s)); height:calc(0.6875rem / var(--s));
    border-radius:50%; background:var(--bg); border:calc(1px / var(--s)) solid var(--ink); cursor:nwse-resize; opacity:0; transition:opacity .2s }
  .sticker:hover .handle, .sticker:focus-visible .handle, .sticker.turn .handle{ opacity:1 }
  .sticker img{ display:block; width:100%; height:auto; pointer-events:none }
  .sticker .lit{ position:absolute; inset:0; pointer-events:none; -webkit-mask-size:100% 100%; mask-size:100% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat }
  .sticker .amb{ background:var(--fig-amb); mix-blend-mode:multiply }
  .sticker .key{ background:var(--fig-key); mix-blend-mode:soft-light }
  @media (prefers-reduced-motion: reduce){ .readout .in.entry, .sticker.pop, .sticker.boop{ animation:none } .sticker, .readout{ transition:none } }

  /* ---------- 背包: one row, a block aligned under the readout; it shows itself on hover ---------- */
  .inv{ position:fixed; z-index:3; right:4vw; bottom:var(--bot); width:clamp(22.5rem, 33vw, 25rem);
    padding:.85rem 1.1rem 1rem; border:1px solid transparent; border-radius:var(--r);
    transition:background .35s ease, border-color .35s ease, -webkit-backdrop-filter .35s, backdrop-filter .35s }

  el.addEventListener("pointerdown",e=>{ if(turning) return; down=true; moved=false; sx=e.clientX; sy=e.clientY; ox=el.offsetLeft; oy=el.offsetTop; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointermove",e=>{ if(!down) return; const dx=e.clientX-sx, dy=e.clientY-sy;

}

/* moving things about */
function takeOut(id){ const s=me(); s.bag=s.bag.map(x=>x===id?null:x); Object.keys(s.worn).forEach(k=>{ if(s.worn[k]===id) s.worn[k]=null; }); }

/* the wrong slot: she catches it, says something, and it goes back in the bag.

const JOKES={

/* drag and drop, by pointer: works with a mouse, a pen or a finger */
function dropAt(x,y){ for(const el of document.elementsFromPoint(x,y)){ const d=el.closest("[data-drop]"); if(d) return d; } return null; }

Object.values(ITEMS).forEach(it=>{ const s=it.skin?it.skin.art:it.fig; if(s){ const im=new Image(); im.src=s; } }); { const im=new Image(); im.src="images/iris-apple.webp"; }

<script>

const leafTex=leafC();
const canopy=new THREE.Mesh(new THREE.PlaneGeometry(190,190),
  new THREE.MeshBasicMaterial({map:leafTex, alphaTest:.5, transparent:true, colorWrite:false, depthWrite:false, side:THREE.DoubleSide}));

function placeCanopy(){
  const d=new THREE.Vector3().subVectors(sun.position, sun.target.position);
  canopy.position.copy(sun.target.position).add(d.multiplyScalar(.62));

  const c=document.createElement("canvas"); c.width=8; c.height=256; const x=c.getContext("2d");

const sTex=shaftTex(); let shafts=[];

  shafts.forEach(s=>scene.remove(s)); shafts=[];

const DN=1400, dp=new Float32Array(DN*3);
for(let i=0;i<DN;i++){ dp[i*3]=(Math.random()-.5)*12; dp[i*3+1]=Math.random()*16; dp[i*3+2]=-Math.random()*(N*BAY)+4; }
const dg=new THREE.BufferGeometry(); dg.setAttribute("position", new THREE.BufferAttribute(dp,3));
const dustMat=new THREE.PointsMaterial({size:.05, transparent:true, depthWrite:false});
/* dust motes are left out: at this size they only shimmered */

/* ============================================================

   Dusk takes the palette of the reference painting: taupe air and
   shade (#5f5348), olive-grey in the vault (#373324), and one

const MOODS={
  light:{
    raw:true, maps:"day", wallShadows:true, marbleRough:.5, paint:[1,0],
    mats:{wall:0xf0d8c2, plaster:0xf3e2cf, vault:0xe9d2bb, rib:0xcdb9a4, marble:0xf4e9dc, niche:0x9c9b80, floor:0xe2d2c1}, floorOpacity:.8,
    bg:0xeee2d4, air:0xebdfcf, fogNear:70, fogFar:320, exposure:.9,
    sun:[0xe0ff88,3.6], sunPos:[-38,52,46], sunTarget:[6,0,-34], sunShadow:true,
    wash:[0xffffff,0], washPos:[0,60,80],
    dusk:[0xffffff,0], duskPos:[-80,20,60], duskTarget:[0,4,-40],
    hemi:[0xe6dcc6,0x8f8a62,.5],
    door:[0xf0f8d0,2.2], glow:.5, haze:[0xf0f6d6,.08],
    shaft:[0xeaf7c0,.07], dust:[0xf6fadf,.55], sky:[0xf8fbe8,true],
    bloom:[.25,.6,.92], grain:.03

  dark:{
    raw:false, maps:"dusk", wallShadows:true, marbleRough:1, paint:[0,.009],
    grey:0xbcbcbc, floorOpacity:.76,
    bg:0x5f5348, air:0x5f5348, fogNear:30, fogFar:210, exposure:1.0,
    sun:[0xffffff,0], sunPos:[0,70,-130], sunTarget:[0,0,-30], sunShadow:false,
    wash:[0xffffff,0], washPos:[0,60,80],
    dusk:[0xff7f48,5.6], duskPos:[-90,22,-12], duskTarget:[4,5,-34],
    hemi:[0xffe4d8,0xfff4c8,1], hemiK:[.31,.12],
    door:[0xffffff,0], glow:0, haze:[0xe58753,0],
    shaft:[0xe58753,0], dust:[0xe58753,.35], sky:[0x6b6763,false],
    bloom:[.5,.85,.5], grain:.045
  }
};
MOODS.night=Object.assign({}, MOODS.dark, {
  bg:0x0c0a09, air:0x0c0a09, fogNear:6, fogFar:78, exposure:.9,
  dusk:[0xff7f48,0], hemi:[0x6a5544,0x0c0806,.6], hemiK:[.12,.04],
  door:[0xffb070,1.4], glow:.28, haze:[0xe58753,0], dust:[0xffc890,.3],
  sky:[0x15120f,false], bloom:[.45,.7,.62], grain:.05, lamp:[0xffa65c,1.1]
});
let forcedMood=null;
const lin=(c,hex)=>c.setHex(hex).convertSRGBToLinear();
let accentHex=null, curMood=null;
function setAccent(h){ accentHex=h; if(!curMood||!curMood.door[1]) return; const c=new THREE.Color(h).lerp(new THREE.Color(curMood.door[0]),.35); doorLight.color.copy(c); glow.material.color.copy(c); dirty=true; }
function applyMood(name){
  if(forcedMood) name=forcedMood;
  WATER.uWater.value = name==='dark' ? 1 : 0;
  const m=MOODS[name]; curMood=m; const col=(c,hex)=> m.raw ? c.setHex(hex) : lin(c,hex);
  /* fog and clear color land after the shader's own encoding; through the bloom chain that space is linear */
  const air=c=> composer ? lin(new THREE.Color(),c) : new THREE.Color(c);
  scene.background=air(m.bg); scene.fog.color.copy(air(m.air)); scene.fog.near=m.fogNear; scene.fog.far=m.fogFar;
  renderer.toneMappingExposure=m.exposure;
  Object.keys(MAPS).forEach(k=>{ const mt=M[k], [map,bump]=MAPS[k][m.maps];
    if(mt.bumpMap!==bump) mt.needsUpdate=true; mt.map=map; mt.bumpMap=bump; });
  Object.keys(M).forEach(k=> col(M[k].color, m.mats ? m.mats[k==="wallBox"?"wall":k] : m.grey));
  M.marble.roughness=m.marbleRough; M.floor.opacity=m.floorOpacity;
  PAINT.uSpec.value=m.paint[0]; PAINT.uJitter.value=m.paint[1];
  col(sun.color,m.sun[0]); sun.intensity=m.sun[1]; sun.castShadow=m.sunShadow; sun.visible=m.sun[1]>0;
  sun.position.set(...m.sunPos); sun.target.position.set(...m.sunTarget); sun.target.updateMatrixWorld();
  col(wash.color,m.wash[0]); wash.intensity=m.wash[1]; wash.visible=m.wash[1]>0; wash.position.set(...m.washPos); wash.target.position.set(0,0,-30); wash.target.updateMatrixWorld();

  dusk.position.set(...m.duskPos); dusk.target.position.set(...m.duskTarget); dusk.target.updateMatrixWorld();

  if(m.hemiK){ hemi.color.multiplyScalar(m.hemiK[0]); hemi.groundColor.multiplyScalar(m.hemiK[1]); }

  ribs.forEach(o=>o.receiveShadow=m.wallShadows && !m.raw);   /* the original morning keeps its sunlit white ribs */

  col(glow.material.color,m.door[0]); glow.userData.base=m.glow; glow.material.opacity=m.glow; glow.visible=glowBelow.visible=m.glow>0;
  glowBelow.visible=false;
  hazes.forEach(h=>{ col(h.material.color,m.haze[0]); h.material.opacity=m.haze[1]; h.visible=m.haze[1]>0; });

  { const L=m.lamp||[0xffffff,0]; col(lamp.color,L[0]); lamp.intensity=L[1]; lamp.visible=L[1]>0; }

const root=document.documentElement, mq=matchMedia("(prefers-color-scheme: dark)");
const current=()=> root.dataset.theme || (mq.matches ? "dark" : "light");

if(mq.addEventListener) mq.addEventListener("change", ()=>{ if(!root.dataset.theme){ applyMood(current()); dirty=true; if(still) frame(); } });
document.getElementById("mode").addEventListener("click", ()=>{
  root.dataset.theme = current()==="dark" ? "light" : "dark"; applyMood(root.dataset.theme); dirty=true; if(still) frame();
});

/* ============================================================
   Camera and loop
   ============================================================ */
function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); dirty=true; if(composer){ composer.setPixelRatio(renderer.getPixelRatio()); composer.setSize(w,h); if(frost){ const pr=renderer.getPixelRatio(); frost.uniforms.uRes.value.set(w*pr,h*pr); frost.uniforms.uCell.value=Math.max(1,Math.round(pr)); } } camera.aspect=w/h;
  focusT=focusC=(window.hallFocus?hallFocus():.4); applyFocus();
  if(still) frame(); }
let focusT=.4, focusC=.4, focusF=.4, focusStart=-1; const FOCUS_DUR=.8;
function applyFocus(){ const w=innerWidth,h=innerHeight; if(w>1000){ const full=w*1.6; camera.setViewOffset(full,h, Math.max(0,Math.min(.6*w, full/2-focusC*w)),0, w,h); } else camera.clearViewOffset(); camera.updateProjectionMatrix(); }
let mx=0,my=0,tx=0,ty=0, dirty=true;
addEventListener("pointermove", e=>{ tx=e.clientX/innerWidth-.5; ty=e.clientY/innerHeight-.5; if(still) requestAnimationFrame(frame); });
const clock=new THREE.Clock();
let rollC=0, rollF=0, rollT=0, rollStart=-1; const ROLL_DUR=1.6;
let push=0, tripStart=-1; const TRIP=1.15;

  if(moving || dirty || travelling){
    const rc=Math.cos(rollC), rs=Math.sin(rollC), px=mx*2.4, py=-my*1.6, lx=mx*1.2, ly=-my*1.2;
    camera.up.set(rs, rc, 0);
    camera.position.set(px*rc+py*rs, 3.4+(-px*rs+py*rc), 16-push);
    camera.lookAt(lx*rc+ly*rs, 7.4+(-lx*rs+ly*rc), -60);

addEventListener("resize", resize); resize();
window.HALL={ accent:setAccent, travel(){ if(!still){ tripStart=clock.getElapsedTime(); } }, roll(on){ const tgt=on?Math.PI:0; if(Math.abs(tgt-rollT)<1e-6) return; rollT=tgt; if(still){ rollC=rollT; dirty=true; frame(); } else { rollF=rollC; rollStart=clock.getElapsedTime(); } }, force(n){ if(forcedMood===n) return; forcedMood=n; applyMood(n||current()); dirty=true; if(still) frame(); }, focus(){ focusT=window.hallFocus?hallFocus():.4; if(still){ focusC=focusT; applyFocus(); dirty=true; frame(); } else { focusF=focusC; focusStart=clock.getElapsedTime(); } } };
