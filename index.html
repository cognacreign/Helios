<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helios 人物</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Noto+Sans+SC:wght@300;400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ece2d5; --ink:#3a322a; --dim:#7a6c5c; --line:rgba(58,50,42,.5); --faint:rgba(58,50,42,.18);
    --panel:rgba(250,244,234,.6); --chip:rgba(255,250,242,.5); --frame:rgba(58,50,42,.55);
    --wide:"Helvetica Neue", "Inter", Arial, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
    --sans:"Noto Sans SC", "PingFang SC", sans-serif;
    --serif:"Noto Serif SC", "Songti SC", serif;
    /* every column shares one top line and one bottom line */
    --sat:.82; --veil:radial-gradient(110% 90% at 10% -10%, rgba(240,246,196,.3), rgba(240,246,196,0) 60%); --veil-blend:screen;
    --fig-amb:none; --fig-key:none;   /* by day the painting keeps its own colour */
    --edge:4vw; --top:5rem; --bot:1.375rem; --nameW:21vw; --A:.5037; --pad:1.375rem; --r:1.625rem;   /* one corner radius for the frame and the readout */   /* --A: width/height of the painting */
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#231e1b; --ink:#efe5d5; --dim:#b3a48f; --line:rgba(239,229,213,.5); --faint:rgba(239,229,213,.17);
      --panel:rgba(30,25,21,.58); --chip:rgba(30,24,20,.45); --frame:rgba(239,229,213,.55); color-scheme:dark;
      --bg:#5f5348; --sat:1; --veil:radial-gradient(90% 80% at 50% 46%, rgba(95,83,72,0) 45%, rgba(55,51,36,.35) 100%); --veil-blend:multiply;
      --fig-amb:linear-gradient(100deg, #f2d9c2 0%, #c9b3a2 55%, #9c8a7e 100%); --fig-key:linear-gradient(100deg, rgba(229,135,83,.7) 0%, rgba(229,135,83,.18) 45%, rgba(229,135,83,0) 75%);
    }
  }
  :root[data-theme="dark"]{
    --bg:#231e1b; --ink:#efe5d5; --dim:#b3a48f; --line:rgba(239,229,213,.5); --faint:rgba(239,229,213,.17);
    --panel:rgba(30,25,21,.58); --chip:rgba(30,24,20,.45); --frame:rgba(239,229,213,.55); color-scheme:dark;
      --bg:#5f5348; --sat:1; --veil:radial-gradient(90% 80% at 50% 46%, rgba(95,83,72,0) 45%, rgba(55,51,36,.35) 100%); --veil-blend:multiply;
      --fig-amb:linear-gradient(100deg, #f2d9c2 0%, #c9b3a2 55%, #9c8a7e 100%); --fig-key:linear-gradient(100deg, rgba(229,135,83,.7) 0%, rgba(229,135,83,.18) 45%, rgba(229,135,83,0) 75%);
  }
  /* everything is sized in rem, and rem follows the window, so the page keeps its proportions on any screen */
  html{ font-size:clamp(12px, min(1.1111vw, 1.7778vh), 26px) }
  @media (max-width: 1000px){ html{ font-size:16px } }
  *{ box-sizing:border-box }
  html,body{ margin:0; height:100% }
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); overflow:hidden; -webkit-font-smoothing:antialiased }
  button{ font:inherit }

  /* ---------- the lit hall behind everything ---------- */
  #c{ position:fixed; inset:0; width:100%; height:100%; display:block; z-index:0; filter:saturate(var(--sat)) }
  .veil{ position:fixed; inset:0; z-index:1; pointer-events:none; background:var(--veil); mix-blend-mode:var(--veil-blend) }
  .grain{ position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.22; mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
  .wash{ position:fixed; inset:0; z-index:1; pointer-events:none; background:var(--bg); opacity:0; transition:opacity .45s ease }
  .wash.on{ opacity:1 }

  .topbar{ position:fixed; z-index:4; left:4vw; right:4vw; top:1.375rem; display:flex; align-items:center; gap:1.375rem }
  .mark{ font-family:var(--wide); font-weight:400; letter-spacing:.34em; font-size:0.875rem }
  .topbar .rule{ flex:1 }
  .count{ font-family:var(--mono); font-size:0.6875rem; letter-spacing:.12em; color:var(--dim) }
  .mode{
    all:unset; cursor:pointer; width:2.125rem; height:2.125rem; display:grid; place-items:center; border-radius:50%;
    background:var(--chip); color:var(--ink); -webkit-backdrop-filter:blur(0.375rem); backdrop-filter:blur(0.375rem);
  }
  .mode:focus-visible{ outline:1px solid var(--ink); outline-offset:0.1875rem }


  /* ---------- bottom-left: the name, then the switch ---------- */
  /* the full name stays just inside the frame's bottom line; the switch drops to the page's bottom inset */
  .nav{ display:flex; align-items:center; gap:0.875rem; margin-top:1.625rem; pointer-events:auto }
  .nav button{ all:unset; cursor:pointer; color:var(--ink); display:grid; place-items:center; width:2rem; height:1.375rem }
  .nav button svg{ width:1.75rem; height:0.9375rem }
  .nav button:focus-visible{ outline:1px solid var(--ink); outline-offset:0.1875rem }
  .nav .dots{ display:flex; gap:0.625rem }
  .nav .dots button{ width:auto; height:auto; font-family:var(--mono); font-size:0.6562rem; letter-spacing:.12em; color:var(--dim); padding:0.25rem 0; border-bottom:1px solid transparent; white-space:nowrap }
  .nav .dots button[aria-current="true"]{ color:var(--ink); border-bottom-color:var(--ink) }

  .plate{ position:fixed; z-index:3; left:var(--edge); bottom:var(--bot); width:var(--nameW); pointer-events:none }
  .plate .who{
    font-family:var(--wide); font-weight:200; text-transform:uppercase; white-space:nowrap;
    font-size:min(4.6vw, 4.75rem); line-height:.9; letter-spacing:.08em; margin:0 0 0 -.04em;
  }
  .plate .full{ margin-top:0.875rem; display:flex; align-items:center; gap:0.75rem; font-family:var(--mono); font-size:0.6875rem; letter-spacing:.14em; color:var(--dim) }
  .plate .full::before{ content:""; width:2.25rem; height:1px; background:var(--line) }

  /* ---------- B: the painting, framed, snug ---------- */
  .frame{
    position:fixed; z-index:2; top:var(--top); bottom:var(--bot); left:calc(var(--edge) + var(--nameW) + 1.6vw);
    width:calc((100vh - var(--top) - var(--bot) - 2 * var(--pad)) * var(--A) + 2 * var(--pad));
    touch-action:pan-y; user-select:none;
  }
  .figure{
    position:absolute; left:50%; top:50%; height:calc((100% - 2 * var(--pad)) * var(--hs, 1)); aspect-ratio:var(--ar, 814/1616);
    transform:translate(-50%,-50%); transition:opacity .5s ease, transform .7s cubic-bezier(.2,.7,.2,1);
  }
  /* the frame is painted: a 0.1875rem stroke with ragged edges and dry, broken patches */
  .brush{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none; color:var(--ink); opacity:.72 }
  .brush path{ fill:none; stroke:currentColor; stroke-width:3; stroke-linejoin:round }
  .figure .lit{ position:absolute; inset:0; pointer-events:none; -webkit-mask-size:100% 100%; mask-size:100% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat }
  .figure .amb{ background:var(--fig-amb); mix-blend-mode:multiply }
  .figure .key{ background:var(--fig-key); mix-blend-mode:soft-light }
  .figure img{ width:100%; height:100%; display:block; pointer-events:none;
    filter:drop-shadow(0 0 .6px rgba(40,30,20,.3)) drop-shadow(0 0.875rem 1.625rem rgba(40,28,18,.16)) }
  /* behind the Sun King: the loading page's sun, centred on her eye */
  .figure img{ position:relative; z-index:1 }
  .figure .lit{ z-index:2 }
  .figure .sundial{ position:absolute; z-index:0; width:165%; height:auto; aspect-ratio:1; transform:translate(-50%,-50%); pointer-events:none;
    color:#9b7646; opacity:0; transition:opacity 1.2s ease }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .figure .sundial{ color:#e4a96d } }
  :root[data-theme="dark"] .figure .sundial{ color:#e4a96d }
  .figure.sun .sundial{ opacity:.8 }
  .figure .sundial .ld-t{ animation:ldspin 150s linear infinite }
  .figure .sundial .sun-creed{ fill:currentColor; stroke:none; font-family:var(--serif); font-size:4.3px; letter-spacing:.3em }
  @media (prefers-reduced-motion: reduce){ .figure .sundial .ld-t{ animation:none } }
  .figure.out-l{ opacity:0; transform:translate(-62%,-50%) }
  .figure.out-r{ opacity:0; transform:translate(-38%,-50%) }
  /* changing clothes: a short sideways slide */
  .figure.swap-out{ opacity:0; transform:translate(-56%,-50%); transition:opacity .28s ease, transform .3s ease-in }
  .figure.swap-in{ opacity:0; transform:translate(-44%,-50%) }

  /* ---------- C: the readout, same height as the frame ---------- */
  .readout{
    position:fixed; z-index:3; right:4vw; top:var(--top); max-height:calc(100vh - var(--top) - var(--bot) - 14.7rem - 1.1rem); width:clamp(22.5rem, 33vw, 25rem);
    display:flex; flex-direction:column; padding:1.125rem 1.375rem 0;
    border:1px solid var(--line); border-radius:var(--r);
    background:var(--panel); -webkit-backdrop-filter:blur(0.625rem) saturate(.9); backdrop-filter:blur(0.625rem) saturate(.9);
    transition:opacity .4s ease;
  }
  .readout.fade .in{ opacity:0 }
  .readout .in{ display:flex; flex-direction:column; min-height:0; flex:0 1 auto; transition:opacity .35s ease }
  .readout::before, .readout::after{ content:""; position:absolute; width:1.375rem; height:1.375rem; border:1px solid var(--ink); pointer-events:none }
  .readout::before{ left:-0.375rem; top:-0.375rem; border-right:0; border-bottom:0; border-top-left-radius:calc(var(--r) + 0.375rem) }
  .readout::after{ right:-0.375rem; bottom:-0.375rem; border-left:0; border-top:0; border-bottom-right-radius:calc(var(--r) + 0.375rem) }

  .tabs{ display:flex; gap:1.375rem; border-bottom:1px solid var(--faint) }
  .tabs button{
    all:unset; cursor:pointer; padding:0 0 0.625rem; margin-bottom:-1px; color:var(--dim);
    font-family:var(--wide); text-transform:uppercase; font-size:0.5938rem; letter-spacing:.26em;
    border-bottom:1px solid transparent;
  }
  .tabs button small{ font-family:var(--sans); letter-spacing:.08em; margin-left:0.375rem; font-size:0.6562rem }
  .tabs button[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--ink) }
  .tabs button:focus-visible, .chips button:focus-visible, .pager button:focus-visible, .go:focus-visible{ outline:1px solid var(--ink); outline-offset:0.1875rem }

  .chips{ display:flex; flex-wrap:wrap; gap:0.375rem; margin:0.875rem 0 0.125rem }
  .chips button{
    all:unset; cursor:pointer; padding:0.125rem 0.625rem; border:1px solid var(--faint); border-radius:999px;
    font-size:0.6875rem; letter-spacing:.12em; color:var(--dim);
  }
  .chips button[aria-pressed="true"]{ border-color:var(--ink); color:var(--ink) }

  .body{ flex:0 1 auto; min-height:0; overflow-y:auto; overflow-x:hidden; padding:1.125rem 0 0 0; scrollbar-width:thin; scrollbar-color:var(--faint) transparent }
  .rows{ margin:0 0 0 0.1875rem; padding:0 0 0 1.125rem; border-left:1px solid var(--faint); list-style:none }
  .rows li{ position:relative; margin:0 0 0.625rem; font-size:0.75rem; font-weight:300; line-height:1.8 }
  .rows li::before{ content:""; position:absolute; left:-1.125rem; top:.9em; width:0.75rem; height:1px; background:var(--line) }
  .rows li::after{ content:""; position:absolute; left:-0.5rem; top:calc(.9em - 0.1875rem); border:0.1875rem solid transparent; border-left:0.3125rem solid var(--line) }
  .rows b{ display:block; font-family:var(--mono); font-weight:400; font-size:0.5938rem; letter-spacing:.08em; color:var(--dim); margin-bottom:1px }
  .go{ all:unset; cursor:pointer; border-bottom:1px solid var(--line); color:var(--ink) }

  /* 资料: one left edge, one rhythm (1.5rem between blocks), nothing stretched */
  .sheet{ padding:0.25rem 0 1.25rem }
  .sheet > div + div{ margin-top:1.5rem }
  .sheet .role{ margin:0; font-size:1.0625rem; line-height:1.4; font-weight:300; letter-spacing:.02em; white-space:nowrap }
  .sheet .role i{ font-style:normal; color:var(--dim); margin:0 .35em }
  .sheet .place{ margin:0.375rem 0 0; font-size:0.75rem; line-height:1.6; color:var(--dim); font-weight:300 }
  .sheet .stats{ font-size:0.875rem; line-height:1.6; font-weight:300; letter-spacing:.02em }
  .sheet .stats span{ white-space:nowrap }
  .sheet .stats span + span{ margin-left:0.75rem }
  .sheet .stats em{ font-style:normal; color:var(--dim); margin:0 0.875rem }
  .sheet h3{ margin:0 0 0.5rem; font-family:var(--mono); font-weight:400; font-size:0.5938rem; line-height:1; letter-spacing:.18em; color:var(--dim) }
  .sheet p{ margin:0; font-size:0.7812rem; line-height:1.8; font-weight:300 }
  .sheet ol{ list-style:none; margin:0; padding:0 }
  .sheet ol li{ display:grid; grid-template-columns:1.5rem 1fr; font-size:0.7812rem; line-height:1.8; font-weight:300 }
  .sheet ol b{ font-family:var(--mono); font-weight:400; font-size:0.625rem; color:var(--dim); line-height:2.25 }
  .sheet .likes{ font-size:0.7812rem; line-height:1.8; font-weight:300 }
  .sheet .likes span{ white-space:nowrap }
  .sheet .likes i{ font-style:normal; color:var(--dim); margin:0 .45em }

  /* 故事: two plain two-column lists. Names, then ages, in the left column */
  .tale{ padding:0 0 0.625rem }
  .tale h3{ margin:0 0 0.5rem; font-family:var(--mono); font-weight:400; font-size:0.5938rem; line-height:1; letter-spacing:.18em; color:var(--dim) }
  .tale dl{ display:grid; gap:0.125rem 0.75rem; margin:0 0 0.875rem; font-size:0.75rem; line-height:1.6; font-weight:300 }
  .tale dl:last-child{ margin-bottom:0 }
  .tale .rel{ grid-template-columns:3.625rem 1fr }
  .tale dt{ font-family:var(--wide); font-weight:400; letter-spacing:.04em }
  /* the timeline: ages stand where the nodes were, a thin line runs between them */
  .tl{ list-style:none; margin:0; padding:0; font-size:0.75rem; line-height:1.6; font-weight:300 }
  .tl li{ position:relative; padding:0 0 0.3125rem 2.125rem }
  .tl li:last-child{ padding-bottom:0 }
  .tl b{ position:absolute; left:0; top:0; width:1.375rem; text-align:center; font-family:var(--wide); font-weight:400; font-size:0.6875rem; line-height:1.1875rem; letter-spacing:.02em }
  .tl li:not(:last-child)::after{ content:""; position:absolute; left:0.6875rem; top:1.25rem; bottom:1px; width:1px; background:var(--line) }
  .tale dd{ margin:0 }
  /* 秘闻: short headings, then the note; hidden spans stay black until you look */
  .tale .secrets{ display:block }
  .tale .secrets dt{ margin-top:0.75rem; font-family:var(--sans); font-size:0.6875rem; letter-spacing:.06em; color:var(--dim) }
  .tale .secrets dt:first-child{ margin-top:0 }
  .tale .secrets dd{ margin:0.25rem 0 0; line-height:1.85 }
  .spoil{ background:var(--ink); color:transparent; border-radius:0.1875rem; padding:0.0625rem 0.125rem; cursor:help;
    -webkit-box-decoration-break:clone; box-decoration-break:clone; transition:background .3s ease, color .3s ease; outline:none }
  .spoil::selection{ color:transparent }
  /* 秘闻 that go on: a quiet link after the note */
  .more{ all:unset; cursor:pointer; margin-left:.35em; font-family:var(--mono); font-size:.58rem; letter-spacing:.14em; color:var(--dim); white-space:nowrap; border-bottom:1px dotted var(--dim) }
  .more::after{ content:" →" }
  .more{ transition:opacity .4s ease .15s }
  dd.sealed .more{ opacity:0; pointer-events:none; visibility:hidden }
  .more:hover{ color:var(--ink); border-bottom-color:var(--ink) }
  .more:focus-visible{ outline:1px solid var(--ink); outline-offset:.15rem }
  .spoil:hover, .spoil:focus-visible, .spoil.open{ background:var(--faint); color:var(--ink) }

  .story{ display:flex; flex-direction:column; flex:1; min-height:0; padding-top:1rem }
  .page{ flex:1; min-height:0; overflow:auto; scrollbar-width:thin; scrollbar-color:var(--faint) transparent; padding-right:0.375rem }
  .page .num{ font-family:var(--wide); font-weight:200; font-size:1.25rem; letter-spacing:.1em; color:var(--dim); margin:0 0 0.625rem }
  .page p{ margin:0; font-family:var(--serif); font-size:0.7812rem; line-height:2; text-align:justify; animation:in .5s ease }
  @keyframes in{ from{ opacity:0; transform:translateX(0.875rem) } to{ opacity:1; transform:none } }
  .pager{ display:flex; align-items:center; justify-content:space-between; padding:0.75rem 0 1rem; border-top:1px solid var(--faint); margin-top:0.75rem }
  .pager button{ all:unset; cursor:pointer; width:2.25rem; height:1.375rem; display:grid; place-items:center; color:var(--ink) }
  .pager button:disabled{ opacity:.25; cursor:default }
  .pager button svg{ width:1.75rem; height:0.9375rem }
  .pager span{ font-family:var(--mono); font-size:0.625rem; letter-spacing:.14em; color:var(--dim) }

  /* ---------- 词条: a card over the readout's place ---------- */
  .term{ all:unset; cursor:pointer; border-bottom:1px dotted var(--ink); }
  .term:hover{ border-bottom-style:solid }
  .term:focus-visible{ outline:1px solid var(--ink); outline-offset:0.125rem }
  .entry .head{ position:relative; padding-right:2.125rem }
  .entry .tag{ font-family:var(--mono); font-size:0.5938rem; letter-spacing:.18em; color:var(--dim) }
  .entry h2{ margin:0.4375rem 0 0; font-size:1.1875rem; font-weight:300; letter-spacing:.04em }
  .entry .close{ all:unset; cursor:pointer; position:absolute; right:-0.375rem; top:-0.25rem; width:1.75rem; height:1.75rem; display:grid; place-items:center; color:var(--ink) }
  .entry .close:focus-visible{ outline:1px solid var(--ink); outline-offset:0.125rem }
  .entry .ebody{ flex:0 1 auto; min-height:0; overflow-y:auto; margin-top:0.75rem; padding:0.75rem 0.25rem 1.125rem 0; border-top:1px solid var(--faint); scrollbar-width:thin; scrollbar-color:var(--faint) transparent }
  .entry .ebody p{ margin:0 0 .8em; font-size:0.7812rem; line-height:1.85; font-weight:300; text-align:justify }
  .entry .ebody h3{ margin:1.125rem 0 0.5rem; font-family:var(--mono); font-weight:400; font-size:0.5938rem; letter-spacing:.18em; color:var(--dim) }
  .entry .ebody .desc{ font-style:italic; color:var(--dim); margin-bottom:1.1em }
  .entry .ebody.scene p:not(.desc){ font-family:var(--serif); font-size:0.75rem; line-height:1.78; margin-bottom:.4em }
  .entry .ebody p:last-child{ margin-bottom:0 }
  .entry .ebody blockquote{ margin:.2em 0 .9em; padding:.1em 0 .1em .9em; border-left:1px solid var(--line); font-family:var(--serif); font-size:0.75rem; line-height:1.78; font-style:italic }
  .entry .ebody p.gap{ text-align:center; color:var(--dim); letter-spacing:.3em; margin:.6em 0 1em }
  .readout .in.entry{ animation:entryIn .35s cubic-bezier(.2,.7,.2,1) }
  @keyframes entryIn{ from{ opacity:0; transform:translateX(0.625rem) } to{ opacity:1; transform:none } }

  /* the readout folds away when you click into the hall */
  .readout{ transition:opacity .45s ease, transform .55s cubic-bezier(.2,.7,.2,1) }
  body.bare .readout{ opacity:0; transform:translateX(1.75rem); pointer-events:none }
  .frame:focus:not(:focus-visible), .slot:focus:not(:focus-visible){ outline:none }
  .frame{ cursor:pointer; transform:translateX(var(--shift,0px)); transition:transform .8s cubic-bezier(.33,1,.68,1) }

  /* ---------- stickers: die-cut, draggable, they stay where you leave them ---------- */
  .sticker{ all:unset; box-sizing:border-box; position:fixed; z-index:5; width:2.875rem; cursor:grab; touch-action:none; user-select:none;
    --s:1; --rot:-8deg; filter:drop-shadow(0 0.375rem 0.625rem rgba(30,20,12,.28));
    transform:rotate(var(--rot)) scale(var(--s)); transition:transform .2s ease }
  .sticker[hidden]{ display:none }
  .readout .in.swap .sheet, .readout .in.swap .tale{ animation:swapIn .5s ease }
  @keyframes swapIn{ from{ opacity:0; transform:translateY(.3rem) } }
  #deer, #deer2{ width:3.6rem }
  #rope{ width:3.4rem }
  #ydress{ width:3.3rem }
  /* the yellow dress gets you slapped: the whole page takes the hit */
  html.slap body{ animation:slap .75s cubic-bezier(.15,.8,.3,1) }
  @keyframes slap{ 0%{ transform:none } 7%{ transform:translate(-4.4rem,.7rem) rotate(-2.6deg) scale(1.015) }
    19%{ transform:translate(3rem,-.35rem) rotate(1.7deg) } 31%{ transform:translate(-2rem,.25rem) rotate(-1deg) }
    45%{ transform:translate(1.2rem,-.1rem) rotate(.6deg) } 60%{ transform:translate(-.6rem,0) rotate(-.25deg) }
    76%{ transform:translate(.25rem,0) } 100%{ transform:none } }
  /* the rope falls in from above and swings itself still */
  .sticker.drop{ transform-origin:50% 0; animation:ropeDrop 1.6s cubic-bezier(.3,.7,.4,1) }
  @keyframes ropeDrop{
    0%{ transform:translateY(-70vh) rotate(var(--rot)) scale(var(--s)) }
    38%{ transform:translateY(.6rem) rotate(calc(var(--rot) + 14deg)) scale(var(--s)) }
    55%{ transform:translateY(0) rotate(calc(var(--rot) - 9deg)) scale(var(--s)) }
    72%{ transform:rotate(calc(var(--rot) + 5deg)) scale(var(--s)) }

<script>
/* draw the sun: an outer dial, sixteen straight rays between sixteen flames, an inner ring, the ☉ at the heart */

  const s=STORY[sheetOver[p.id] || p.id]; if(!s) return "";
  return `<div class="tale">${s.sections.map(sec=>`<h3>${sec.h}</h3>${
    sec.kind==="rel" ? `<dl class="rel">${sec.items.map(([n,t,go])=>`<dt>${go?`<button class="go" data-go="${go}">${n}</button>`:n}</dt><dd>${spoil(t)}</dd>`).join("")}</dl>`
    : sec.kind==="tl" ? `<ul class="tl">${sec.items.map(([a,t])=>`<li><b>${a.replace(" 岁","")}</b>${spoil(t)}</li>`).join("")}</ul>`
    : sec.kind==="secrets" ? `<dl class="secrets">${sec.items.map(([h,t,more])=>`<dt>${h}</dt><dd${more && /【/.test(t) && !seenMore.has(more) ? ` class="sealed" data-more="${more}"` : ""}>${spoil(t)}${more?` <button class="more" type="button" data-term="${more}">阅读更多</button>`:""}</dd>`).join("")}</dl>`
    : sec.items.map(t=>`<p>${spoil(t)}</p>`).join("")}`).join("")}</div>`;
}
function fitRole(){
  const r=readin.querySelector(".role"); if(!r) return;
  r.style.fontSize=""; let s=parseFloat(getComputedStyle(r).fontSize);
  while(r.scrollWidth>r.clientWidth+1 && s>14){ s-=.5; r.style.fontSize=s+"px"; }
}
let view=null;   /* null: the person's own pages; otherwise the key of an open entry */
function renderReadout(){
  const p=PEOPLE[cur];
  readin.classList.toggle("entry", !!view);
  if(!contentReady){ readin.innerHTML=""; return; }
  if(view){ readin.innerHTML=entryHTML(view); return; }
  readin.innerHTML = `
    <div class="tabs" role="tablist">
      <button role="tab" aria-selected="${tab===0}" data-tab="0">Profile<small>资料</small></button>
      <button role="tab" aria-selected="${tab===1}" data-tab="1">${(STORY[sheetOver[p.id]]||{}).label==="秘闻" ? "Secrets<small>秘闻</small>" : "Story<small>故事</small>"}</button>
    </div>
    ${tab===0 ? `
      <div class="body">${sheetHTML(p)}</div>`
    : `
      <div class="body">${storyHTML(p)}</div>`}`;
  fitRole();
}
/* one size for every name: the longest one decides, so the names never jump in size */
function fitName(){
  const el=$("#who"), keep=el.textContent;
  const longest=PEOPLE.reduce((a,p)=>p.name.length>a.length?p.name:a,"");
  el.style.fontSize=""; el.textContent=longest;
  let s=parseFloat(getComputedStyle(el).fontSize);
  while(el.scrollWidth>el.clientWidth+1 && s>18){ s-=1; el.style.fontSize=s+"px"; }
  el.textContent=keep;
}
function renderPlate(){
  const p=PEOPLE[cur];
  $("#who").textContent=p.name; $("#full").textContent=p.full; fitName();
  art.src=p.img; art.alt=`${p.full}，作者绘`;
  figure.querySelectorAll('.lit').forEach(el=>{ el.style.webkitMaskImage=el.style.maskImage=`url(${p.img})`; });
  /* same scale for both; each centred in the frame */
  figure.style.setProperty('--ar', `${p.fig[0]}/${p.fig[1]}`); figure.style.setProperty('--hs', p.fig[1]/1616);
  $("#count").textContent=`${pad(cur+1)} / ${pad(PEOPLE.length)}`;
  document.querySelectorAll("#dots button").forEach((b,i)=>b.setAttribute("aria-current", i===cur));
  if(window.HALL) HALL.accent(p.accent);
  if(window.syncStickers) syncStickers();
  if(window.renderSkins) renderSkins();
  try{ history.replaceState(null,"","#"+p.id) }catch(e){}
}

function show(i, dir){
  const n=PEOPLE.length; i=(i+n)%n;
  if(i===cur || busy) return;
  if(dir===undefined) dir = i>cur ? 1 : -1;
  cur=i; group=0; page=0;
  view=null;
  if(reduce){ renderPlate(); renderReadout(); return; }
  busy=true;
  if(window.HALL) HALL.travel();
  figure.classList.add(dir>0?"out-l":"out-r"); readout.classList.add("fade");
  setTimeout(()=>wash.classList.add("on"), 520);
  setTimeout(()=>{
    renderPlate(); renderReadout();
    figure.style.transition="none"; figure.classList.remove("out-l","out-r"); figure.classList.add(dir>0?"out-r":"out-l");
    void figure.offsetWidth; figure.style.transition="";
  }, 600);
  setTimeout(()=>{ wash.classList.remove("on"); figure.classList.remove("out-l","out-r"); readout.classList.remove("fade"); busy=false; }, 1180);
}

document.addEventListener("click",e=>{
  const go=e.target.closest("[data-go]"); if(go){ show(PEOPLE.findIndex(p=>p.id===go.dataset.go)); return; }
  const d=e.target.closest("#dots [data-i]"); if(d){ show(+d.dataset.i); return; }
  const t=e.target.closest("[data-tab]"); if(t){ tab=+t.dataset.tab; renderReadout(); readin.querySelector(`[data-tab="${tab}"]`).focus(); return; }
  const g=e.target.closest("[data-group]"); if(g){ group=+g.dataset.group; renderReadout(); readin.querySelector(`[data-group="${group}"]`).focus(); return; }
  const pg=e.target.closest("[data-page]"); if(pg){ page=Math.max(0,Math.min(PEOPLE[cur].story.length-1, page+ +pg.dataset.page)); renderReadout();
    const b=readin.querySelector(`[data-page="${pg.dataset.page}"]`); (b&&!b.disabled?b:readin.querySelector("[data-page]:not([disabled])")).focus(); }
});
$("#prev").addEventListener("click",()=>show(cur-1,-1));
$("#next").addEventListener("click",()=>show(cur+1,1));
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight") show(cur+1,1);
  if(e.key==="ArrowLeft") show(cur-1,-1);
});
/* swipe sideways: on the painting to change person, on the story to turn the page */
function swipe(el, fn){
  let sx=null, sy=null;
  el.addEventListener("pointerdown",e=>{ sx=e.clientX; sy=e.clientY; });
  el.addEventListener("pointerup",e=>{
    if(sx===null) return; const dx=e.clientX-sx, dy=e.clientY-sy; sx=null;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.3) fn(dx<0?1:-1);
  });
}
swipe($("#stage"), d=>show(cur+d,d));
swipe(readout, d=>{ if(tab!==1) return; const np=page+d; if(np<0||np>=PEOPLE[cur].story.length) return; page=np; renderReadout(); });
addEventListener("resize", ()=>{ fitName(); fitRole(); });

window.hallFocus = ()=>{ if(document.body.classList.contains("bare")) return .5; const st=$("#stage"), f=(st.offsetLeft+st.offsetWidth/2)/innerWidth; return f; };

/* the frame: a rounded rectangle, the same radius as the readout */
function drawFrame(){
  const st=$("#stage"), w=st.clientWidth, h=st.clientHeight, i=1.5;
  if(!w||!h) return;
  const r=parseFloat(getComputedStyle(readout).borderTopLeftRadius)||26;
  $("#framePath").setAttribute("d",
    `M${i+r} ${i} L${w-i-r} ${i} A${r} ${r} 0 0 1 ${w-i} ${i+r} L${w-i} ${h-i-r} A${r} ${r} 0 0 1 ${w-i-r} ${h-i} `+
    `L${i+r} ${h-i} A${r} ${r} 0 0 1 ${i} ${h-i-r} L${i} ${i+r} A${r} ${r} 0 0 1 ${i+r} ${i} Z`);
}
addEventListener("resize", drawFrame);

}
function closeEntry(){ if(!view) return; view=null; renderReadout(); if(lastFocus && document.contains(lastFocus)) lastFocus.focus(); }

/* ---------- the readout folds away when you click into the hall ---------- */
function centreShift(){
  const st=$("#stage");
  if(innerWidth<=1000) return 0;
  return innerWidth/2-(st.offsetLeft+st.offsetWidth/2);
}
function setShift(){ const st=$("#stage"), bare=document.body.classList.contains("bare");
  const dx=bare?centreShift():0; st.style.setProperty("--shift", dx+"px"); }

function showPanel(){ if(document.body.classList.contains("bare")){ document.body.classList.remove("bare"); setShift(); if(window.HALL) HALL.focus(); } }
function hidePanel(){ if(!document.body.classList.contains("bare")){ document.body.classList.add("bare"); view=null; renderReadout(); setShift(); if(window.HALL) HALL.focus(); } }
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-term]"); if(t){ e.stopPropagation(); openEntry(t.dataset.term); return; }
  if(e.target.closest("[data-close]")){ e.stopPropagation(); closeEntry(); return; }

  if(!e.target.closest("#readout, .plate, .topbar, .sticker, .inv, button, a")) hidePanel();

function placeSay(){ const st=$("#stage"), r=st.getBoundingClientRect(), dx=parseFloat(st.style.getPropertyValue("--shift"))||0;

function speak(id, kind, x, y){

function sayLine(t, owner){
  const who=PEOPLE.find(p=>p.id===owner).name.toUpperCase();

function rng(seed){ return ()=>{ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* dusk is painted in strokes: broad flat loads of paint laid side by side,
   each a shade off its neighbour, with dry, split ends and a few drag lines
   inside. Tileable, so the strokes wrap across the edges. */
function strokeCanvas({seed, size=512, base=220, spread=11, dir="v", wMin=24, wMax=72, lMin=160, lMax=460}){
  const c=document.createElement("canvas"); c.width=c.height=size; const x=c.getContext("2d"), r=rng(seed);
  x.fillStyle=`rgb(${base},${base},${base})`; x.fillRect(0,0,size,size);
  const val=s=>Math.max(0,Math.min(255, base+(r()-.5)*2*s|0));
  const make=(cx,cy,w,l,v,a,ang)=>{                     /* every random number fixed up front, so wrapped copies match */
    const n=5+(r()*6|0), tail=[], head=[], drag=[];
    for(let k=0;k<n;k++){ tail.push([l*(.04+r()*.24), .55+r()*.5]); head.push(r()*l*.06); }

    return {cx,cy,w,l,v,a,ang,n,tail,head,drag};
  };
  const draw=S=>{
    for(const ox of [-size,0,size]) for(const oy of [-size,0,size]){
      const X=S.cx+ox, Y=S.cy+oy, reach=S.l*.7;
      if(X<-reach||X>size+reach||Y<-reach||Y>size+reach) continue;
      x.save(); x.translate(X,Y); x.rotate(S.ang);
      x.fillStyle=`rgba(${S.v},${S.v},${S.v},${S.a})`;
      const bw=S.w/S.n;
      x.fillRect(-S.l/2+S.l*.04, -S.w/2, S.l*.82, S.w);                    /* the load of paint */
      for(let k=0;k<S.n;k++){
        x.fillRect(S.l*.36, -S.w/2+k*bw, S.tail[k][0], bw*S.tail[k][1]);     /* dry, split tail */
        x.fillRect(-S.l/2+S.l*.04-S.head[k], -S.w/2+k*bw, S.l*.05, bw*.92);  /* ragged start */
      }
      S.drag.forEach(([dv,da,pos,len,th])=>{ x.fillStyle=`rgba(${dv},${dv},${dv},${da})`; x.fillRect(-S.l/2, -S.w/2+pos*S.w, S.l*len, th); });
      x.restore();
    }
  };
  const along = dir==="v" ? Math.PI/2 : 0;
  /* first coat: columns of strokes edge to edge, staggered */
  for(let u=0; u<size; ){
    const w=wMin+r()*(wMax-wMin);
    for(let t=-r()*lMax; t<size; ){
      const l=lMin+r()*(lMax-lMin), cu=u+w/2, ct=t+l/2;
      draw(make(dir==="v"?cu:ct, dir==="v"?ct:cu, w*1.08, l, val(spread), .72+r()*.26, along+(r()-.5)*.07));
      t+=l*(.7+r()*.25);
    }
    u+=w*(.78+r()*.2);
  }
  /* second coat: sparse strokes laid over */
  for(let i=0;i<46;i++){
    const w=wMin*.8+r()*(wMax-wMin)*.8, l=lMin*.6+r()*(lMax-lMin)*.6;
    draw(make(r()*size, r()*size, w, l, val(spread*1.2), .3+r()*.35, along+(r()-.5)*.12));
  }
  return c;
}

const MAPS={};
function twoMaps(name, rx, ry, bump, dusk){

/* matte for dusk (no sheen on the plaster), and light that breaks along the strokes:
   the stroke values nudge where each fragment reads the sunset's shadow map */
const PAINT={ uSpec:{value:1}, uJitter:{value:0} };
function paintify(mat, matte, jit){
  mat.onBeforeCompile=sh=>{
    sh.uniforms.uSpec = matte ? PAINT.uSpec : {value:1}; sh.uniforms.uJitter = jit ? PAINT.uJitter : {value:0};
    sh.fragmentShader = "uniform float uSpec;\nuniform float uJitter;\n" + sh.fragmentShader
      .replace("#include <map_fragment>", "#include <map_fragment>\nvec2 strokeJit = vec2(0.0);\n#ifdef USE_MAP\nstrokeJit = vec2( texelColor.r - 0.7, mapTexelToLinear( texture2D( map, vUv * 1.37 + vec2( .31, .17 ) ) ).r - 0.7 ) * uJitter;\n#endif")
      .replace("#include <lights_physical_fragment>", "#include <lights_physical_fragment>\nmaterial.specularColor *= uSpec;")
      .replace("#include <lights_fragment_begin>", THREE.ShaderChunk.lights_fragment_begin.split("vSpotShadowCoord[ i ] )").join("vSpotShadowCoord[ i ] + vec4( strokeJit * vSpotShadowCoord[ i ].w, 0.0, 0.0 ) )"));
  };
  return mat;
}

const BAY=14, N=6, OW=12, SPR=12, R=OW/2;
const WALL_W=44, WALL_H=27, WALL_D=3, COLS_PER_BAY=4;

function portalGeo(){
  const s=new THREE.Shape();
  s.moveTo(-WALL_W/2,0); s.lineTo(WALL_W/2,0); s.lineTo(WALL_W/2,WALL_H); s.lineTo(-WALL_W/2,WALL_H); s.lineTo(-WALL_W/2,0);
  const h=new THREE.Path();
  h.moveTo(-R,0); h.lineTo(-R,SPR); h.absarc(0,SPR,R,Math.PI,0,true); h.lineTo(R,0); h.lineTo(-R,0);
  s.holes.push(h);

}
function vaultGeo(len){
  const su=48, sv=10, pos=[], uv=[], idx=[];
  for(let v=0;v<=sv;v++) for(let u=0;u<=su;u++){
    const a=Math.PI*u/su; pos.push(Math.cos(a)*R, SPR+Math.sin(a)*R, -len*v/sv); uv.push(u/su, v/sv);
  }
  for(let v=0;v<sv;v++) for(let u=0;u<su;u++){ const a=v*(su+1)+u,b=a+1,c=a+su+1,d=c+1; idx.push(a,c,b,b,c,d); }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv,2));

}
/* a loose Doric column: fluted shaft with a slight swell, cushion capital,

const colCache={};
function columnGeos(H, r0){
  const key=H+"_"+r0; if(colCache[key]) return colCache[key];
  const parts=[], prof=[];
  for(let i=0;i<=24;i++){ const t=i/24; prof.push(new THREE.Vector2(r0*(1-.16*t+.05*Math.sin(Math.PI*t)), t*H)); }
  const shaft=new THREE.LatheGeometry(prof, 80), p=shaft.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i), a=Math.atan2(z,x), k=1-.045*(.5+.5*Math.cos(a*20)); p.setX(i,x*k); p.setZ(i,z*k); }
  shaft.computeVertexNormals(); parts.push(shaft);
  const tor=new THREE.TorusGeometry(r0*1.05, r0*.16, 10, 40); tor.rotateX(Math.PI/2); tor.translate(0,r0*.3,0); parts.push(tor);
  const pl=new THREE.BoxGeometry(r0*2.6, r0*.28, r0*2.6); pl.translate(0,r0*.14,0); parts.push(pl);
  const ech=new THREE.LatheGeometry([new THREE.Vector2(r0*.84,0),new THREE.Vector2(r0,r0*.12),new THREE.Vector2(r0*1.28,r0*.36),new THREE.Vector2(r0*1.36,r0*.5)],40);
  ech.translate(0,H,0); parts.push(ech);
  const ab=new THREE.BoxGeometry(r0*2.9, r0*.34, r0*2.9); ab.translate(0,H+r0*.67,0); parts.push(ab);
  return colCache[key]=parts;
}
function addColumn(g,x,z,H,r0){
  columnGeos(H,r0).forEach(geo=>{ const m=new THREE.Mesh(geo,M.marble); m.position.set(x,0,z); m.castShadow=m.receiveShadow=true; g.add(m); });

function box(g,w,h,d,mat,x,y,z,cast=true){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat); m.position.set(x,y,z); m.castShadow=cast; m.receiveShadow=true; g.add(m); return m; }

const PG=portalGeo(), blockers=[], ribs=[];
function buildHall(g){
  for(let i=0;i<N;i++){
    const z=-i*BAY;
    const w=new THREE.Mesh(PG,M.wall); w.position.set(0,0,z-WALL_D); w.receiveShadow=true; g.add(w); if(g===hall) blockers.push(w);   /* at dusk walls and vault let the light through, so it washes the whole hall */
    const band=new THREE.Mesh(new THREE.TorusGeometry(R+.4,.4,12,56,Math.PI),M.plaster); band.position.set(0,SPR,z+.06); band.castShadow=true; g.add(band); ribs.push(band);
    [-1,1].forEach(sd=> addColumn(g, sd*(R+1.5), z+1.4, SPR-.9, .78));      /* columns framing each doorway */
    [-1,1].forEach(sd=> box(g, 3.2, 1.1, 2.4, M.plaster, sd*(R+1.5), SPR+.55, z+1.4));   /* an entablature block over each, leaving the arch open */
    if(i<N-1){

      const v=new THREE.Mesh(vaultGeo(len),M.vault); v.position.z=z0; v.receiveShadow=true; g.add(v); if(g===hall) blockers.push(v);
      for(let k=1;k<5;k++){ const rb=new THREE.Mesh(new THREE.TorusGeometry(R-.14,.2,8,48,Math.PI),M.rib); rb.position.set(0,SPR,z0-len*k/5); rb.castShadow=true; g.add(rb); ribs.push(rb); }
      for(let k=1;k<8;k++){ const a=Math.PI*k/8; box(g,.32,.32,len,M.rib,Math.cos(a)*(R-.17),SPR+Math.sin(a)*(R-.17),z0-len/2); }
      for(let k=0;k<COLS_PER_BAY;k++) addColumn(g, -R-.6, z0-len*(k+.5)/COLS_PER_BAY, SPR-.9, .55);   /* open colonnade on the left */
      box(g, 2.2, 1.1, len, M.plaster, -R-.6, SPR+.55, z0-len/2);
      { const rw=box(g, 1, SPR+1.1, len, M.wallBox, R+.5, (SPR+1.1)/2, z0-len/2, false); if(g===hall) blockers.push(rw); }   /* solid wall on the right */
      [-1,1].forEach(o=> box(g,.2,5.4,2.4,M.niche,R+.02,4.8,z0-len/2+o*3.4,false));

function waterNormals(seed){
  /* a tileable height field of crossing ripples, turned into a normal map */
  const N=256, c=document.createElement("canvas"); c.width=c.height=N; const x=c.getContext("2d");
  let s=seed; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  const waves=[]; for(let i=0;i<22;i++){ const fx=Math.round((rnd()*2-1)*(2+i*.45)), fy=Math.round((rnd()*2-1)*(2+i*.45))||1;
    waves.push([fx,fy,rnd()*6.283, 1/Math.pow(Math.hypot(fx,fy),1.25)]); }
  const H=new Float32Array(N*N);
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){ let h=0; const u=i/N, v=j/N;
    for(const [fx,fy,ph,a] of waves) h+=a*Math.sin(6.2832*(fx*u+fy*v)+ph);
    H[j*N+i]=h; }
  const img=x.createImageData(N,N), K=1.6;
  for(let j=0;j<N;j++) for(let i=0;i<N;i++){
    const dx=(H[j*N+(i+1)%N]-H[j*N+(i+N-1)%N])*K, dy=(H[((j+1)%N)*N+i]-H[((j+N-1)%N)*N+i])*K;
    const l=Math.hypot(dx,dy,1), o=(j*N+i)*4;
    img.data[o]=(-dx/l*.5+.5)*255; img.data[o+1]=(-dy/l*.5+.5)*255; img.data[o+2]=(1/l*.5+.5)*255; img.data[o+3]=255; }

}
