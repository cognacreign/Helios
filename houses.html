<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Houses</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* layout: the houses hang like medallions on a dusk wall; one readout card on the right, as on the character pages */
  :root{
    --bg:#ece2d5; --ink:#3a322a; --dim:#7a6c5c; --line:rgba(58,50,42,.45); --faint:rgba(58,50,42,.16);
    --panel:rgba(250,244,234,.62); --gold:#94703f; --gold-soft:rgba(148,112,63,.35); --fallen:rgba(58,50,42,.38);
    --wide:"Inter","Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
    --serif:"Noto Serif SC","Songti SC",serif;
    --veil:radial-gradient(110% 90% at 10% -10%, rgba(240,246,196,.35), rgba(240,246,196,0) 60%);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#5f5348; --ink:#efe5d5; --dim:#c2b29c; --line:rgba(239,229,213,.42); --faint:rgba(239,229,213,.15);
    --panel:rgba(38,31,26,.55); --gold:#e4a96d; --gold-soft:rgba(228,169,109,.35); --fallen:rgba(239,229,213,.32);
    --veil:radial-gradient(90% 80% at 50% 40%, rgba(95,83,72,0) 45%, rgba(40,34,26,.45) 100%); color-scheme:dark } }
  :root[data-theme="dark"]{
    --bg:#5f5348; --ink:#efe5d5; --dim:#c2b29c; --line:rgba(239,229,213,.42); --faint:rgba(239,229,213,.15);
    --panel:rgba(38,31,26,.55); --gold:#e4a96d; --gold-soft:rgba(228,169,109,.35); --fallen:rgba(239,229,213,.32);
    --veil:radial-gradient(90% 80% at 50% 40%, rgba(95,83,72,0) 45%, rgba(40,34,26,.45) 100%); color-scheme:dark }

  html,body{ background:var(--bg); color:var(--ink) }
  /* everything is sized in rem, and rem follows the window, so the whole page fits one screen */
  html{ font-size:clamp(11px, min(1.05vw, 1.75vh), 22px) }
  body{ font-family:var(--serif); position:relative; overflow-x:hidden }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; background:var(--veil); z-index:0 }
  body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.2; mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
  .wrap{ position:relative; z-index:1; box-sizing:border-box; height:100vh; display:flex; flex-direction:column; padding-block:1.5rem 1.4rem;
    padding-left:max(16px, env(safe-area-inset-left, 0px), 3vw); padding-right:max(16px, env(safe-area-inset-right, 0px), 3vw) }

  header{ display:flex; align-items:center; gap:1.4rem; margin-bottom:.9rem }
  .mark{ font-family:var(--wide); letter-spacing:.34em; font-size:.9rem }
  a.mark{ color:inherit; text-decoration:none; border-bottom:1px solid transparent; padding-bottom:.15rem; transition:border-color .3s }
  a.mark:hover, a.mark:focus-visible{ border-bottom-color:currentColor; outline:none }
  header .spacer{ flex:1 }
  header, .title{ position:relative; z-index:8 }
  .modes{ display:flex; gap:.25rem; padding:.2rem; border:.5px solid var(--line); border-radius:999px }
  .modes button{ all:unset; cursor:pointer; font-family:var(--mono); font-size:.72rem; letter-spacing:.16em; padding:.38rem .8rem; border-radius:999px; color:var(--dim) }
  .modes button[aria-pressed="true"]{ background:var(--faint); color:var(--ink) }
  /* light: dusk (the violet evening, the haze on the table) or afternoon (clear) */
  .mood{ all:unset; cursor:pointer; width:2.1rem; height:2.1rem; display:grid; place-items:center; border-radius:50%; border:.5px solid var(--line); color:var(--ink) }
  .mood:hover{ background:var(--faint) } .mood:focus-visible{ outline:1px solid var(--ink); outline-offset:2px }
  .mood svg{ width:1.05rem; height:1.05rem }
  :root.noon .v-grade{ opacity:.25 } :root.noon .v-shade{ opacity:.7 }
  .modes button:focus-visible{ outline:1px solid var(--ink); outline-offset:2px }

  .title{ display:flex; align-items:baseline; gap:1.1rem; flex-wrap:wrap; margin:0 0 .4rem }
  .title h1{ margin:0; font-family:var(--wide); font-weight:200; font-size:2.5rem; letter-spacing:.04em; line-height:1 }
  .title span{ font-family:var(--mono); font-size:.7rem; letter-spacing:.2em; color:var(--dim) }

  .grid{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 25rem; gap:2.2rem }
  @media (max-width: 900px){ .wrap{ height:auto } .grid{ grid-template-columns:1fr } .stage{ height:72vh; min-height:440px } }

  /* the wall the medallions hang on */
  .stage{ position:relative; min-width:0; min-height:0 }
  .stage svg.links{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none }
  .layer{ position:absolute; inset:0; pointer-events:none; transition:opacity .8s ease }
  .layer.off{ opacity:0 }
  .axis{ position:absolute; left:4%; right:4%; top:91%; height:1px; background:var(--line) }
  .axis::before,.axis::after{ content:""; position:absolute; top:-3px; width:7px; height:7px; border-top:1px solid var(--line); border-left:1px solid var(--line) }
  .axis::before{ left:-1px; transform:rotate(-45deg) } .axis::after{ right:-1px; transform:rotate(135deg) }
  .tick{ position:absolute; transform:translateX(-50%); font-family:var(--mono); font-size:.66rem; letter-spacing:.18em; color:var(--dim); white-space:nowrap }
  .compass{ position:absolute; inset:0 }
  .compass i{ position:absolute; background:var(--faint) }
  .compass .ns{ left:50%; top:4%; bottom:4%; width:1px } .compass .ew{ top:50%; left:2%; right:2%; height:1px }

  /* 关系 / 地域: a small switch inside the structure view */
  .sub{ position:absolute; left:0; top:0; z-index:3; display:flex; gap:.2rem; padding:.16rem; border:.5px solid var(--faint); border-radius:999px }
  .sub button{ all:unset; cursor:pointer; font-family:var(--mono); font-size:.64rem; letter-spacing:.16em; padding:.26rem .66rem; border-radius:999px; color:var(--dim) }
  .sub button[aria-pressed="true"]{ background:var(--faint); color:var(--ink) }
  .sub button:focus-visible{ outline:1px solid var(--ink); outline-offset:2px }
  .vault-on .sub{ display:none }

  /* the matrix under the chart: one row per layer of information, one column per house, read across to compare */
  .matrix{ position:absolute; left:0; right:0; top:var(--mtop); bottom:0; display:grid; grid-template-columns:var(--gut) repeat(6,minmax(0,1fr));
    grid-auto-rows:minmax(0,auto); align-content:start; pointer-events:auto }
  .matrix > *{ padding:.55rem .3rem; text-align:center; font-size:.8rem; line-height:1.45; min-width:0; overflow-wrap:anywhere; transition:color .3s }
  .matrix .t{ display:inline-block; padding:0 .2rem }
  .matrix .lab{ text-align:left; padding-left:0; font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; color:var(--dim); line-height:1.5 }
  .matrix .lab b{ display:block; font-family:var(--serif); font-weight:500; font-size:.78rem; letter-spacing:.1em; color:var(--ink) }
  .matrix .lab[data-g]::before{ content:attr(data-g); display:block; font-size:.54rem; letter-spacing:.3em; color:var(--gold); margin-bottom:.1rem }
  .layer.off .matrix{ pointer-events:none }
  .matrix .c{ color:var(--dim); cursor:pointer }
  .matrix .c.on{ color:var(--ink) }
  .matrix .c.tbd{ font-family:var(--mono); font-size:.66rem; letter-spacing:.14em; opacity:.6 }
  .matrix .c small{ display:block; font-family:var(--mono); font-size:.6rem; letter-spacing:.06em; opacity:.8 }
  .matrix .c.gold{ color:var(--gold) }
  /* party: one bracket over every house in it */
  .matrix .party .t{ padding:0 .5rem }
  .matrix .sep{ grid-column:1 / -1; padding:0; border:none; height:.5rem }
  @media (max-width: 640px){ .matrix > *{ font-size:9.5px; padding:.4rem .15rem } .matrix .lab b{ font-size:10px } .matrix .c small{ display:none } }

  .house{ all:unset; position:absolute; left:var(--x); top:var(--y); transform:translate(-50%,-50%); width:7.6rem;
    display:flex; flex-direction:column; align-items:center; gap:.4rem; cursor:pointer; text-align:center;
    transition:left .9s cubic-bezier(.3,.7,.2,1), top .9s cubic-bezier(.3,.7,.2,1) }
  .house .crest{ width:4.6rem; height:4.6rem; color:var(--gold); transition:transform .4s ease, color .3s }
  .house .crest svg{ width:100%; height:100%; overflow:visible }
  .house b{ font-family:var(--wide); font-weight:400; font-size:.76rem; letter-spacing:.24em; text-transform:uppercase }
  .house small:empty{ display:none }
  .house small{ font-family:var(--mono); font-size:.64rem; letter-spacing:.12em; color:var(--dim) }
  .house:hover .crest{ transform:scale(1.06) }
  .house:focus-visible{ outline:1px solid var(--ink); outline-offset:6px; border-radius:12px }
  .house[aria-pressed="true"] .ring-o{ animation:spin 60s linear infinite }
  .house[aria-pressed="true"] .crest{ transform:scale(1.1) }
  .house.fallen .crest{ color:var(--fallen) } .house.fallen b{ text-decoration:line-through; text-decoration-thickness:1px }
  .house.crown{ width:9rem } .house.crown .crest{ width:6.2rem; height:6.2rem }
  @media (max-width: 640px){ .house{ width:54px } .house .crest{ width:46px; height:46px } .house b{ font-size:7.5px; letter-spacing:.02em; white-space:nowrap } .house small{ display:none }
    .house.crown{ width:90px } .house.crown .crest{ width:78px; height:78px } }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .ring-o{ transform-origin:0 0 }
  @media (prefers-reduced-motion: reduce){ .house,.house .crest{ transition:none } .house[aria-pressed="true"] .ring-o{ animation:none } }

  /* map: an engraved disc, the capital at its heart */
  #disc{ position:absolute; inset:0; width:100%; height:100%; overflow:visible }

  :root.vault .title span{ visibility:hidden }
  /* the structure laid on the sand: the html chart steps aside, its houses stay as invisible hit targets over the runes */
  :root.sand #spec, :root.sand #map, :root.sand.rune-on .links{ visibility:hidden }
  .house.ghost{ opacity:0; transition:none }
  :root.sand .title h1, :root.sand header .mark, :root.sand .sub{ text-shadow:0 1px 14px rgba(30,16,30,.75) } .house.ghost:focus-visible{ opacity:1 }
  :root.vault, :root.sand{ --bg:#3a3446; --ink:#ebe3d5; --dim:#8f8576; --line:rgba(235,227,213,.3); --faint:rgba(235,227,213,.1); --gold:#d8b98c;
    --panel:rgba(20,16,13,.6); --veil:radial-gradient(70% 70% at 50% 45%, rgba(40,32,26,.55), rgba(0,0,0,0) 70%); color-scheme:dark }
  html,body{ transition:background-color .8s ease, color .8s ease }
  /* vault: the crests as paper seals lying in a dark box; the chosen one lifts toward you and takes its colour */
  #vault{ pointer-events:none } #vault:not(.off){ pointer-events:auto }
  .grid.solo{ grid-template-columns:minmax(0,1fr) } .grid.solo .card{ display:none }
  .v-shade{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background:radial-gradient(38% 32% at 12% 8%, rgba(24,20,34,.6), rgba(24,20,34,0)), linear-gradient(to bottom, rgba(24,20,34,.5) 0%, rgba(24,20,34,.18) 18%, rgba(24,20,34,0) 34%, rgba(24,20,34,0) 64%, rgba(20,17,30,.7) 86%, rgba(18,15,26,.86) 100%) }
  .v-grade{ position:fixed; inset:0; z-index:0; pointer-events:none; mix-blend-mode:multiply; background:radial-gradient(90% 80% at 55% 48%, rgba(255,255,255,0) 40%, rgba(30,24,44,.55) 100%) }
  .v-glow{ position:fixed; inset:0; z-index:0; pointer-events:none; mix-blend-mode:screen; background:linear-gradient(118deg, rgba(255,245,200,0) 38%, rgba(255,170,90,.05) 50%, rgba(255,245,200,0) 64%) }
  .v-ask{ position:absolute; top:.2rem; left:0; right:0; text-align:center; font-family:var(--wide); font-size:.78rem; letter-spacing:.3em; z-index:2 }
  .v-ask span{ font-family:var(--serif); letter-spacing:.2em; color:var(--dim); margin-left:.6rem }
  .v-quote{ position:absolute; top:1.9rem; left:50%; z-index:2; width:18rem; margin:0; padding:.6rem 0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
    font-family:var(--mono); font-style:italic; font-size:.8rem; line-height:1.7; transform:translateX(-50%); transition:left .6s cubic-bezier(.3,.7,.2,1); text-shadow:0 1px 8px rgba(0,0,0,.6) }
  .v-scene{ position:fixed; inset:0; z-index:-1 }
  .v-scene canvas{ display:block; width:100%; height:100%; cursor:default; filter:saturate(1.08) contrast(1.05);
    }
  .v-scene.hot canvas{ cursor:pointer }
  .v-scene .fallback{ position:absolute; inset:0; display:grid; place-items:center; font-family:var(--mono); font-size:.72rem; color:var(--dim) }
  /* the turned card: the card itself stands at the left, its sheet opens on the right */
  /* the turned card's sheet: the whole screen in three columns, like a character dossier.
     left: the house and its card · centre: three framed faculties · right: the writing, the lineage */
  /* the turned card's sheet: two fifths for the card, three for a frosted panel (the character pages' frame) */
  .v-sheet{ position:fixed; inset:0; z-index:3; box-sizing:border-box; padding:7.4rem 3.2vw 2.6rem;
    display:grid; grid-template-columns:2fr 3fr; column-gap:2.4rem; align-items:center; opacity:0; pointer-events:none; transition:opacity .5s ease .15s;
    background:radial-gradient(60% 80% at 20% 55%, rgba(18,14,26,0), rgba(18,14,26,.35)); }
  .sh-panel{ position:relative; grid-column:2; box-sizing:border-box; max-height:100%; overflow:auto; display:grid; grid-template-columns:2fr 1fr; grid-template-rows:auto auto auto;
    column-gap:1.4rem; row-gap:1.4rem; padding:0 .2rem }
  /* each part stands in its own frame: the character pages' rounded glass, the room showing through */
  .pane{ position:relative; box-sizing:border-box; border-radius:1.3rem; border:.5px solid var(--line); background:rgba(34,28,44,.5);
    -webkit-backdrop-filter:blur(14px) saturate(1.05); backdrop-filter:blur(14px) saturate(1.05) }
  .pane.talents{ padding:2rem 1.8rem 2.2rem }
  /* the writing: a card of its own, with an inner keyline like a printed dossier */
  .pane.dossier{ padding:1.7rem 1.6rem 1.5rem }
  .pane.dossier::before{ content:""; position:absolute; inset:.45rem; border:.5px solid var(--faint); border-radius:.95rem; pointer-events:none }
  .pane.hist{ grid-column:1 / -1; padding:1.1rem 1.8rem 1.3rem }
  :root.flipped .v-sheet{ opacity:1; pointer-events:auto }
  :root.flipped .sub{ opacity:0; pointer-events:none } :root.vault .sub{ display:none } .title{ transition:opacity .35s }
  :root.flipped .v-cols, :root.flipped .v-quote, :root.flipped .v-ask{ opacity:0; pointer-events:none }
  .v-cols, .v-quote, .v-ask{ transition:opacity .35s ease }
  .v-sheet .close{ all:unset; cursor:pointer; position:absolute; right:.2rem; top:-.3rem; width:2.2rem; height:2.2rem; display:grid; place-items:center; border-radius:50%; border:.5px solid var(--line); color:var(--ink); font-size:.9rem; line-height:1 }
  .v-sheet .close:focus-visible{ outline:1px solid var(--ink); outline-offset:2px }
  .v-sheet .close:hover{ background:var(--faint) }
  .sh-col{ min-height:0; display:flex; flex-direction:column }
  .sh-top{ grid-column:1 / -1; display:flex; align-items:baseline; gap:1.2rem; padding:0 3.4rem 0 .4rem }
  .sh-head h2{ margin:0; font-family:var(--wide); font-weight:200; font-size:2.2rem; letter-spacing:.2em; line-height:1 }
  .sh-sub{ font-family:var(--mono); font-size:.62rem; letter-spacing:.2em; color:var(--ink); opacity:.8; text-shadow:0 1px 10px rgba(20,14,26,.9) }
  .sh-head h2{ text-shadow:0 2px 16px rgba(20,14,26,.6) }
  .draft{ margin-left:.5rem; padding:.05rem .4rem; border:1px solid var(--gold); border-radius:2px; color:var(--gold) }
  /* centre: three faculties of equal height */
  .sh-mid{ display:grid; grid-template-rows:repeat(3,auto); row-gap:2.5rem; align-content:start }
  .fac{ position:relative; display:grid; grid-template-rows:1fr auto; border:1px solid var(--line); border-top:none; border-bottom:none; padding:1.5rem 0 .2rem }
  .fac-h{ position:absolute; left:-1px; right:-1px; top:-.62rem; display:flex; align-items:center; gap:.7rem }
  .fac-h::before, .fac-h::after{ content:""; width:1.1rem; height:1px; background:var(--line) } .fac-h .rule{ flex:1; height:1px; background:var(--line) }
  .fac-n{ display:flex; align-items:center; gap:.55rem; font-family:var(--wide); font-size:.8rem; letter-spacing:.28em }
  .fac-n em{ font-style:normal; font-family:var(--mono); font-size:.54rem; letter-spacing:.2em; color:var(--dim) }
  .fac-n .bd{ width:.85rem; color:var(--gold) }
  .meter{ display:flex; align-items:stretch; border:1px solid var(--line); border-radius:2px; font-family:var(--mono); font-size:.68rem }
  .meter > *{ display:flex; align-items:center; padding:.12rem .55rem } .meter > *+*{ border-left:1px solid var(--line) }
  .meter i{ gap:2px; padding-right:1.4rem } .meter s{ width:3px; height:.72rem; background:var(--faint) } .meter s.on{ background:var(--gold) }
  .fac-row{ display:grid; grid-template-columns:repeat(var(--n,3),1fr); align-items:center }
  .tal{ all:unset; cursor:default; display:grid; justify-items:center; gap:.55rem; color:var(--dim) }
  .tal .bd{ width:3.1rem; transition:transform .25s } .tal:hover .bd{ transform:translateY(-2px) }
  .tal .bd.lit{ color:var(--gold) }
  .tal span{ font-family:var(--serif); font-size:.74rem; letter-spacing:.32em; color:var(--ink); margin-right:-.32em }
  .tal.st .cr{ width:2.7rem; height:2.7rem; opacity:.5 } .tal.st .cr svg{ width:100%; height:100% }
  .tal.st span{ font-family:var(--wide); font-size:.58rem; letter-spacing:.16em; margin-right:-.16em; color:var(--dim) }
  .tal.st.ally .cr, .tal.st.blood .cr, .tal.st.foe .cr{ opacity:1 } .tal.st.ally, .tal.st.blood{ color:var(--gold) } .tal.st.foe{ color:#e39aa8 }
  /* the numbers (or words) hang on the frame's bottom edge, a line strung between them */
  .fac-num{ display:flex; align-items:center; margin:.55rem -1px -.72rem }
  .fac-num .sp, .fac-num i{ height:1px; background:var(--line) } .fac-num .sp{ flex:.5 } .fac-num i{ flex:1 }
  .fac-num b{ width:3rem; text-align:center; font-family:var(--wide); font-weight:300; font-size:1.15rem; line-height:1.3 }
  .fac-num b.w{ font-family:var(--serif); font-weight:500; font-size:.86rem; color:var(--dim) }
  .fac-num b.w.ally, .fac-num b.w.blood{ color:var(--gold) } .fac-num b.w.foe{ color:#e39aa8 }
  /* right: the dossier's writing, top aligned with the faculties, the lineage on the bottom line */
  .sh-right{ gap:1.2rem }
  .sh-right .sh-desc{ margin-top:auto; padding-top:1rem; border-top:.5px solid var(--faint) }
  .sh-motto{ margin:0; padding:0; font-family:var(--mono); font-style:italic; font-size:.92rem; line-height:1.6 }
  .sh-text{ display:grid; gap:1.1rem }
  .sh-text h4{ margin:0 0 .35rem; display:flex; align-items:center; gap:.5rem; font-family:var(--wide); font-weight:400; font-size:.66rem; letter-spacing:.26em; color:var(--gold) }
  
  .sh-text p{ margin:0; font-family:var(--mono); font-style:italic; font-size:.76rem; line-height:1.8; color:var(--ink); text-align:left }
  .sh-desc{ margin:0; min-height:3.4em; font-family:var(--mono); font-style:italic; font-size:.76rem; line-height:1.7; color:var(--dim) }
  .sh-desc.on{ color:var(--ink) }
  .sh-desc b{ font-style:normal; font-family:var(--wide); font-weight:400; letter-spacing:.2em; color:var(--gold); margin-right:.7rem }
  .sh-lab{ font-family:var(--wide); font-size:.6rem; letter-spacing:.26em; color:var(--gold) }
  .sh-lab em{ font-style:normal; font-family:var(--mono); color:var(--dim); margin-left:.6rem; letter-spacing:.1em }
  .sh-eras{ position:relative; display:flex; height:2rem; margin-top:1.3rem; border-top:1px solid var(--line) }
  .sh-eras div{ position:relative; border-left:1px solid var(--faint); padding:.4rem .35rem 0; font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; color:var(--dim); white-space:nowrap; overflow:hidden }
  .sh-eras .run{ position:absolute; top:-2px; height:3px; background:var(--gold); box-shadow:0 0 10px rgba(216,185,140,.6) }
  .sh-eras .mk{ position:absolute; top:-1.2rem; transform:translateX(-50%); font-family:var(--mono); font-size:.54rem; letter-spacing:.1em; color:var(--gold); white-space:nowrap }
  .sh-eras .mk.now{ transform:translateX(-100%) }
  .sh-empty{ font-family:var(--mono); font-style:italic; font-size:.8rem; color:var(--dim) }
  .v-quote small.hint{ color:var(--gold); letter-spacing:.2em; margin-top:.5rem }
  .v-quote small{ display:block; margin-top:.35rem; font-style:normal; font-size:.66rem; letter-spacing:.16em; color:var(--dim) }
  /* under the cards: one column per card, following it as the row parts */
  .v-cols{ position:absolute; left:0; right:0; bottom:0; height:8.4rem; z-index:2 }
  .v-col{ position:absolute; top:0; width:8rem; transform:translateX(-50%); display:grid; gap:.5rem; justify-items:start; padding-top:.7rem;

<body>
<div class="wrap">

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.149.0/examples/jsm/" } }</script>
<script>
/* ---------- crests: engraved line work in one gold, a dial ring around each, like the sun on the loading page ---------- */
const T=Math.PI*2, f=n=>n.toFixed(2), P=(a,r)=>[Math.sin(a)*r,-Math.cos(a)*r];
function ring(big){
  let d=""; for(let i=0;i<72;i++){ const a=i/72*T, [x1,y1]=P(a,43), [x2,y2]=P(a, i%6===0?46.5:45); d+=`M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`; }
  return `<g class="ring-o"><circle r="47.5" stroke-width=".7"/><circle r="43" stroke-width=".35"/><path d="${d}" stroke-width=".35"/></g>`;
}
const SIGIL={
  helios:()=>{ let d=""; for(let i=0;i<16;i++){ const a=i/16*T, L=i%2?24:32, w=.09, [ax,ay]=P(a-w,14),[bx,by]=P(a+w,14),[tx,ty]=P(a,L); d+=`M${f(ax)} ${f(ay)}L${f(tx)} ${f(ty)}L${f(bx)} ${f(by)}`; }
    return `<path d="${d}" stroke-width=".8" stroke-linejoin="round"/><circle r="11" stroke-width="1"/><circle r="7.5" stroke-width=".4"/><circle r="2.4" fill="currentColor" stroke="none"/>`; },
  daeris:()=>`<path d="M0 -24V22M-11 24H11M-24 -13H24" stroke-width="1.2"/><circle cy="-27" r="2.4" stroke-width="1"/>
    <path d="M-22 -13L-28 5M-22 -13L-16 5M22 -13L16 5M22 -13L28 5" stroke-width=".6"/>
    <path d="M-31 5Q-22 15 -13 5ZM13 5Q22 15 31 5Z" stroke-width="1"/>
    <path d="M-8 30Q-20 26 -27 17M8 30Q20 26 27 17" stroke-width=".6" stroke-dasharray="2 2.5"/>`,
  solenne:()=>`<ellipse cy="-17" rx="24" ry="4" stroke-width="1"/><ellipse cy="9" rx="24" ry="4" stroke-width="1"/><path d="M-24 -17V9M24 -17V9" stroke-width="1"/>
    <path d="M-15 -9H15M-15 -4H11M-15 1H14" stroke-width=".5"/>
    <path d="M-28 22q7 -5 14 0t14 0t14 0t14 0" stroke-width=".9"/><path d="M-22 28q5.5 -4 11 0t11 0t11 0t11 0" stroke-width=".5"/>`,
  varn:()=>`<path d="M-25 6L0 13L25 6V-14L0 -7L-25 -14Z" stroke-width="1"/><path d="M0 -7V13" stroke-width=".6"/>

  k:()=>`<path d="M-28 0Q0 -20 28 0Q0 20 -28 0Z" stroke-width="1"/><circle r="8" stroke-width=".9"/><circle r="3" fill="currentColor" stroke="none"/>
    <path d="M-18 -26L-6 -7L1 1L9 6L20 26" stroke-width="1.1"/>`,
  south:()=>`<path d="M-30 8H30" stroke-width="1"/><path d="M-17 8A17 17 0 0 1 17 8" stroke-width="1" stroke-dasharray="3 3"/>

    <path d="M-26 17q6.5 -4.5 13 0t13 0t13 0t13 0" stroke-width=".8"/><path d="M-20 24q5 -3.5 10 0t10 0t10 0t10 0" stroke-width=".5"/>
    <text y="1" text-anchor="middle" font-size="11" fill="currentColor" stroke="none" font-family="var(--serif)">？</text>`,
  filippou:()=>`<path d="M0 -31L4 -25V11H-4V-25Z" stroke-width="1" stroke-linejoin="round"/><path d="M0 -25V8" stroke-width=".4"/>
    <path d="M-13 11H13M0 11V22" stroke-width="1.3"/><circle cy="25" r="2.6" stroke-width="1"/>
    <ellipse cx="-12" cy="-4" rx="9" ry="5.5" transform="rotate(-24 -12 -4)" stroke-width="1"/><ellipse cx="12" cy="-4" rx="9" ry="5.5" transform="rotate(24 12 -4)" stroke-width="1"/>`
};
const crest=id=>`<svg viewBox="-50 -50 100 100" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round">${ring()}${SIGIL[id]()}</g></svg>`;

/* ---------- the houses: what the setting already says; 【】 hides a secret until you hover it ---------- */
/* the houses: words live in content/家族/<name>.md (see loadHouses); here only what the design needs:
   which file, the crown, and the bearing/distance on the map disc */
const H=[
  { id:"helios", file:"Helios", crown:true, polar:[0,0] },
  { id:"varn", file:"Varn", polar:[-24,.72] },
  { id:"k", file:"K", polar:[24,.72] },
  { id:"daeris", file:"Daeris", polar:[84,.66] },
  { id:"solenne", file:"Solenne", polar:[238,.5] },
  { id:"filippou", file:"Filippou", polar:[122,.5] },
  { id:"south", file:"南方家族", polar:[168,.68] }
];
/* ---------- the house as a character: talent points, perks, a flaw, how far back it goes, who it loves and hates ----------

/* two groups of three talents, 0–5 each, 18 points to spend in all */
const FAC=[["门第","STANDING",[["血统","姓氏有多古老、多正统。","blood"],["王眷","离王座有多近，历代王室待它如何。","crown"],["财富","钱从哪里来，有多少。","coin"]]],
           ["手段","MEANS",[["兵戈","私兵、军械、护卫。","sword"],["学识","学问与魔法。","book"],["暗面","情报，和见不得光的办法。","eye"]]]];
const ERAS=[["Solenar",1],["Ostrium",1.2],["第一王朝",1.6],["第二王朝",.8],["家族时代",1.4],["Helios",.8]];
/* pts: 血统 王眷 财富 · 兵戈 学识 暗面 — 18 points each.  since: index into ERAS where the house begins */
const SHEET={};      /* filled from the files by loadHouses */
/* blood and marriage ties to the crown */
let TIES=[];

/* ---------- loading content/家族/ : the same Markdown conventions as the character pages ---------- */
const getMD=f=>fetch("content/"+f.split("/").map(encodeURIComponent).join("/"), {cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(f+" "+r.status); return r.text(); });
function splitFront(md){ md=md.replace(/\r/g,""); const fm={}, m=md.match(/^---\n([\s\S]*?)\n---\n?/);
  if(m){ m[1].split("\n").forEach(l=>{ const i=l.indexOf(":"); if(i>0) fm[l.slice(0,i).trim()]=l.slice(i+1).trim(); }); md=md.slice(m[0].length); } return [fm, md]; }
function sectionsOf(text){ const out={}; let cur=null; text.split("\n").forEach(l=>{ if(l.startsWith("## ")){ cur=l.slice(3).trim(); out[cur]=[]; } else if(cur) out[cur].push(l); });
  Object.keys(out).forEach(k=>{ out[k]=out[k].join("\n").trim(); }); return out; }
const pairOf=v=>{ v=(v||"").trim(); const i=v.indexOf(" · "); return i<0 ? [v,""] : [v.slice(0,i).trim(), v.slice(i+3).trim()]; };
const listOf=t=>(t||"").split("\n").map(x=>x.trim()).filter(x=>/^[-*]\s/.test(x)).map(x=>{ x=x.replace(/^[-*]\s+/,""); const i=x.indexOf("："); return i<0?[x,""]:[x.slice(0,i).trim(), x.slice(i+1).trim()]; });
const STANCE={ "血亲":"blood", "盟":"ally", "仇":"foe", "和":"peace" };
const TIE_WORDS=["母族","联姻","血缘"];          /* these ties are drawn in gold, as blood and marriage */
function loadHouses(){
  return Promise.all(H.map(h=>getMD("家族/"+h.file+".md").then(md=>({h, md})))).then(all=>{
    all.forEach(({h,md})=>{ const [fm,body]=splitFront(md), sec=sectionsOf(body);
      const [rg,rgN]=pairOf(fm.region), [pt,ptN]=pairOf(fm.party), [cb,cbN]=pairOf(fm.cabinet), [ti,tiN]=pairOf(fm.crown), hd=(fm.head||"").trim();
      Object.assign(h,{ name:fm.name||h.file, zh:fm.zh||"", badge:fm.badge||"", fallen:/^(是|yes|true)$/i.test(fm.fallen||""),
        region:fm.region||"", party:pt, partyNote:ptN, cab:fm.cabinet||"", head:hd==="待定"?"":hd,
        tie:sec["与王室"]||sec["继承"]||"", quote:sec["一句话"]||"", culture:sec["家族与文化"]||"", secret:sec["秘闻"]||"",
        people:listOf(sec["人物"]),
        m:{ region:rg, sub:rgN, cab:cb, csub:cbN, tie:ti||"—", tsub:tiN, head:hd==="待定"?"":hd.split(/（| · /)[0].trim() } });
      if(fm.talents){ const nameToId={}; H.forEach(x=>{ nameToId[x.name||x.file]=x.id; nameToId[x.file]=x.id; });
        const rel={}; listOf(sec["立场"]).forEach(([n,w])=>{ const id=nameToId[n]; if(id) rel[id]=STANCE[w]||"peace"; });
        SHEET[h.id]={ motto:sec["家训"]||"", blurb:sec["简介"]||"", pts:fm.talents.split("/").map(x=>+x.trim()||0),
          text:["起源","家风"].filter(k=>sec[k]).map(k=>[k,sec[k]]), since:Math.max(0,ERAS.findIndex(e=>e[0]===(fm.since||"").trim())),
          origin:fm.lineage||"", rel }; } });
    /* stance names may refer to houses read later: resolve once everything is in */
    all.forEach(({h,md})=>{ if(!SHEET[h.id]) return; const sec=sectionsOf(splitFront(md)[1]), rel={};
      listOf(sec["立场"]).forEach(([n,w])=>{ const x=H.find(q=>q.name===n||q.file===n); if(x) rel[x.id]=STANCE[w]||"peace"; }); SHEET[h.id].rel=rel; });
    TIES=H.filter(h=>!h.crown && TIE_WORDS.includes(h.m.tie)).map(h=>["helios",h.id]);
    Object.keys(TIE_LABEL).forEach(k=>delete TIE_LABEL[k]); TIES.forEach(([,id])=>{ TIE_LABEL[id]=H.find(h=>h.id===id).m.tie; });
    PARTIES=[]; VH0.forEach(h=>{ let P=PARTIES.find(p=>p[0]===h.party); if(!P) PARTIES.push(P=[h.party,[],h.partyNote]); P[1].push(h.id); if(!P[2]) P[2]=h.partyNote; });
  });
}

const stage=document.getElementById("stage"), card=document.getElementById("card"), links=document.getElementById("links");
let mode="vault", current="helios";      /* the page opens on the cards; 结构 takes you to the structure */
function makeButtons(){ H.forEach(h=>{
  const b=document.createElement("button"); b.type="button"; b.className="house"+(h.crown?" crown":"")+(h.fallen?" fallen":"");
  b.dataset.id=h.id; b.setAttribute("aria-pressed","false"); b.setAttribute("aria-label",`${h.name}，${h.zh}`);
  b.innerHTML=`<span class="crest">${crest(h.id)}</span><b>${h.name}</b><small>${h.badge||""}</small>`;
  b.addEventListener("click",()=>show(h.id));
  stage.appendChild(b); h.el=b;
}); }
/* columns: a gutter for the row names, then one column per house, left to right from the north's conservatives to the free south */
const GUT=13, MTOP=47, colX=i=>GUT+(i+.5)*(100-GUT)/6;
const VH0=H.filter(h=>!h.crown);
H.forEach(h=>{ h.spec = h.crown ? [GUT+(100-GUT)/2, 10] : [colX(VH0.indexOf(h)), 33]; });
let PARTIES=[];      /* grouped from each house's party by loadHouses */
function buildMatrix(){
  const M=document.getElementById("matrix"); M.style.setProperty("--gut",GUT+"%"); document.getElementById("spec").style.setProperty("--mtop",MTOP+"%");
  const lab=(zh,en,g)=>`<div class="lab"${g?` data-g="${g}"`:""}><b>${zh}</b>${en}</div>`;
  const cell=(h,main,sub,cls="")=>`<div class="c${main?"":" tbd"}${cls}" data-ids="${h.id}"><span class="t">${main||"待定"}${sub?`<small>${sub}</small>`:""}</span></div>`;
  let x=lab("地域","REGION","政治")+VH0.map(h=>cell(h,h.m.region,h.m.sub)).join("");
  x+=lab("党派","PARTY")+PARTIES.map(([n,ids,sub])=>`<div class="c party" data-ids="${ids.join(" ")}" style="grid-column:span ${ids.length}"><span class="t">${n}${sub?`<small>${sub}</small>`:""}</span></div>`).join("");
  x+=lab("内阁","CABINET")+VH0.map(h=>cell(h,h.m.cab,h.m.csub)).join("");
  x+=lab("与王室","CROWN")+VH0.map(h=>cell(h,h.m.tie,h.m.tsub, h.m.tie&&h.m.tie!=="—"?" gold":"")).join("");
  x+=lab("家主","HEAD","家族")+VH0.map(h=>cell(h,h.m.head,"")).join("");
  M.innerHTML=x;
  M.querySelectorAll(".c").forEach(c=>c.addEventListener("click",()=>{ const ids=c.dataset.ids.split(" "); show(ids.includes(current)?current:ids[0]); }));
}
const spoil=s=>s.replace(/【([^】]+)】/g,'<span class="spoil" tabindex="0">$1</span>');
function show(id){
  current=id; const h=H.find(x=>x.id===id);
  H.forEach(x=>x.el.setAttribute("aria-pressed", x.id===id));
  document.querySelectorAll("#matrix .c").forEach(c=>c.classList.toggle("on", c.dataset.ids.split(" ").includes(id)));
  if(typeof draw==="function" && mode==="spec") requestAnimationFrame(draw);
  if(V.chartDraw) V.chartDraw();
  card.innerHTML=`<div class="in">
    <div class="big"><span class="crest">${crest(h.id)}</span><div><h2>${h.name}</h2><div class="tag">${h.region} · ${h.party}</div></div></div>
    <dl class="pol">
      <div><dt>地域</dt><dd>${h.region}</dd></div>
      <div><dt>党派</dt><dd>${h.party}</dd></div>
      <div><dt>内阁</dt><dd>${h.cab}</dd></div>
      <div><dt>${h.crown?"继承":"与王室"}</dt><dd>${h.tie}</dd></div>
      <div><dt>家主</dt><dd${h.head?"":' class="tbd"'}>${h.head||"待定"}</dd></div>
    </dl>
    <dl>
      <div><dt>家族与文化</dt><dd>${spoil(h.culture)}</dd></div>
      ${h.people.length?`<div><dt>人物</dt><dd class="people">${h.people.map(([n,r])=>`<span>${n}<em>${r}</em></span>`).join("")}</dd></div>`:""}
      ${h.secret?`<div><dt>秘闻</dt><dd>${spoil(h.secret)}</dd></div>`:""}
    </dl>
    ${h.id==="south"?`<p class="note">这一家的姓氏、家徽和人物都还空着。</p>`:""}
  </div>`;
}
/* the disc: its size follows the stage; houses sit at an angle and a distance from the capital */
function geo(){ const R=stage.getBoundingClientRect(); return { w:R.width, h:R.height, cx:R.width/2, cy:R.height/2, rad:Math.min(R.width*.36, R.height*.47) }; }
function drawDisc(){
  const g=geo(), {cx,cy,rad}=g, el=document.getElementById("disc"); el.setAttribute("viewBox",`0 0 ${f(g.w)} ${f(g.h)}`);
  const at=(deg,r)=>[cx+Math.sin(deg*Math.PI/180)*r, cy-Math.cos(deg*Math.PI/180)*r];
  let t=""; for(let i=0;i<120;i++){ const [x1,y1]=at(i*3,rad-6), [x2,y2]=at(i*3, rad-(i%10===0?14:9)); t+=`M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`; }
  let q=""; [45,135,225,315].forEach(d=>{ const [x1,y1]=at(d,rad*.62), [x2,y2]=at(d,rad-16); q+=`M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`; });
  const lab=(deg,r,txt,anchor,op)=>{ const [x,y]=at(deg,r); return `<text x="${f(x)}" y="${f(y+4)}" text-anchor="${anchor}" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="2" fill="var(--dim)"${op?` opacity="${op}"`:""}>${txt}</text>`; };
  el.innerHTML=`<g fill="none" stroke="var(--line)"><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rad)}" stroke-width=".8"/><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rad-6)}" stroke-width=".4"/>
