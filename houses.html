<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Great Houses</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200..500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Serif+SC:wght@400;500&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* layout: the houses hang like medallions on a dusk wall; one readout card on the right, as on the character pages */
  :root{
    --bg:#ece2d5; --ink:#3a322a; --dim:#7a6c5c; --line:rgba(58,50,42,.45); --faint:rgba(58,50,42,.16);
    --panel:rgba(250,244,234,.62); --gold:#94703f; --gold-soft:rgba(148,112,63,.35); --fallen:rgba(58,50,42,.38);
    --wide:"Inter","Helvetica Neue",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
    --serif:"Noto Serif SC","Songti SC",serif;
    --veil:radial-gradient(110% 90% at 10% -10%, rgba(240,246,196,.35), rgba(240,246,196,0) 60%);
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#5f5348; --ink:#efe5d5; --dim:#c2b29c; --line:rgba(239,229,213,.42); --faint:rgba(239,229,213,.15);
    --panel:rgba(38,31,26,.55); --gold:#e4a96d; --gold-soft:rgba(228,169,109,.35); --fallen:rgba(239,229,213,.32);
    --veil:radial-gradient(90% 80% at 50% 40%, rgba(95,83,72,0) 45%, rgba(40,34,26,.45) 100%); color-scheme:dark } }
  :root[data-theme="dark"]{
    --bg:#5f5348; --ink:#efe5d5; --dim:#c2b29c; --line:rgba(239,229,213,.42); --faint:rgba(239,229,213,.15);
    --panel:rgba(38,31,26,.55); --gold:#e4a96d; --gold-soft:rgba(228,169,109,.35); --fallen:rgba(239,229,213,.32);
    --veil:radial-gradient(90% 80% at 50% 40%, rgba(95,83,72,0) 45%, rgba(40,34,26,.45) 100%); color-scheme:dark }

  html,body{ background:var(--bg); color:var(--ink) }
  /* everything is sized in rem, and rem follows the window, so the whole page fits one screen */
  html{ font-size:clamp(11px, min(1.05vw, 1.75vh), 22px) }
  body{ font-family:var(--serif); position:relative; overflow-x:hidden }
  body::before{ content:""; position:fixed; inset:0; pointer-events:none; background:var(--veil); z-index:0 }
  body::after{ content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.2; mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>") }
  .wrap{ position:relative; z-index:1; box-sizing:border-box; height:100vh; display:flex; flex-direction:column; padding-block:1.5rem 1.4rem;
    padding-left:max(16px, env(safe-area-inset-left, 0px), 3vw); padding-right:max(16px, env(safe-area-inset-right, 0px), 3vw) }

  header{ display:flex; align-items:center; gap:1.4rem; margin-bottom:.9rem }
  .mark{ font-family:var(--wide); letter-spacing:.34em; font-size:.9rem }
  a.mark{ color:inherit; text-decoration:none; border-bottom:1px solid transparent; padding-bottom:.15rem; transition:border-color .3s }
  a.mark:hover, a.mark:focus-visible{ border-bottom-color:currentColor; outline:none }
  header .spacer{ flex:1 }
  header, .title{ position:relative; z-index:8 }
  /* the map room: its own page, laid over the table while its tab is open */
  :root.land .sub{ visibility:hidden }
  /* the ledger: the card's shape and type, on light paper to sit on the map; in the window light it turns to the card's dark */
  :root.land .grid .card{ display:none }
  .ledger{ display:none; position:relative; align-self:start; max-height:100%; overflow:auto; box-sizing:border-box; min-width:0; padding:1.4rem 1.5rem 1.5rem; border-radius:1.6rem;
    --l-ink:#3b342c; --l-dim:#8a7f72; --l-line:rgba(59,52,44,.16); --l-faint:rgba(59,52,44,.055); --l-none:rgba(59,52,44,.15); --l-sg:rgba(59,52,44,.5); --l-gold:#8d7142;
    color:var(--l-ink); background:rgba(250,247,242,.74); border:.5px solid var(--l-line); box-shadow:0 12px 40px rgba(70,50,40,.07);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); font-family:var(--serif) }
  :root.land .ledger{ display:block } :root.land .ledger:empty{ display:none }
  :root.land.landdark .ledger{ --l-ink:var(--ink); --l-dim:var(--dim); --l-line:var(--line); --l-faint:var(--faint); --l-none:rgba(235,227,213,.16); --l-sg:rgba(235,227,213,.5); --l-gold:var(--gold); background:var(--panel); box-shadow:none }
  .ledger .in{ animation:in .45s ease }
  .ledger .big{ display:flex; gap:1rem; align-items:center; padding-bottom:1rem; border-bottom:.5px solid var(--l-line) }
  .ledger .big .crest{ width:3.4rem; height:3.4rem; flex:none } .ledger .big .crest svg{ width:100%; height:100% }
  .ledger h2{ margin:0; font-family:var(--wide); font-weight:300; font-size:1.7rem; letter-spacing:.08em; line-height:1.1 }
  .ledger h2.pv, .ledger .pn{ font-family:"Cormorant Garamond", Georgia, serif; font-weight:600; text-transform:uppercase }
  .ledger h2.pv{ font-size:1.6rem; letter-spacing:.18em }
  .ledger .tag{ margin-top:.35rem; font-family:var(--mono); font-size:.64rem; letter-spacing:.14em; color:var(--l-dim) }
  .ledger button{ all:unset; cursor:pointer; box-sizing:border-box }
  .ledger button:focus-visible{ outline:1px solid var(--l-ink); outline-offset:2px; border-radius:.5rem }
  .ledger .back{ display:inline-block; margin:-.2rem 0 .8rem; font-family:var(--mono); font-size:.64rem; letter-spacing:.16em; color:var(--l-dim) }
  .ledger .back:hover{ color:var(--l-ink) }
  .ledger .rows{ margin-top:.8rem; display:grid; gap:.1rem }
  .ledger .row{ display:grid; grid-template-columns:5.4rem minmax(0,1fr); gap:.8rem; align-items:center; padding:.45rem .55rem; border-radius:.7rem; width:100% }
  .ledger .row:hover, .ledger .row[aria-pressed="true"]{ background:var(--l-faint) } .ledger .row[aria-pressed="true"]{ box-shadow:inset 0 0 0 .5px var(--l-line) }
  .ledger .nm{ display:flex; align-items:center; gap:.45rem; font-size:.86rem; letter-spacing:.06em; white-space:nowrap }
  .ledger svg{ width:.95rem; height:.95rem; fill:currentColor; flex:none }
  .ledger .bar{ display:flex; height:.32rem; border-radius:999px; overflow:hidden; background:var(--l-faint) }
  .ledger .bar i, .ledger .dep i{ display:block; height:100% } .ledger .bar i.none{ background:var(--l-none) }
  .ledger .n{ font-family:var(--mono); font-size:.66rem; color:var(--l-dim); text-align:right }
  .ledger .key{ margin-top:1rem; padding-top:.9rem; border-top:.5px solid var(--l-line); display:flex; flex-wrap:wrap; gap:.4rem .9rem; font-family:var(--mono); font-size:.6rem; letter-spacing:.08em; color:var(--l-dim) }
  .ledger .key b, .ledger .who b{ display:inline-block; width:.55rem; height:.55rem; border-radius:2px; margin-right:.38rem; vertical-align:-.04rem } .ledger .key b.none{ background:var(--l-none) }
  .ledger .row.prov{ grid-template-columns:5.6rem minmax(0,1fr) 6.2rem }   /* the meters line up in their own column */
  .ledger .meter{ justify-self:start; display:inline-flex; align-items:stretch; border:1px solid var(--l-line); border-radius:3px; font-family:var(--mono); font-size:.66rem; color:var(--l-ink) }
  .ledger .meter > span{ display:flex; align-items:center; justify-content:center; min-width:1.5rem; padding:.14rem .45rem; border-right:1px solid var(--l-line) }
  .ledger .meter i{ display:flex; align-items:center; gap:2px; padding:.24rem .5rem }
  .ledger .meter s{ display:block; width:5px; height:.8rem; border-radius:1px; background:var(--l-faint); box-shadow:inset 0 0 0 .5px var(--l-line) }
  .ledger .meter s[style]{ box-shadow:none }
  /* a seat that swings between houses: hatched in ink; a seat a house is only present at, in its ledger: its colour, drawn empty */
  .ledger .meter s.sg, .ledger .key b.sg{ background:repeating-linear-gradient(135deg, var(--l-sg) 0 1px, transparent 1px 3px); box-shadow:inset 0 0 0 .5px var(--l-sg) }
  .ledger .meter s.al, .ledger .who b.o{ background:none; box-shadow:inset 0 0 0 1px var(--c) }
  .ledger .ps .al{ opacity:.42 }
  .ledger .lab{ font-family:var(--mono); font-size:.58rem; letter-spacing:.16em; color:var(--l-dim); align-self:center; margin-right:-.4rem }
  .ledger span.who{ cursor:default } .ledger span.who:hover{ text-decoration:none }
  .ledger .pn{ font-size:.92rem; letter-spacing:.14em }
  .ledger .ps{ display:flex; flex-wrap:wrap; gap:.2rem .5rem; align-items:center; font-family:var(--mono); font-size:.62rem; letter-spacing:.06em; color:var(--l-dim) }
  .ledger .ps svg{ width:.78rem; height:.78rem }
  .ledger .dep{ height:.3rem; border-radius:999px; background:var(--l-faint); overflow:hidden }
  .ledger dl{ margin:.9rem 0 0; display:grid; grid-template-columns:auto 1fr; gap:.55rem 1rem; align-items:baseline }
  .ledger dl > div{ display:contents }
  .ledger dt{ margin:0 } .ledger dt .slot{ font-family:var(--mono); font-size:.66rem; letter-spacing:.2em; color:var(--l-dim) } .ledger dt .slot:hover{ color:var(--l-ink) }
  .ledger dd{ margin:0; display:flex; flex-wrap:wrap; gap:.3rem .9rem; font-size:.86rem }
  .ledger .who{ font-family:var(--wide); font-size:.8rem; letter-spacing:.06em } .ledger .who:hover{ text-decoration:underline; text-underline-offset:.2em }
  .ledger .none{ font-family:var(--mono); font-size:.64rem; letter-spacing:.12em; color:var(--l-dim) }
  /* a province, read as a house's card and a person's profile are: a role line and a few short phrases on top, each said once,
     one line of introduction, then the card's own grid — labels on the left — down to the seats */
  .ledger.wide{ width:min(40rem, calc(100vw - 3rem)); justify-self:end }
  .ledger .pv h2{ margin:.2rem 0 0 }
  .ledger .pv .role{ margin:.45rem 0 0; font-family:var(--wide); font-weight:300; font-size:.98rem; letter-spacing:.03em; line-height:1.4 }
  .ledger .pv .role i{ font-style:normal; color:var(--l-dim); margin:0 .45em }
  .ledger .pv .stats{ margin:.6rem 0 0; font-family:var(--wide); font-weight:300; font-size:.84rem; letter-spacing:.02em; line-height:1.5 }
  .ledger .pv .stats span{ white-space:nowrap }
  .ledger .pv .stats b{ font-family:var(--mono); font-weight:400; font-size:.58rem; letter-spacing:.16em; color:var(--l-dim); margin-right:.45rem }
  .ledger .pv .stats em{ font-style:normal; color:var(--l-dim); margin:0 .8rem }
  .ledger .pv .intro{ margin:.75rem 0 0; font-size:.9rem; line-height:1.7; letter-spacing:.02em }
  .ledger .pv .kv{ margin:1rem 0 0; display:grid; grid-template-columns:3.2rem minmax(0,1fr); gap:.7rem .9rem; align-items:baseline }
  .ledger .pv .kv dt{ margin:0; font-family:var(--mono); font-size:.6rem; letter-spacing:.2em; color:var(--l-dim) }
  .ledger .pv .kv dd{ display:block; margin:0; font-size:.82rem; line-height:1.72; text-align:justify }
  .ledger .pv .kv .sep{ padding-top:.9rem; border-top:.5px solid var(--l-line) }
  .ledger .pv ol{ list-style:none; margin:0; padding:0 } .ledger .pv ol li{ display:grid; grid-template-columns:1.7rem minmax(0,1fr); line-height:1.72 }
  .ledger .pv ol b{ font-family:var(--mono); font-weight:400; font-size:.6rem; color:var(--l-dim); line-height:2.4 }
  .ledger .seatbar{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:.7rem .8rem }
  .ledger .cell{ min-width:0 }
  .ledger .cell .slot{ display:flex; align-items:center; gap:.3rem; font-family:var(--mono); font-size:.62rem; letter-spacing:.2em; color:var(--l-dim); white-space:nowrap }
  .ledger .cell[data-k]:hover .slot{ color:var(--l-ink) }
  .ledger .cell .bp{ width:3px; height:3px; border-radius:50%; background:currentColor; flex:none }
  .ledger .cell .bar{ display:block; height:4px; margin:.45rem 0 .5rem; border-radius:1px }
  .ledger .cell .bar.sg{ background:repeating-linear-gradient(135deg, var(--l-sg) 0 1px, transparent 1px 3px); box-shadow:inset 0 0 0 .5px var(--l-sg) }
  .ledger .cell .bar.out{ box-shadow:inset 0 0 0 .5px var(--l-line) }
  .ledger .cell .bar.no{ height:0; border-top:.5px dashed var(--l-line); border-radius:0 }
  .ledger .cell .hv{ display:flex; flex-wrap:wrap; align-items:center; gap:.2rem .35rem; min-height:1.3rem }
  .ledger .cell .who{ font-size:.78rem }
  .ledger .cell .nil{ font-family:var(--mono); font-size:.6rem; letter-spacing:.1em; color:var(--l-dim) }
  .ledger .cell.off .slot{ opacity:.45 }
  .ledger .cell .also{ display:inline-flex; gap:3px } .ledger .cell .also b{ display:block; width:.5rem; height:.5rem; border-radius:2px; box-shadow:inset 0 0 0 1px var(--c) }
  .ledger .why{ margin:.55rem 0 0; min-height:1.7em; font-size:.8rem; line-height:1.7; color:var(--l-dim); text-align:left }
  .ledger .why.on{ color:var(--l-ink) }
  .ledger .why b{ font-family:var(--mono); font-weight:400; font-size:.62rem; letter-spacing:.2em; color:var(--l-dim); margin-right:.7rem }
  .ledger .why .w{ margin-right:.7rem }
  @media (max-width: 900px){ .ledger.wide{ width:auto; justify-self:stretch } }
  /* over the land: the page's own words go dark on the light paper; the stage becomes a surface to turn the map with */
  :root.land header, :root.land .title{ --ink:#3b342c; --dim:#6f655a; --line:rgba(59,52,44,.32); --faint:rgba(59,52,44,.08) }
  :root.land .title h1, :root.land header .mark{ color:#3b342c; text-shadow:none }
  :root.land.landdark header, :root.land.landdark .title{ --ink:#e9e6df; --dim:#9a968d; --line:rgba(233,230,223,.28); --faint:rgba(233,230,223,.1) }
  :root.land.landdark .title h1, :root.land.landdark header .mark{ color:#e9e6df }
  .land-touch{ position:absolute; inset:0; z-index:6; touch-action:none; cursor:grab } .land-touch:active{ cursor:grabbing }
  .land-touch[hidden], .land-bar[hidden]{ display:none }
  .land-bar{ position:absolute; left:0; right:0; bottom:0; z-index:7; display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; justify-content:flex-end; pointer-events:none }
  .land-bar .hint{ font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; color:#3b342c; padding:.4rem .8rem; border-radius:999px; background:rgba(239,236,230,.7) }
  .land-bar .views{ display:flex; gap:.35rem; pointer-events:auto }
  .land-bar button{ all:unset; cursor:pointer; padding:.4rem .8rem; border:.5px solid rgba(59,52,44,.35); border-radius:999px; background:rgba(239,236,230,.7);
    font-family:var(--mono); font-size:.68rem; letter-spacing:.12em; color:#3b342c }
  .land-bar button[aria-pressed="true"]{ border-color:#3b342c } .land-bar button:focus-visible{ outline:1px solid #3b342c; outline-offset:2px }
  .modes{ display:flex; gap:.25rem; padding:.2rem; border:.5px solid var(--line); border-radius:999px }
  .modes button{ all:unset; cursor:pointer; font-family:var(--mono); font-size:.72rem; letter-spacing:.16em; padding:.38rem .8rem; border-radius:999px; color:var(--dim) }
  .modes button[aria-pressed="true"]{ background:var(--faint); color:var(--ink) }
  /* light: dusk (the violet evening, the haze on the table) or afternoon (clear) */
  .mood{ all:unset; cursor:pointer; width:2.1rem; height:2.1rem; display:grid; place-items:center; border-radius:50%; border:.5px solid var(--line); color:var(--ink) }
  .mood:hover{ background:var(--faint) } .mood:focus-visible{ outline:1px solid var(--ink); outline-offset:2px }
  .mood svg{ width:1.05rem; height:1.05rem }
  .v-grade, .v-glow, .v-shade{ transition:opacity 2.2s ease }
  :root.night .v-grade{ opacity:.35 } :root.night .v-glow{ opacity:0 }
  :root.noon .v-grade{ opacity:.25 } :root.noon .v-shade{ opacity:.7 }
  .modes button:focus-visible{ outline:1px solid var(--ink); outline-offset:2px }

  .title{ display:flex; align-items:baseline; gap:1.1rem; flex-wrap:wrap; margin:0 0 .4rem }
  .title h1{ margin:0; font-family:var(--wide); font-weight:200; font-size:2.5rem; letter-spacing:.04em; line-height:1 }
  .title span{ font-family:var(--mono); font-size:.7rem; letter-spacing:.2em; color:var(--dim) }

  .grid{ flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 25rem; gap:2.2rem }
  @media (max-width: 900px){ .wrap{ height:auto } .grid{ grid-template-columns:1fr } .stage{ height:72vh; min-height:440px } }

  /* the wall the medallions hang on */
  .stage{ position:relative; min-width:0; min-height:0 }
  .stage svg.links{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; pointer-events:none }
  .layer{ position:absolute; inset:0; pointer-events:none; transition:opacity .8s ease }
  .layer.off{ opacity:0 }
  .axis{ position:absolute; left:4%; right:4%; top:91%; height:1px; background:var(--line) }
  .axis::before,.axis::after{ content:""; position:absolute; top:-3px; width:7px; height:7px; border-top:1px solid var(--line); border-left:1px solid var(--line) }
  .axis::before{ left:-1px; transform:rotate(-45deg) } .axis::after{ right:-1px; transform:rotate(135deg) }
  .tick{ position:absolute; transform:translateX(-50%); font-family:var(--mono); font-size:.66rem; letter-spacing:.18em; color:var(--dim); white-space:nowrap }
  .compass{ position:absolute; inset:0 }
  .compass i{ position:absolute; background:var(--faint) }
  .compass .ns{ left:50%; top:4%; bottom:4%; width:1px } .compass .ew{ top:50%; left:2%; right:2%; height:1px }

  /* 关系 / 地域: a small switch inside the structure view */
  .sub{ position:absolute; left:0; top:0; z-index:3; display:flex; gap:.2rem; padding:.16rem; border:.5px solid var(--faint); border-radius:999px }
  .sub button{ all:unset; cursor:pointer; font-family:var(--mono); font-size:.64rem; letter-spacing:.16em; padding:.26rem .66rem; border-radius:999px; color:var(--dim) }
  .sub button[aria-pressed="true"]{ background:var(--faint); color:var(--ink) }
  .sub button:focus-visible{ outline:1px solid var(--ink); outline-offset:2px }
  .vault-on .sub{ display:none }

  /* the matrix under the chart: one row per layer of information, one column per house, read across to compare */
  .matrix{ position:absolute; left:0; right:0; top:var(--mtop); bottom:0; display:grid; grid-template-columns:var(--gut) repeat(6,minmax(0,1fr));
    grid-auto-rows:minmax(0,auto); align-content:start; pointer-events:auto }
  .matrix > *{ padding:.55rem .3rem; text-align:center; font-size:.8rem; line-height:1.45; min-width:0; overflow-wrap:anywhere; transition:color .3s }
  .matrix .t{ display:inline-block; padding:0 .2rem }
  .matrix .lab{ text-align:left; padding-left:0; font-family:var(--mono); font-size:.62rem; letter-spacing:.14em; color:var(--dim); line-height:1.5 }
  .matrix .lab b{ display:block; font-family:var(--serif); font-weight:500; font-size:.78rem; letter-spacing:.1em; color:var(--ink) }
  .matrix .lab[data-g]::before{ content:attr(data-g); display:block; font-size:.54rem; letter-spacing:.3em; color:var(--gold); margin-bottom:.1rem }
  .layer.off .matrix{ pointer-events:none }
  .matrix .c{ color:var(--dim); cursor:pointer }
  .matrix .c.on{ color:var(--ink) }
  .matrix .c.tbd{ font-family:var(--mono); font-size:.66rem; letter-spacing:.14em; opacity:.6 }
  .matrix .c small{ display:block; font-family:var(--mono); font-size:.6rem; letter-spacing:.06em; opacity:.8 }
  .matrix .c.gold{ color:var(--gold) }
  /* party: one bracket over every house in it */
  .matrix .party .t{ padding:0 .5rem }
  .matrix .sep{ grid-column:1 / -1; padding:0; border:none; height:.5rem }
  @media (max-width: 640px){ .matrix > *{ font-size:9.5px; padding:.4rem .15rem } .matrix .lab b{ font-size:10px } .matrix .c small{ display:none } }

  .house{ all:unset; position:absolute; left:var(--x); top:var(--y); transform:translate(-50%,-50%); width:7.6rem;
    display:flex; flex-direction:column; align-items:center; gap:.4rem; cursor:pointer; text-align:center;
    transition:left .9s cubic-bezier(.3,.7,.2,1), top .9s cubic-bezier(.3,.7,.2,1) }
  .house .crest{ width:4.6rem; height:4.6rem; color:var(--gold); transition:transform .4s ease, color .3s }
  .house .crest svg{ width:100%; height:100%; overflow:visible }
  .house b{ font-family:var(--wide); font-weight:400; font-size:.76rem; letter-spacing:.24em; text-transform:uppercase }
  .house small:empty{ display:none }
  .house small{ font-family:var(--mono); font-size:.64rem; letter-spacing:.12em; color:var(--dim) }
  .house:hover .crest{ transform:scale(1.06) }
  .house:focus-visible{ outline:1px solid var(--ink); outline-offset:6px; border-radius:12px }
  .house[aria-pressed="true"] .ring-o{ animation:spin 60s linear infinite }
  .house[aria-pressed="true"] .crest{ transform:scale(1.1) }
  .house.fallen .crest{ color:var(--fallen) } .house.fallen b{ text-decoration:line-through; text-decoration-thickness:1px }
  .house.crown{ width:9rem } .house.crown .crest{ width:6.2rem; height:6.2rem }

    .house.crown{ width:90px } .house.crown .crest{ width:78px; height:78px } }
  @keyframes spin{ to{ transform:rotate(360deg) } }
  .ring-o{ transform-origin:0 0 }

  /* map: an engraved disc, the capital at its heart */

  :root.vault .title span{ visibility:hidden }

  :root.sand #spec, :root.sand #map, :root.sand.rune-on .links{ visibility:hidden }
  .house.ghost{ opacity:0; transition:none }

  :root.vault, :root.sand{ --bg:#3a3446; --ink:#ebe3d5; --dim:#8f8576; --line:rgba(235,227,213,.3); --faint:rgba(235,227,213,.1); --gold:#d8b98c;
    --panel:rgba(20,16,13,.6); --veil:radial-gradient(70% 70% at 50% 45%, rgba(40,32,26,.55), rgba(0,0,0,0) 70%); color-scheme:dark }
  html,body{ transition:background-color .8s ease, color .8s ease }
  /* vault: the crests as paper seals lying in a dark box; the chosen one lifts toward you and takes its colour */

  .v-glow{ position:fixed; inset:0; z-index:0; pointer-events:none; mix-blend-mode:screen; background:linear-gradient(118deg, rgba(255,245,200,0) 38%, rgba(255,170,90,.05) 50%, rgba(255,245,200,0) 64%) }
  .v-ask{ position:absolute; top:.2rem; left:0; right:0; text-align:center; font-family:var(--wide); font-size:.78rem; letter-spacing:.3em; z-index:2 }

    font-family:var(--mono); font-style:italic; font-size:.8rem; line-height:1.7; transform:translateX(-50%); transition:left .6s cubic-bezier(.3,.7,.2,1); text-shadow:0 1px 8px rgba(0,0,0,.6) }
  .v-scene{ position:fixed; inset:0; z-index:-1 }
  .v-scene canvas{ display:block; width:100%; height:100%; cursor:default; filter:saturate(1.08) contrast(1.05);
    }

  /* the turned card: the card itself stands at the left, its sheet opens on the right */
  /* the turned card's sheet: the whole screen in three columns, like a character dossier.

  /* the turned card's sheet: two fifths for the card, three for a frosted panel (the character pages' frame) */
  .v-sheet{ position:fixed; inset:0; z-index:3; box-sizing:border-box; padding:7.4rem 3.2vw 2.6rem;

    background:radial-gradient(60% 80% at 20% 55%, rgba(18,14,26,0), rgba(18,14,26,.35)); }
  .sh-panel{ position:relative; grid-column:2; box-sizing:border-box; max-height:100%; overflow:auto; display:grid; grid-template-columns:2fr 1fr; grid-template-rows:auto auto auto;
    column-gap:1.4rem; row-gap:1.4rem; padding:0 .2rem }
  /* each part stands in its own frame: the character pages' rounded glass, the room showing through */

  .v-quote small.hint{ color:var(--gold); letter-spacing:.2em; margin-top:.5rem }
  .v-quote small{ display:block; margin-top:.35rem; font-style:normal; font-size:.66rem; letter-spacing:.16em; color:var(--dim) }
  /* under the cards: one column per card, following it as the row parts */
  .v-cols{ position:absolute; left:0; right:0; bottom:0; height:8.4rem; z-index:2 }
  .v-col{ position:absolute; top:0; width:8rem; transform:translateX(-50%); display:grid; gap:.5rem; justify-items:start; padding-top:.7rem;
    border-top:1px solid var(--line); opacity:.5; transition:opacity .4s, border-color .4s; cursor:pointer }

  .v-col span{ display:flex; align-items:center; gap:.55rem; font-family:var(--mono); font-style:italic; font-size:.72rem; letter-spacing:.06em; white-space:nowrap }

/* ---------- the houses: what the setting already says; 【】 hides a secret until you hover it ---------- */
/* the houses: words live in content/家族/<name>.md (see loadHouses); here only what the design needs:
   which file, the crown, and the bearing/distance on the map disc. */
const H=[
  { id:"helios", file:"Helios", crown:true, polar:[0,0] },
  { id:"varn", file:"Varn", polar:[-24,.72] },
  { id:"k", file:"K", polar:[24,.72] },
  { id:"daeris", file:"Daeris", polar:[84,.66] },
  { id:"filippou", file:"Filippou", polar:[122,.5] },
  { id:"solenne", file:"Solenne", polar:[238,.5] },
  { id:"south", file:"南方家族", polar:[168,.68] }
];
/* ---------- the house as a character: talent points, perks, a flaw, how far back it goes, who it loves and hates ----------
   Every house has the same 18 points to spend over six talents (0–5 each). Drafted from the setting; Crystal edits. */
/* two groups of three talents, 0–5 each, 18 points to spend in all */
const FAC=[["门第","STANDING",[["血统","姓氏有多古老、多正统。","blood"],["王眷","离王座有多近，历代王室待它如何。","crown"],["财富","钱从哪里来，有多少。","coin"]]],
           ["手段","MEANS",[["兵戈","私兵、军械、护卫。","sword"],["学识","学问与魔法。","book"],["暗面","情报，和见不得光的办法。","eye"]]]];
const ERAS=[["Solenar",1],["Ostrium",1.2],["第一王朝",1.6],["第二王朝",.8],["家族时代",1.4],["Helios",.8]];
/* pts: 血统 王眷 财富 · 兵戈 学识 暗面 — 18 points each.  since: index into ERAS where the house begins */
const SHEET={};      /* filled from the files by loadHouses */
/* blood and marriage ties to the crown */
let TIES=[];

/* ---------- loading content/家族/ : the same Markdown conventions as the character pages ---------- */
const getMD=f=>fetch("content/"+f.split("/").map(encodeURIComponent).join("/"), {cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(f+" "+r.status); return r.text(); });
function splitFront(md){ md=md.replace(/\r/g,""); const fm={}, m=md.match(/^---\n([\s\S]*?)\n---\n?/);
  if(m){ m[1].split("\n").forEach(l=>{ const i=l.indexOf(":"); if(i>0) fm[l.slice(0,i).trim()]=l.slice(i+1).trim(); }); md=md.slice(m[0].length); } return [fm, md]; }
function sectionsOf(text){ const out={}; let cur=null; text.split("\n").forEach(l=>{ if(l.startsWith("## ")){ cur=l.slice(3).trim(); out[cur]=[]; } else if(cur) out[cur].push(l); });
  Object.keys(out).forEach(k=>{ out[k]=out[k].join("\n").trim(); }); return out; }
const pairOf=v=>{ v=(v||"").trim(); const i=v.indexOf(" · "); return i<0 ? [v,""] : [v.slice(0,i).trim(), v.slice(i+3).trim()]; };
const listOf=t=>(t||"").split("\n").map(x=>x.trim()).filter(x=>/^[-*]\s/.test(x)).map(x=>{ x=x.replace(/^[-*]\s+/,""); const i=x.indexOf("："); return i<0?[x,""]:[x.slice(0,i).trim(), x.slice(i+1).trim()]; });
const STANCE={ "血亲":"blood", "盟":"ally", "仇":"foe", "和":"peace" };
const TIE_WORDS=["母族","联姻","血缘"];          /* these ties are drawn in gold, as blood and marriage */
function loadHouses(){
  return Promise.all(H.map(h=>getMD("家族/"+h.file+".md").then(md=>({h, md})))).then(all=>{
    all.forEach(({h,md})=>{ const [fm,body]=splitFront(md), sec=sectionsOf(body);
      const [rg,rgN]=pairOf(fm.region), [pt,ptN]=pairOf(fm.party), [cb,cbN]=pairOf(fm.cabinet), [ti,tiN]=pairOf(fm.crown), hd=(fm.head||"").trim();
      Object.assign(h,{ seat:xyOf(fm.seat), name:fm.name||h.file, zh:fm.zh||"", badge:fm.badge||"", fallen:/^(是|yes|true)$/i.test(fm.fallen||""),
        region:fm.region||"", party:pt, partyNote:ptN, cab:fm.cabinet||"", head:hd==="待定"?"":hd,
        tie:sec["与王室"]||sec["继承"]||"", quote:sec["一句话"]||"", culture:sec["家族与文化"]||"", secret:sec["秘闻"]||"",
        people:listOf(sec["人物"]),
        m:{ region:rg, sub:rgN, cab:cb, csub:cbN, tie:ti||"—", tsub:tiN, head:hd==="待定"?"":hd.split(/（| · /)[0].trim() } });
      if(fm.talents){ const nameToId={}; H.forEach(x=>{ nameToId[x.name||x.file]=x.id; nameToId[x.file]=x.id; });
        const rel={}; listOf(sec["立场"]).forEach(([n,w])=>{ const id=nameToId[n]; if(id) rel[id]=STANCE[w]||"peace"; });
        SHEET[h.id]={ motto:sec["家训"]||"", blurb:sec["简介"]||"", pts:fm.talents.split("/").map(x=>+x.trim()||0),
          text:["起源","家风"].filter(k=>sec[k]).map(k=>[k,sec[k]]), since:Math.max(0,ERAS.findIndex(e=>e[0]===(fm.since||"").trim())),
          origin:fm.lineage||"", rel }; } });
    /* stance names may refer to houses read later: resolve once everything is in */
    all.forEach(({h,md})=>{ if(!SHEET[h.id]) return; const sec=sectionsOf(splitFront(md)[1]), rel={};
      listOf(sec["立场"]).forEach(([n,w])=>{ const x=H.find(q=>q.name===n||q.file===n); if(x) rel[x.id]=STANCE[w]||"peace"; }); SHEET[h.id].rel=rel; });
    TIES=H.filter(h=>!h.crown && TIE_WORDS.includes(h.m.tie)).map(h=>["helios",h.id]);
    Object.keys(TIE_LABEL).forEach(k=>delete TIE_LABEL[k]); TIES.forEach(([,id])=>{ TIE_LABEL[id]=H.find(h=>h.id===id).m.tie; });
    PARTIES=[]; VH0.forEach(h=>{ let P=PARTIES.find(p=>p[0]===h.party); if(!P) PARTIES.push(P=[h.party,[],h.partyNote]); P[1].push(h.id); if(!P[2]) P[2]=h.partyNote; });
    /* houses of one party stand side by side, so the party row of the structure joins them in one bar */
    VH0.sort((x,y)=>PARTIES.findIndex(p=>p[1].includes(x.id))-PARTIES.findIndex(p=>p[1].includes(y.id)));
  });
}

/* ---------- loading content/省份/ : 目录.md lists the provinces in order, one file per province ----------
   A seat line reads「- 总督：K，Varn 也在｜理由」: the first house holds it, the rest are also there;
  「摇摆：A / B」when nobody holds it outright;「五大家族之外」when none of the houses do. 教会（主教座）marks a bishop's see. */
const SEATS={ "总督":"gov", "兵戈":"force", "教会":"church", "学院":"academy", "商会":"guild", "保民官":"tribune", "Mage":"mage" };
const xyOf=v=>{ const m=String(v||"").match(/(-?[\d.]+)\s*,\s*(-?[\d.]+)/); return m?[+m[1],+m[2]]:null; };
const yesOf=v=>/^(是|yes|true)$/i.test(String(v||"").trim());
function loadProvinces(){
  return getMD("省份/目录.md").then(idx=>{ const list=[]; let region="";
    idx.replace(/\r/g,"").split("\n").forEach(l=>{ l=l.trim(); if(l.startsWith("## ")) region=l.slice(3).trim(); else if(/^[-*]\s/.test(l)) list.push([l.replace(/^[-*]\s+/,""),region]); });
    return Promise.all(list.map(([n,r])=>getMD("省份/"+n+".md").then(md=>[n,r,md]))); })
  .then(all=>{
    const houseOf=n=>{ n=n.trim(); if(n==="王室") return "helios"; const h=H.find(x=>x.name===n||x.file===n); return h?h.id:null; };
    const I={ has:{}, port:[], houses:{} }, provinces=[];
    all.forEach(([file,region,md])=>{ const [fm,body]=splitFront(md), sec=sectionsOf(body), id=file.toLowerCase(), at=xyOf(fm.at), why={};
      (sec["席位"]||"").split("\n").map(x=>x.trim()).filter(x=>/^[-*]\s/.test(x)).forEach(line=>{
        line=line.replace(/^[-*]\s+/,""); const i=line.indexOf("："); if(i<0) return;
        const lab=line.slice(0,i), rest=line.slice(i+1), cut=rest.indexOf("｜"), slot=SEATS[lab.replace(/（.*?）|\(.*?\)/g,"").trim()];
        let v=(cut<0?rest:rest.slice(0,cut)).trim(); if(!slot) return;
        (I.has[slot]=I.has[slot]||{})[id]=/主教座/.test(lab)?2:1; if(cut>=0) why[slot]=rest.slice(cut+1).trim();
        const put=(n,lv)=>{ const h=houseOf(n); if(!h) return; const s=(I.houses[h]=I.houses[h]||{}); (s[slot]=s[slot]||{})[id]=lv; };
        if(/^摇摆[：:]/.test(v)) v.replace(/^摇摆[：:]/,"").split(/\s*[\/、]\s*/).forEach(n=>n&&put(n,1));
        else if(v && !/五大家族之外|^[—-]$/.test(v)){ const [main,...rest2]=v.split(/[，,]/); put(main,2);
          rest2.join("、").replace(/也在/g,"").split(/\s*[、\/]\s*/).forEach(n=>n.trim()&&put(n,1)); } });
      if(yesOf(fm.port)) I.port.push(id);
      const past=(sec["旧事"]||"").split("\n").map(x=>x.trim()).filter(x=>/^\d+[.、]/.test(x)).map(x=>x.replace(/^\d+[.、]\s*/,""));
      const towns=(fm.towns||"").split(" / ").map(t=>t.split(" · ").map(x=>x.trim())).filter(t=>t[0]).map(t=>xyOf(t[0])?["",...t]:t)
        .map(([n,xy,kind])=>({ name:n, xy:xyOf(xy), port:/港/.test(kind||"") })).filter(t=>t.xy);
      provinces.push({ id, name:fm.name||file, region, xy:at, label:xyOf(fm.label)||at, capital:yesOf(fm.capital), palace:xyOf(fm.palace),
        towns, camps:(fm.camps||"").split(" / ").map(xyOf).filter(Boolean),
        dossier:{ role:[...(fm.role||"").split(" · "), region].map(x=>x.trim()).filter(Boolean),   /* who it is, then its region from 目录.md */
        faith:fm.faith||"", living:fm.living||"",
          intro:sec["简介"]||"", look:sec["风貌"]||"", folk:sec["民风"]||"", past, power:sec["局势"]||"", why } }); });
    return { Pv:{ provinces }, I }; });
}

const stage=document.getElementById("stage"), card=document.getElementById("card"), links=document.getElementById("links");
let mode="vault", current="helios";      /* the page opens on the cards; 结构 takes you to the structure */
function makeButtons(){ H.forEach(h=>{
  const b=document.createElement("button"); b.type="button"; b.className="house"+(h.crown?" crown":"")+(h.fallen?" fallen":"");
  b.dataset.id=h.id; b.setAttribute("aria-pressed","false"); b.setAttribute("aria-label",`${h.name}，${h.zh}`);
  b.innerHTML=`<span class="crest">${crest(h.id)}</span><b>${h.name}</b><small>${h.badge||""}</small>`;
  b.addEventListener("click",()=>show(h.id));
  stage.appendChild(b); h.el=b;
}); }
/* columns: a gutter for the row names, then one column per house, left to right from the north's conservatives to the free south */
const GUT=13, MTOP=47, colX=i=>GUT+(i+.5)*(100-GUT)/6;
const VH0=H.filter(h=>!h.crown);
H.forEach(h=>{ h.spec = h.crown ? [GUT+(100-GUT)/2, 10] : [colX(VH0.indexOf(h)), 33]; });
let PARTIES=[];      /* grouped from each house's party by loadHouses */
function buildMatrix(){
  const M=document.getElementById("matrix"); M.style.setProperty("--gut",GUT+"%"); document.getElementById("spec").style.setProperty("--mtop",MTOP+"%");
  const lab=(zh,en,g)=>`<div class="lab"${g?` data-g="${g}"`:""}><b>${zh}</b>${en}</div>`;
  const cell=(h,main,sub,cls="")=>`<div class="c${main?"":" tbd"}${cls}" data-ids="${h.id}"><span class="t">${main||"待定"}${sub?`<small>${sub}</small>`:""}</span></div>`;
  let x=lab("地域","REGION","政治")+VH0.map(h=>cell(h,h.m.region,h.m.sub)).join("");
  x+=lab("党派","PARTY")+PARTIES.map(([n,ids,sub])=>`<div class="c party" data-ids="${ids.join(" ")}" style="grid-column:span ${ids.length}"><span class="t">${n}${sub?`<small>${sub}</small>`:""}</span></div>`).join("");
  x+=lab("内阁","CABINET")+VH0.map(h=>cell(h,h.m.cab,h.m.csub)).join("");
  x+=lab("与王室","CROWN")+VH0.map(h=>cell(h,h.m.tie,h.m.tsub, h.m.tie&&h.m.tie!=="—"?" gold":"")).join("");
  x+=lab("家主","HEAD","家族")+VH0.map(h=>cell(h,h.m.head,"")).join("");
  M.innerHTML=x;
  M.querySelectorAll(".c").forEach(c=>c.addEventListener("click",()=>{ const ids=c.dataset.ids.split(" "); show(ids.includes(current)?current:ids[0]); }));
}
const spoil=s=>s.replace(/【([^】]+)】/g,'<span class="spoil" tabindex="0">$1</span>');
function show(id){
  current=id; const h=H.find(x=>x.id===id);
  H.forEach(x=>x.el.setAttribute("aria-pressed", x.id===id));
  document.querySelectorAll("#matrix .c").forEach(c=>c.classList.toggle("on", c.dataset.ids.split(" ").includes(id)));
  if(typeof draw==="function" && mode==="spec") requestAnimationFrame(draw);
  if(V.chartDraw) V.chartDraw();
  card.innerHTML=`<div class="in">
    <div class="big"><span class="crest">${crest(h.id)}</span><div><h2>${h.name}</h2><div class="tag">${h.region} · ${h.party}</div></div></div>
    <dl class="pol">
      <div><dt>地域</dt><dd>${h.region}</dd></div>
      <div><dt>党派</dt><dd>${h.party}</dd></div>
      <div><dt>内阁</dt><dd>${h.cab}</dd></div>
      <div><dt>${h.crown?"继承":"与王室"}</dt><dd>${h.tie}</dd></div>
      <div><dt>家主</dt><dd${h.head?"":' class="tbd"'}>${h.head||"待定"}</dd></div>
    </dl>
    <dl>
      <div><dt>家族与文化</dt><dd>${spoil(h.culture)}</dd></div>
      ${h.people.length?`<div><dt>人物</dt><dd class="people">${h.people.map(([n,r])=>`<span>${n}<em>${r}</em></span>`).join("")}</dd></div>`:""}
      ${h.secret?`<div><dt>秘闻</dt><dd>${spoil(h.secret)}</dd></div>`:""}
    </dl>
    ${h.id==="south"?`<p class="note">这一家的人物还空着。</p>`:""}
  </div>`;
}
/* the disc: its size follows the stage; houses sit at an angle and a distance from the capital */
function geo(){ const R=stage.getBoundingClientRect(); return { w:R.width, h:R.height, cx:R.width/2, cy:R.height/2, rad:Math.min(R.width*.36, R.height*.47) }; }
function drawDisc(){
  const g=geo(), {cx,cy,rad}=g, el=document.getElementById("disc"); el.setAttribute("viewBox",`0 0 ${f(g.w)} ${f(g.h)}`);
  const at=(deg,r)=>[cx+Math.sin(deg*Math.PI/180)*r, cy-Math.cos(deg*Math.PI/180)*r];
  let t=""; for(let i=0;i<120;i++){ const [x1,y1]=at(i*3,rad-6), [x2,y2]=at(i*3, rad-(i%10===0?14:9)); t+=`M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`; }
  let q=""; [45,135,225,315].forEach(d=>{ const [x1,y1]=at(d,rad*.62), [x2,y2]=at(d,rad-16); q+=`M${f(x1)} ${f(y1)}L${f(x2)} ${f(y2)}`; });
  const lab=(deg,r,txt,anchor,op)=>{ const [x,y]=at(deg,r); return `<text x="${f(x)}" y="${f(y+4)}" text-anchor="${anchor}" font-family="IBM Plex Mono, monospace" font-size="10.5" letter-spacing="2" fill="var(--dim)"${op?` opacity="${op}"`:""}>${txt}</text>`; };
  el.innerHTML=`<g fill="none" stroke="var(--line)"><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rad)}" stroke-width=".8"/><circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rad-6)}" stroke-width=".4"/>
      <path d="${t}" stroke-width=".5"/><path d="${q}" stroke-width=".5" stroke-dasharray="2 4"/>
      <circle cx="${f(cx)}" cy="${f(cy)}" r="${f(rad*.62)}" stroke-width=".5" stroke-dasharray="3 5"/></g>
    ${lab(0,rad-26,"北境 · 夜域","middle")}${lab(192,rad-24,"南境 · 海","end")}${lab(90,rad+12,"东方","start")}${lab(270,rad+12,"西境 · 待定","end",.6)}${lab(300,rad*.62+12,"首都","end")}`;
}
function place(){
  const g=geo();
  H.forEach(h=>{ if(mode==="map"){ const [deg,r]=h.polar; h.el.style.setProperty("--x", f(g.cx+Math.sin(deg*Math.PI/180)*r*g.rad)+"px"); h.el.style.setProperty("--y", f(g.cy-Math.cos(deg*Math.PI/180)*r*g.rad+ (h.crown?12:14))+"px"); }
    else { const [x,y]=h.spec; h.el.style.setProperty("--x",x+"%"); h.el.style.setProperty("--y",y+"%"); }
    h.el.style.visibility = mode==="vault" || mode==="land" ? "hidden" : ""; });
  ["spec","map","vault"].forEach(m=>document.getElementById(m).classList.toggle("off", mode!==m));
  document.getElementById("mSpec").setAttribute("aria-pressed", mode==="spec"||mode==="map"); document.getElementById("mVault").setAttribute("aria-pressed", mode==="vault");
  document.getElementById("mLand").setAttribute("aria-pressed", mode==="land");
  document.documentElement.classList.toggle("land", mode==="land");
  if(mode==="land" && V.landIcon) V.landIcon(); else { try{ setMood(MOOD); }catch(e){} }
  document.querySelector(".grid").classList.toggle("solo", mode==="vault");
  document.documentElement.classList.toggle("vault", mode==="vault");
  links.style.visibility = mode==="vault" ? "hidden" : "";
  const sandOn=!!V.ready; document.documentElement.classList.toggle("sand", sandOn); document.documentElement.classList.toggle("rune-on", sandOn && mode!=="vault");
  H.forEach(h=>h.el.classList.toggle("ghost", sandOn && mode!=="vault"));
  if(V.chartDraw) V.chartDraw();
  if(mode==="map") drawDisc();
  if(mode==="vault"){ if(current==="helios") pick("daeris"); else pick(current); }
  requestAnimationFrame(()=>V.size && V.size());
  follow();
}
/* connectors run like an org chart: straight down, straight across, never diagonal.
   gold for blood and marriage, a plain line for the rest, dashed for a fallen house */
const TIE_LABEL={};      /* filled by loadHouses from each house's crown tie */
function draw(){
  const R=stage.getBoundingClientRect();
  const c=id=>{ const e=H.find(h=>h.id===id).el.querySelector(".crest").getBoundingClientRect();
    return { x:e.left-R.left+e.width/2, y:e.top-R.top+e.height/2, top:e.top-R.top, bot:e.bottom-R.top, l:e.left-R.left, r:e.right-R.left, rad:e.width/2 }; };
  const hc=c("helios"), gap=5, house=H.filter(h=>!h.crown);
  const sty=h=>{ const tie=TIES.some(t=>t[1]===h.id); return `stroke="${tie?"var(--gold)":"var(--line)"}" stroke-width="${tie?1.2:.8}"${h.fallen?' stroke-dasharray="4 4"':""}`; };
  let s="";
  if(mode==="spec"){
    const cs=house.map(h=>({h, ...c(h.id)})), top=Math.min(...cs.map(o=>o.top)), bus=Math.round((hc.bot+top)/2);
    s+=`<path d="M${f(hc.x)} ${f(hc.bot+gap)}V${bus}" stroke="var(--gold)" stroke-width="1.2" fill="none"/>`;
    s+=`<path d="M${f(Math.min(...cs.map(o=>o.x)))} ${bus}H${f(Math.max(...cs.map(o=>o.x)))}" stroke="var(--line)" stroke-width=".8" fill="none"/>`;
    cs.forEach(o=>{ s+=`<path d="M${f(o.x)} ${bus}V${f(o.top-gap)}" ${sty(o.h)} fill="none"/>`;
      s+=`<circle cx="${f(o.x)}" cy="${bus}" r="2" fill="var(--ink)"/>`;
      if(TIE_LABEL[o.h.id]) s+=`<text x="${f(o.x+6)}" y="${f(bus+(o.top-bus)/2+4)}" font-family="IBM Plex Mono, monospace" font-size="10" letter-spacing="1.5" fill="var(--gold)">${TIE_LABEL[o.h.id]}</text>`; });
    /* the gold of the ties runs along the bus from the trunk out to each tied house */
    house.filter(h=>TIE_LABEL[h.id]).forEach(h=>{ const o=c(h.id); s+=`<path d="M${f(hc.x)} ${bus}H${f(o.x)}" stroke="var(--gold)" stroke-width="1.2" fill="none" opacity=".55"/>`; });
    s+=`<circle cx="${f(hc.x)}" cy="${bus}" r="2.6" fill="var(--gold)"/>`;
    /* below each house its thread runs on down through the layers, breaking around each word;
       a party with several houses is a crossbar their threads meet at */
    const M=document.getElementById("matrix"), rows=[...M.children].reduce((a,el)=>{ if(el.classList.contains("lab")) a.push([]); else a[a.length-1].push(el); return a; },[]);

const SHIELD_I=n=>`<svg viewBox="0 0 14 16" aria-hidden="true"><path d="M7 1L13 3V8Q13 12.5 7 15Q1 12.5 1 8V3Z" fill="none" stroke="currentColor" stroke-width="1"/>${n!=null?`<text x="7" y="10.6" text-anchor="middle" font-size="6.4" fill="currentColor" font-family="IBM Plex Mono, monospace">${n}</text>`:""}</svg>`;

function sheet(id){
  const h=H.find(x=>x.id===id), S=SHEET[id], col=DECK[id]?DECK[id].panel:"#888";
  const top=`<button class="close" type="button" id="vClose" aria-label="退出">✕</button>

  if(!S) return `<div class="sh-panel">${top}<div class="pane talents"><p class="sh-empty">这一家的天赋还没有点。</p></div></div>`;
  const frame=(icon,zh,en,meter,row,num,n)=>`<div class="fac" style="--n:${n}"><div class="fac-h"><span class="fac-n">${icon}${zh}<em>${en}</em></span><span class="rule"></span>${meter}</div>
      <div class="fac-row">${row}</div><div class="fac-num"><span class="sp"></span>${num.join("<i></i>")}<span class="sp"></span></div></div>`;

  const right=`<div class="sh-col sh-right"><p class="sh-motto">“${S.motto}”</p>

      <p class="sh-desc" id="shDesc">${S.blurb}</p></div>`;
  const hist=`<div class="pane hist"><div class="sh-lab">传承<em>${S.origin}</em></div>${eras}</div>`;
  return `<div class="sh-panel">${top}<div class="pane talents"><div class="sh-col sh-mid">${facs}${stance}</div></div>${right.replace('class="sh-col sh-right"','class="pane dossier sh-col sh-right"')}${hist}</div>`;
}
function flip(id){
